name: PR Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # single logical command; YAML folds the wrapped lines back together
        run: >-
          pnpm
          install --frozen-lockfile

      - name: Build docs
        run: pnpm build
