# ---------------------------------------------------------------------------
# zh translations of the quickstart page prose (T6-2). Consumed by
# scripts/gen-nodes.mjs --locale zh -> docs/zh/quickstart/index.md.
#
# 页面散文片段的简体中文译文。库表行、节点表行与 curl 示例与英文版同源，
# 不在本文件内翻译（表列头除外）；链接目标一律保持英文版原样，仅链接文字可译。
# 术语遵循 docs/.vitepress/zh-glossary.json 的冻结基线：动态全局属性
# （dynamic global properties）等术语首现时采用『中文（English）』括注；
# STEEM、JSON-RPC、steemd、steem-js、steemgosdk、steem-python 等代号保留英文。
# {updated} 与 {example_url} 为生成器占位符，不得删除。
# ---------------------------------------------------------------------------
schema: lc-quickstart/v1
locale: zh-Hans
strings:
  title: 快速开始
  description: 选择一个 Steem 客户端库，连接到一个公共 API 节点，并完成你的第一次 JSON-RPC 调用。
  intro: |-
    连接 Steem 区块链需要做两个决定：为你的技术栈选择一个**客户端库**（client library），然后将它指向一个 **API 节点**（API node）。本页会依次介绍这两步，几分钟内即可发出你的第一个请求。
  choose_library:
    heading: 选择一个库
    lead: |-
      依托官方客户端库访问 Steem 数据十分简单，可依据你的基础设施与目标进行选择：
    table_headers: [语言, 库, 说明]
    note: |-
      这些库都通过 JSON-RPC 与 `steemd` 节点通信——下一节的连接配置对其中任何一个都适用。
  connect_node:
    heading: 连接到节点
    lead: |-
      直接与 Steem 区块链交互的应用需要连接到一个 `steemd` 节点。你可以运行自己的实例，也可以先从下方列出的公共 API 节点中选一个入手。
    websocket_note: |-
      虽然 `steemd` 完整支持 WebSocket（`wss://` 与 `ws://`），但公共节点通常不支持。此处列出的所有节点均使用 HTTPS。
    table_headers: [URL, 运营者]
    freshness_note: |-
      此列表由社区维护，可能随时变化。上方每个节点均在 {updated} 通过直接的 JSON-RPC 调用验证在线；未通过测试的节点已被移除。如果某个节点停止响应，请改用表中的其他条目。
  test_curl:
    heading: 用 curl 测试节点
    lead: |-
      每个公共节点都通过 HTTPS 提供 JSON-RPC 服务。下面的示例向 {example_url} 请求链的动态全局属性（dynamic global properties）——响应中的 `head_block_number` 字段就是该节点所服务链的顶端区块：
  closing: |-
    同样的请求信封（envelope）适用于 [API 参考](/api/) 中的每一个方法——把它指向表中的任意节点，或将该 URL 填入你的客户端库的节点设置。
