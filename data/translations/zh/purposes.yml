  condenser_api.list_proposal_votes: |-
    返回全部提案（proposal）投票（vote），从指定的投票者或 `proposal.id` 开始。参数：`start:array`；`limit:int`；`order:string`；`order_direction:string`；`status:string`

    * `start` 取决于 `order`（见下文）
      * `voter` - 提案的投票者（账户名字符串）
      * `proposal.id` - 提案的 id（int）
    * `limit` 最大 1000。
    * `order` 可取以下值：
      * `by_voter_proposal` - 按提案投票者排序
      * `by_proposal_voter` - 按 `proposal.id` 排序
    * `order_direction` 可取以下值：
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `["alice"]` | 10 | `by_voter_proposal` | `ascending` | `active` | 列出 10 条 active 状态的提案，按投票者升序排列 |
    | `[10]` | 1000 | `by_proposal_voter` | `ascending` | `votable` | 列出提案 10 的 1000 条投票，按 `proposal.id` 升序排列 |

    另见：datbase_api.list_proposals
  condenser_api.list_proposals: |-
    返回全部提案（proposal），从指定的创建者或开始日期开始。参数：`start:array`；`limit:int`；`order:string`；`order_direction:string`；`status:string`

    * `start` 取决于 `order`（见下文）
      * `creator` - 提案的创建者（账户名字符串）
      * `start_date` - 提案的开始日期（日期字符串）
      * `end_date` - 提案的结束日期（日期字符串）
      * `total_votes` - 提案的总票数（int）
    * `limit` 最大 1000。
    * `order` 可取以下值：
      * `by_creator` - 按提案创建者排序
      * `by_start_date` - 按提案开始日期排序
      * `by_end_date` - 按提案结束日期排序
      * `by_total_votes` - 按提案总票数排序
    * `order_direction` 可取以下值：
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `[""]` | 10 | `by_creator` | `ascending` | `active` | 列出 10 条 active 状态的提案，按创建者升序排列 |
    | `["2019-08-07T16:54:03"]` | 1000 | `by_start_date` | `ascending` | `inactive` | 列出自 2019-08-07T16:54:03 起 inactive 状态的 1000 条提案，按开始日期升序排列 |
    | `["a"]` | 1 | `by_creator` | `ascending` | `expired` | 列出以 "a" 开头账户的 1 条 expired 状态提案，按创建者升序排列 |
    | `["alice"]` | 10 | `by_creator` | `ascending` | `all` | 列出 alice 的 10 条任意状态提案，按创建者升序排列 |
    | `[""]` | 1000 | `by_creator` | `ascending` | `votable` | 列出 1000 条 votable 状态的提案，按创建者升序排列 |
    | `[10]` | 1000 | `by_total_votes` | `ascending` | `votable` | 列出至少有 10 票的 1000 条 votable 状态提案，按创建者升序排列 |

    另见：datbase_api.list_proposals
