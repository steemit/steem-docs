  condenser_api.get_discussions_by_comments: |-
    返回按 comments 排序的讨论（discussion）列表。

    另见：tags_api.get_discussions_by_comments
  condenser_api.get_discussions_by_created: |-
    返回按 created 排序的讨论（discussion）列表。

