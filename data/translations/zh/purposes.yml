  condenser_api.get_discussions_by_votes: |-
    返回按 votes 排序的讨论（discussion）列表。

    另见：tags_api.get_discussions_by_votes
  condenser_api.get_dynamic_global_properties: |-
    返回当前的动态全局属性（dynamic global properties）。参见：Understanding Dynamic Global Properties

    另见：database_api.get_dynamic_global_properties

  condenser_api.get_escrow: |-
    按 id 返回特定账户的托管（escrow）。

    另见：database_api.list_escrows
  condenser_api.get_expiring_vesting_delegations: |-
    返回某账户正在到期的权益份额委托（expiring vesting delegation）。参数：`account:string`；`after:timestamp`

    | `account` (string) | `after` (timestamp) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"2018-01-01T00:00:00"` | 查询 2018 年 1 月 1 日之后到期的权益份额委托。 |
    | `"alice"` | `"2017-12-01T00:00:00"` | 查询 2017 年 12 月 1 日之后到期的权益份额委托。 |
  condenser_api.get_feed: |-
    返回某账户动态（feed）中的条目列表。参数：`account:string`；`start_entry_id:int`；`limit:int` 最大 500

    | `account` (string) | `start_entry_id` (int) | `limit` (int) | |
    |-------------------|---------------|---------------|-|
    | `"steemit"` | `0` | `1` | 查询名为 `steemit` 的账户，从第一条条目开始，最多一条结果。 |
    | `"alice"` | `1` | `10` | 查询名为 `alice` 的账户，从第二条条目开始，最多 10 条结果。 |

    另见：follow_api.get_feed、Paginated API Methods
  condenser_api.get_feed_entries: |-
    返回某账户动态（feed）中的条目（entry）列表。参数：`account:string`；`start_entry_id:int`；`limit:int` 最大 500

    | `account` (string) | `start_entry_id` (int) | `limit` (int) | |
    |-------------------|---------------|---------------|-|
    | `"steemit"` | `0` | `1` | 查询名为 `steemit` 的账户，从第一条条目开始，最多一条结果。 |
    | `"alice"` | `1` | `10` | 查询名为 `alice` 的账户，从第二条条目开始，最多 10 条结果。 |

    另见：follow_api.get_feed_entries、Paginated API Methods
  condenser_api.get_feed_history: |-
    返回喂价（feed price）取值的历史记录。

    另见：database_api.get_feed_history
  condenser_api.get_follow_count: |-
    返回某账户的关注者（follower）/正在关注（following）数量。参数：`account:string`

    | `account` (string) | |
    |-------------------|-|
    | `"steemit"` | 查询名为 `steemit` 的账户。 |
    | `"alice"` | 查询名为 `alice` 的账户。 |

    另见：follow_api.get_follow_count
  condenser_api.get_followers: |-
    返回某账户的关注者（follower）列表。参数：`account:string`；`start:string`（起始账户）；`type:string`，例如：`blog`；`limit:int` 最大 1000

    | `account` (string) | `start` (string) | `type` (string) | `limit` (int) | |
    |--------------------|------------------|-----------------|---------------|-|
    | `"steemit"` | `null` | `"blog"` | `10` | 查询名为 `steemit` 的账户的关注（follow）关系，最多 10 条结果。 |
    | `"alice"` | `null` | `"ignore"` | `100` | 查询名为 `alice` 的账户的屏蔽（mute）关系，最多 100 条结果。 |

    另见：follow_api.get_followers、Paginated API Methods
  condenser_api.get_following: |-
    返回正在关注某账户的账户列表。参数：`account:string`；`start:string`（起始账户）；`type:string`，例如：`blog`；`limit:int` 最大 1000

    | `account` (string) | `start` (string) | `type` (string) | `limit` (int) | |
    |--------------------|------------------|-----------------|---------------|-|
    | `"steemit"` | `null` | `"blog"` | `10` | 查询名为 `steemit` 的账户的关注（follow）关系，最多 10 条结果。 |
    | `"alice"` | `null` | `"ignore"` | `100` | 查询名为 `alice` 的账户的屏蔽（mute）关系，最多 100 条结果。 |

    另见：follow_api.get_following、Paginated API Methods
  condenser_api.get_hardfork_version: |-
    返回当前硬分叉（hardfork）版本。

    另见：database_api.get_hardfork_properties
  condenser_api.get_key_references: |-
    返回所有在 owner 或 active 权限（authority）中关联了该密钥的账户。

    另见：account_by_key_api.get_key_references
  condenser_api.get_market_history: |-
    返回内部 SBD:STEEM 市场的行情历史（market history）。参数：`bucket_seconds:int`；`start:timestamp`；`end:timestamp`

    | `bucket_seconds` (int) | `start` (timestamp) | `end` (timestamp) | |
    |------------------------|---------------------|-------------------|-|
    | `15` | `"2018-01-01T00:00:00"` | `"2018-01-02T00:00:00"` | 查询 2018 年 1 月 1 日至 2018 年 1 月 2 日之间的行情历史，按 15 秒分段。 |
    | `60` | `"2018-01-01T00:00:00"` | `"2018-01-02T00:00:00"` | 查询 2018 年 1 月 1 日至 2018 年 1 月 2 日之间的行情历史，按 1 分钟分段。 |
    | `300` | `"2018-01-01T00:00:00"` | `"2018-01-02T00:00:00"` | 查询 2018 年 1 月 1 日至 2018 年 1 月 2 日之间的行情历史，按 5 分钟分段。 |
    | `3600` | `"2018-01-01T00:00:00"` | `"2018-01-02T00:00:00"` | 查询 2018 年 1 月 1 日至 2018 年 1 月 2 日之间的行情历史，按 1 小时分段。 |
    | `86400` | `"2018-01-01T00:00:00"` | `"2018-01-02T00:00:00"` | 查询 2018 年 1 月 1 日至 2018 年 1 月 2 日之间的行情历史，按 1 天分段。 |

    另见：market_history_api.get_market_history
  condenser_api.get_market_history_buckets: |-
    返回插件正在跟踪的 bucket 秒值（bucket seconds）。

    另见：market_history_api.get_market_history_buckets
