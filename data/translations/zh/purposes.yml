    返回按最后更新排序的回复（reply）列表。

    另见：Paginated API Methods
  tags_api.get_tags_used_by_author: |-
    返回某作者使用过的标签（tag）列表。
  tags_api.get_trending_tags: |-
    返回趋势标签（trending tag）列表。

    另见：Paginated API Methods
  transaction_status_api.find_transaction: |-
    返回给定交易 id（transaction id）的状态。参数：`trx_id:string`；`expiration:timestamp`（可选）

    结果将包含以下 `status` 值之一：

    | 状态 | 含义 |
    |--------|---------|
    | `unknown` | 到期时间在未来，交易未包含在区块或内存池（mempool）中 |
    | `within_mempool` | 交易位于内存池（mempool）中 |
    | `within_reversible_block` | 交易已包含在区块中，但区块尚不可逆 |
    | `within_irreversible_block` | 交易已包含在区块中，且区块不可逆 |
    | `expired_reversible` | 交易已过期，交易并非不可逆（交易可能位于分叉中） |
    | `expired_irreversible` | 交易已过期，交易不可逆（交易不可能位于分叉中） |
    | `too_old` | 交易过于久远，节点对其一无所知 |
  witness_api.get_account_bandwidth: |-
    **自 0.20.6 起已禁用，参见：[#3029](https://github.com/steemit/steem/issues/3029#issuecomment-428404844)**

    返回账户的可用带宽（bandwidth）。参见：Forum/Market Bandwidth
  witness_api.get_reserve_ratio: |-
    **自 0.20.6 起已禁用，参见：[#3029](https://github.com/steemit/steem/issues/3029#issuecomment-428404844)**

    返回当前的准备金率（reserve ratio）。
