# ---------------------------------------------------------------------------
# ru translations of the quickstart page prose (T6-2). Consumed by
# scripts/gen-nodes.mjs --locale ru -> docs/ru/quickstart/index.md.
#
# Русские переводы текстовых фрагментов страницы. Строки таблицы библиотек,
# таблицы узлов и пример curl берутся из английского источника и здесь не
# переводятся (кроме заголовков колонок); адреса ссылок сохраняются как в
# английской версии, переводится только текст ссылок. Терминология следует
# замороженной базе docs/.vitepress/ru-glossary.json: «динамические глобальные
# свойства (dynamic global properties)» — при первом упоминании с английским
# уточнением; STEEM, JSON-RPC, steemd, steem-js, steemgosdk, steem-python и
# другие идентификаторы сохраняются на английском. {updated} и {example_url} —
# заполнители генератора, удалять их нельзя.
# ---------------------------------------------------------------------------
schema: lc-quickstart/v1
locale: ru
strings:
  title: Быстрый старт
  description: Выберите клиентскую библиотеку Steem, подключитесь к публичному API-узлу и выполните свой первый JSON-RPC-вызов.
  intro: |-
    Подключение к блокчейну Steem требует двух решений: выберите **клиентскую библиотеку** (client library) для своего стека, а затем укажите её на **API-узел** (API node). Эта страница проходит оба шага, чтобы вы могли выполнить первый запрос за считанные минуты.
  choose_library:
    heading: Выберите библиотеку
    lead: |-
      Обращаться к данным Steem несложно через официальные клиентские библиотеки — выбор зависит от вашей инфраструктуры и целей:
    table_headers: [Язык, Библиотека, Описание]
    note: |-
      Все эти библиотеки общаются с узлом `steemd` по JSON-RPC — настройка подключения из следующего раздела применима к каждой из них.
  connect_node:
    heading: Подключение к узлу
    lead: |-
      Приложениям, которые работают с блокчейном Steem напрямую, нужно подключаться к узлу `steemd`. Вы можете запустить собственный экземпляр или начать с одного из публичных API-узлов ниже.
    websocket_note: |-
      Хотя `steemd` полностью поддерживает WebSockets (`wss://` и `ws://`), публичные узлы обычно — нет. Все перечисленные здесь узлы используют HTTPS.
    table_headers: [URL, Оператор]
    freshness_note: |-
      Этот список поддерживается сообществом и может измениться в любой момент. Каждый узел выше был проверен вживую прямым JSON-RPC-вызовом {updated}; не прошедшие проверку узлы удалены. Если узел перестал отвечать, переключитесь на другую запись из таблицы.
  test_curl:
    heading: Проверка узла с помощью curl
    lead: |-
      Каждый публичный узел говорит на JSON-RPC поверх HTTPS. Пример ниже запрашивает у {example_url} динамические глобальные свойства (dynamic global properties) цепочки — поле `head_block_number` в ответе является вершиной цепочки, которую обслуживает данный узел:
  closing: |-
    Тот же конверт запроса работает для каждого метода из [Справочника API](/api/) — направьте его на любой узел из таблицы выше или передайте URL в настройку узла вашей клиентской библиотеки.
