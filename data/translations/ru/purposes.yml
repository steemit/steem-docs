  condenser_api.get_witnesses_by_vote: |-
    Возвращает текущих свидетелей (witness) по голосам. Параметры: `start_name:string`; `limit:int` до 1000

    | `account` (string) | `limit` (int) | |
    |--------------------|---------------|-|
    | `null` | `21` | Запрос топ-21 голосов за свидетелей. |
    | `"a"` | `1` | Запрос топ-10 голосов за свидетелей, начинающихся с "a". |

    См. также: database_api.list_witnesses
  condenser_api.list_proposal_votes: |-
    Возвращает все голоса за предложения (proposal vote), начиная с указанного голосующего или `proposal.id`. Параметры: `start:array`; `limit:int`; `order:string`; `order_direction:string`; `status:string`

    * `start` зависит от `order` (см. ниже)
      * `voter` - голосующий за предложение (строка с именем аккаунта)
      * `proposal.id` - идентификатор предложения (int)
    * `limit` - до 1000.
    * `order` может быть одним из:
      * `by_voter_proposal` - упорядочение по голосующему за предложение
      * `by_proposal_voter` - упорядочение по `proposal.id`
    * `order_direction` может быть одним из:
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `["alice"]` | 10 | `by_voter_proposal` | `ascending` | `active` | список 10 предложений со статусом active, упорядоченных по голосующему, по возрастанию |
    | `[10]` | 1000 | `by_proposal_voter` | `ascending` | `votable` | список 1000 голосов по предложению 10, упорядоченных по `proposal.id`, по возрастанию |

    См. также: datbase_api.list_proposals
  condenser_api.list_proposals: |-
    Возвращает все предложения (proposal), начиная с указанного создателя или даты начала. Параметры: `start:array`; `limit:int`; `order:string`; `order_direction:string`; `status:string`

    * `start` зависит от `order` (см. ниже)
      * `creator` - создатель предложения (строка с именем аккаунта)
      * `start_date` - дата начала предложения (строка с датой)
      * `end_date` - дата окончания предложения (строка с датой)
      * `total_votes` - всего голосов у предложения (int)
    * `limit` - до 1000.
    * `order` может быть одним из:
      * `by_creator` - упорядочение по создателю предложения
      * `by_start_date` - упорядочение по дате начала предложения
      * `by_end_date` - упорядочение по дате окончания предложения
      * `by_total_votes` - упорядочение по числу голосов предложения
    * `order_direction` может быть одним из:
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `[""]` | 10 | `by_creator` | `ascending` | `active` | список 10 предложений со статусом active, упорядоченных по создателю, по возрастанию |
    | `["2019-08-07T16:54:03"]` | 1000 | `by_start_date` | `ascending` | `inactive` | список 1000 предложений со статусом inactive, упорядоченных по дате начала, по возрастанию, начиная с 2019-08-07T16:54:03 |
    | `["a"]` | 1 | `by_creator` | `ascending` | `expired` | список 1 предложения со статусом expired, упорядоченного по создателю, по возрастанию, по аккаунтам, начинающимся с "a" |
    | `["alice"]` | 10 | `by_creator` | `ascending` | `all` | список 10 предложений с любым статусом, упорядоченных по создателю, по возрастанию, по alice |
    | `[""]` | 1000 | `by_creator` | `ascending` | `votable` | список 1000 доступных для голосования (votable) предложений, упорядоченных по создателю, по возрастанию |
    | `[10]` | 1000 | `by_total_votes` | `ascending` | `votable` | список 1000 доступных для голосования (votable) предложений, упорядоченных по создателю, по возрастанию, с не менее чем 10 голосами |

    См. также: datbase_api.list_proposals
