  database_api.find_vesting_delegations: |-
    Возвращает список делегирований вестинга (vesting delegation) для аккаунта. Параметры: `account:string`

    | `account` (string) | | |
    |----------------------------|---------------|-|
    | `"steemit"` | | Запрос вестинга (vesting) для `steemit`. |
    | `"alice"` | | Запрос вестинга (vesting) для `alice`. |
  database_api.find_votes: |-
