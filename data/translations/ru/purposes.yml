    | `"steem"` | 10 | Запрос тегов после "steem", до 10 тегов. |

    См. также: tags_api.get_trending_tags, Paginated API Methods
  condenser_api.get_version: |-
    Возвращает версии блокчейна, steem и FC.

    См. также: database_api.get_version, Paginated API Methods
  condenser_api.get_vesting_delegations: |-
    Возвращает делегирования вестинга (vesting delegation), сделанные аккаунтом. Параметры: `delegator_account:string`; `start_account:string`; `limit:int` до 1000

