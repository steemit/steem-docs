    **Примечание:** смещение строки равно `page * page_size`. `page_size` обязателен; при его отсутствии возвращается `-32602` (как в позиционной, так и в именованной форме).

    | `account` (string) | `page` (int) | `page_size` (int) | |
    |--------------------|--------------|-------------------|-|
    | `"steemit"` | `0` | `5` | Запрос первой страницы (страница `0`) аккаунтов, подписанных на `steemit`, по 5 на страницу. |
    | `"alice"` | `1` | `100` | Запрос страницы `1` — пропускает первые 100 строк — аккаунтов, подписанных на `alice`, по 100 на страницу. |

