# ---------------------------------------------------------------------------
# ru translations of API method purposes — batch 1-5（238 条全量）
# (phase4-plan §1-T27；schema/风格沿用 zh-method-purposes/v1，batch 字段标
# 语言内批次：batch 1 = C 序 #1-48、batch 2 = #49-96、batch 3 = #97-144、
# batch 4 = #145-192、batch 5 = #193-238，按写入顺序)
#
# api_method -> русский перевод purpose。原文以 data/apidefinitions/*.yml 中
# 现有 en purpose 字段为准，不增不减不改语义；markdown 结构（表格/列表/加粗/
# 链接）按原文保留，仅翻译文字内容。
#
# 术语遵循 docs/.vitepress/ru-glossary.json 的 30 条冻结基线（свидетель、
# курация、доли вестинга (VESTS)、ресурсные кредиты (RC) 等）；方法名、
# 参数名、字段值、API 名与被引用文档页标题保留英文。术语首次出现按 glossary
# conventions 使用『俄语译法 (English)』格式；行文为简洁说明句，不使用感叹号。
#
# en 原文的既有缺陷语义如实保留，不擅自“修正”：datbase_api.list_proposals
# 引用拼写（condenser_api.list_proposal_votes/list_proposals 各 1 处）、
# get_vesting_delegations 另见行 Paginated API Methods 重复、
# get_blog_authors 表内 alice". 缺左引号、list_accounts/list_owner_histories
# 等断表（列数不齐）、list_limit_orders/list_witness_votes 表内 order 值串行
# （by_effective_date/by_withdraw_route/by_destination）、
# "next next vesting withdrawal" 等均照原文直译或原样保留。
#
# 死方法（deprecated/disabled/removed 三族 35 个）照常翻译，不因死亡而省略；
# 23 个三期新增方法（bridge 系 14、condenser_api follow 分页对 2、chain_api 2、
# hive 1、tags 1、call 1 及 T22 补页清单其余）全部在内。
#
# 排序口径仍为 LC_ALL=C（字节序），是唯一口径。机械核验（LC_ALL=C sort 对
# en_US.UTF-8 sort）确认全量 238 键共有 5 处 C/UTF-8 collation 分歧对：
#   1. condenser_api.get_account_votes ↔ get_accounts（C #39/#40）
#   2. condenser_api.get_witness_schedule ↔ get_witnesses（C #110/#111，
#      UTF-8 下 schedule 排到 get_witnesses_by_vote 之后）
#   3. condenser_api.list_proposal_votes ↔ list_proposals（C #113/#114）
#   4. database_api.list_proposal_votes ↔ list_proposals（C #161/#162）
#   5. database_api.list_witness_votes ↔ list_witnesses（C #172/#173）
# 各分歧对均整体落在同一 batch 窗口内，batch 边界一律按本头注记的 C 序执行。
#
# 消费方：scripts/gen-api-docs.mjs --locale ru。
# ---------------------------------------------------------------------------
schema: zh-method-purposes/v1
locale: ru
batch: 1-5
purposes:
  account_by_key_api.get_key_references: |-
    Возвращает все аккаунты, у которых данный ключ ассоциирован с полномочиями (authority) owner или active.
  account_history_api.enum_virtual_ops: |-
    Возвращает виртуальные операции (virtual operation) в диапазоне блоков (block) с возможностью фильтрации по аккаунту и типу операции.
  account_history_api.get_account_history: |-
    Возвращает историю аккаунта (account history) — все операции заданного аккаунта.

    См. также: Paginated API Methods
  account_history_api.get_ops_in_block: |-
    Возвращает все операции, содержащиеся в блоке (block).
  account_history_api.get_transaction: |-
    Возвращает подробные сведения о транзакции (transaction) по идентификатору транзакции (transaction id).
  block_api.get_block: |-
    Извлекает полный подписанный блок (block) по указанной ссылке, либо null, если совпадающий блок не найден.

    **Parameters:**

      * `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Запрос самого первого блока. |
    | `8675309` | Запрос блока с номером 8 675 309. |
    | `62396745` | Запрос блока с номером 62 396 745. |
  block_api.get_block_header: |-
    Извлекает заголовок блока (block header) по указанной ссылке, либо null, если совпадающий блок не найден.

    **Parameters:**

      * `block_num:int` - высота блока (block), заголовок которого нужно вернуть

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Запрос заголовка самого первого блока. |
    | `8675309` | Запрос заголовка блока с номером 8 675 309. |
    | `62396745` | Запрос заголовка блока с номером 62 396 745. |
  bridge.account_notifications: |-
    Уведомления (notification) аккаунта.

    Поддерживаемые значения `type`:
      * `new_community` - создано новое сообщество (community)
      * `set_role` - модератор/администратор добавляет аккаунту роль
      * `set_props` - заданы свойства сообщества
      * `set_label` - аккаунту присвоены звание/значок/метка (title/badge/label)
      * `mute_post` - пост заглушён (muted), с указанием причины
      * `unmute_post` - с поста снята заглушка (unmuted), с указанием причины
      * `pin_post` - пост закреплён (pinned)
      * `unpin_post` - пост откреплён (unpinned)
      * `flag_post` - пост помечен флагом (flag) участником, с указанием причины
      * `error` - обратная связь для разработчиков по операциям, которые не удаётся интерпретировать
      * `subscribe` - аккаунт подписался на сообщество
      * `reply` - на пост дан ответ
      * `reblog` - пост реблогнут (reblogged/resteemed)
      * `follow` - аккаунт подписался на другой аккаунт
      * `mention` - автор упомянул аккаунт
      * `vote` - голосующий отдал голос за автора

    Значение `score` определяется рангом (rank) аккаунта-источника.
  bridge.get_account_posts: |-
    Возвращает посты (post) аккаунта — блог (blog), ленту (feed), комментарии или ответы.

    Поддерживаемые значения `sort`:
      * `blog`
      * `feed`
      * `posts`
      * `comments`
      * `replies`
      * `payout`

    Параметры: `sort:string`; `account:string`; `start_author:string` (необязательный, по умолчанию пусто); `start_permlink:string` (необязательный, по умолчанию пусто); `limit:int` (необязательный, по умолчанию `20`, максимум `100`); `observer:string` (необязательный)

    См. также: bridge.get_ranked_posts
  bridge.get_community: |-
    Возвращает сведения о сообществе (community).
  bridge.get_community_context: |-
    Для пары сообщество/аккаунт возвращает роль аккаунта, звание и состояние подписки (subscription).

    Параметры: `name:string` (имя сообщества, например: `hive-123456`); `account:string`

    См. также: bridge.get_community
  bridge.get_discussion: |-
    Возвращает полную ветку обсуждения (тред) — корневой пост (post) и его ответы, с ключами вида `author/permlink`. Это замена hivemind для части `condenser_api.get_state`, отвечающей за ветку.

    Параметры: `author:string`; `permlink:string`
  bridge.get_payout_stats: |-
    Возвращает статистику выплат (payout) для построения картограммы (treemap): суммарная выплата блога плюс один кортеж (tuple) `(url, label, payout, posts, authors)` для каждого сообщества из топа.

    Параметры: `limit:int` (необязательный, по умолчанию `250`, максимум `250`)
  bridge.get_post: |-
    Возвращает отдельный пост (post).

    Параметры: `author:string`; `permlink:string`; `observer:string` (необязательный)
  bridge.get_post_header: |-
    Возвращает базовые данные поста (post): автор, пермалинк (permlink), категория и глубина.

    Параметры: `author:string`; `permlink:string`
  bridge.get_profile: |-
    Загружает данные аккаунта/профиля (profile): метаданные, репутацию, статистику подписок (follow) и чёрные списки (blacklist).

    Параметры: `account:string`; `observer:string` (необязательный)
  bridge.get_ranked_posts: |-
    Возвращает ранжированные посты (post).

    Поддерживаемые значения `sort`:
      * `trending`
      * `hot`
      * `created`
      * `promoted`
      * `payout`
      * `payout_comments`
      * `muted`

    Значение `tag` может быть любым допустимым тегом (tag).

    Значение `observer` может быть любым допустимым аккаунтом или пустой строкой.
  bridge.get_trending_topics: |-
    Возвращает главные популярные темы (trending topics) среди постов (post), ожидающих выплаты (pending), — смесь сообществ (community) и тегов (tag).

    Параметры: `limit:int` (необязательный, по умолчанию `10`, максимум `25`); `observer:string` (необязательный, пока не используется)
  bridge.list_all_subscriptions: |-
    Перечисляет все подписки (subscription) аккаунта на сообщества (community).
  bridge.list_communities: |-
    Перечисляет все сообщества (community) с постраничным выводом (pagination). Возвращает облегчённый список сообществ.

    Поддерживаемые значения `sort`:
      * `rank`
      * `new`
      * `subs`

    Параметры: `last:string` (необязательный, по умолчанию пусто); `limit:int` (необязательный, по умолчанию `100`, максимум `100`); `query:string` (необязательный, полнотекстовый поиск по названию и описанию); `sort:string` (необязательный, по умолчанию `rank`); `observer:string` (необязательный)

    См. также: bridge.get_community
  bridge.list_community_roles: |-
    Перечисляет роли сообщества (community) и метки (label) для каждого аккаунта в сообществе.
  bridge.list_pop_communities: |-
    Перечисляет сообщества (community) по числу новых подписчиков (subscriber). Возвращает облегчённый список сообществ.

    Параметры: `limit:int` (необязательный, по умолчанию `25`, максимум `25`)

    Примечание: по состоянию на 2026-10-28 публичные узлы возвращают на этот вызов серверную ошибку (в развёрнутой сборке hivemind параметр запроса `cutoff` никогда не привязывается). Пример ответа ниже показывает ожидаемую форму.
  bridge.list_subscribers: |-
    Перечисляет подписчиков (subscriber) сообщества (community) (до 250, начиная с новейших) в виде кортежей (tuple) `name`/`role`/`title`/`created_at`.

    Параметры: `community:string` (например: `hive-123456`)
  bridge.normalize_post: |-
    Принимает объект поста (post) steemd (в том виде, в каком его возвращает `condenser_api.get_content`) и выдаёт нормализованную версию bridge-api.

    Параметры: `post:object` (полный объект поста steemd, ровно в том виде, в каком его возвращает `condenser_api.get_content`; передаётся завёрнутым в одноэлементный массив: `params: [{ <post object> }]`)

    **Примечание:** объект поста должен нести полный набор полей steemd — пример ниже для читаемости сокращает только `body`. Передача «голого» объекта как `params` (без обёртки в массив) возвращает `-32602`; неполный объект (например, записи `active_votes` без `percent`/`reputation` или отсутствующие поля выплаты (payout), такие как `cashout_time`) возвращает `-32000`.
  bridge.post_notifications: |-
    Загружает уведомления (notification) для конкретного поста (post).

    Параметры: `author:string`; `permlink:string`; `min_score:int` (необязательный, по умолчанию `25`); `last_id:int` (необязательный, искать начиная с этого идентификатора уведомления); `limit:int` (необязательный, по умолчанию `100`, максимум `100`)

    Примечание: по состоянию на 2026-10-28 публичные узлы возвращают на этот вызов внутреннюю ошибку для постов, у которых есть уведомления. Отклик ниже показывает ожидаемую форму ответа.

    См. также: bridge.account_notifications
  bridge.unread_notifications: |-
    Загружает состояние уведомлений (notification) для указанного аккаунта: время последнего чтения и число непрочитанных уведомлений с оценкой не ниже `min_score`.

    Параметры: `account:string`; `min_score:int` (необязательный, по умолчанию `25`)

    См. также: bridge.account_notifications
  call: |-
    Маршрутизирует запросы метода `call` в устаревшем стиле.

    Параметры: `api:string` (принимается только `condenser_api`); `method:string` (один из маршрутизируемых методов condenser_api: get_followers, get_following, get_followers_by_page, get_following_by_page, get_follow_count, get_content, get_content_replies, get_trending_tags, get_state, get_discussions_by_trending, get_discussions_by_hot, get_discussions_by_promoted, get_discussions_by_created, get_post_discussions_by_payout, get_comment_discussions_by_payout, get_discussions_by_blog, get_discussions_by_feed, get_discussions_by_comments, get_replies_by_last_update, get_discussions_by_author_before_date, get_blog, get_blog_entries, get_account_votes); `params:array` (параметры маршрутизируемого метода)

    Любой другой метод возвращает ошибку.
  chain_api.push_block: |-
    Проталкивает блок (block) на узел.

    Параметры: `block:object` (подписанный блок); `currently_syncing:bool` (необязательный, по умолчанию `false`)

    Возвращает `success:bool` и, при сбое, `error:string`.
  chain_api.push_transaction: |-
    Проталкивает транзакцию (transaction) на узел.

    Параметры: сам объект подписанной транзакции, без обёртки: `ref_block_num:int`; `ref_block_prefix:int`; `expiration:timestamp`; `operations:array`; `extensions:array`; `signatures:array`

    Возвращает `success:bool` и, при сбое, `error:string`.
  condenser_api.broadcast_block: |-
    Используется для широковещания (broadcast) блока (block).

    См. также: network_broadcast_api.broadcast_block
  condenser_api.broadcast_transaction: |-
    Используется для широковещания (broadcast) транзакции (transaction).

    См. также: network_broadcast_api.broadcast_transaction
  condenser_api.broadcast_transaction_synchronous: |-
    Используется для широковещания транзакции (transaction) и синхронно дожидается её обработки.
  condenser_api.find_proposals: |-
    Ищет предложения (proposal) по `proposal.id` (а не `proposal.proposal_id`).

    См. также: database_api.find_proposals
  condenser_api.get_account_bandwidth: |-
    **Отключён с версии 0.20.6, см.: [#3029](https://github.com/steemit/steem/issues/3029#issuecomment-428404844)**

    Возвращает доступную пропускную способность (bandwidth) аккаунта. Параметры: `account:string`; `type:string`, например: `forum` или `market`

    | `account` (string) | `type` (string) | |
    |--------------------|-----------------|-|
    | `"steemit"` | `"forum"` | Запрос доступной пропускной способности forum для аккаунта с именем "steemit". |
    | `"alice"` | `"market"` | Запрос доступной пропускной способности market для аккаунта с именем "alice". |

    См.: Forum/Market Bandwidth
  condenser_api.get_account_count: |-
    Возвращает количество аккаунтов.
  condenser_api.get_account_history: |-
    Возвращает историю аккаунта (account history) — все операции заданного аккаунта. Параметры: `account:string`; `start:int`, например: -1 для истории в обратном порядке или любое положительное число; `limit:int` до 10000

    | `account` (string) | `start` (int) | `limit` (int) | |
    |--------------------|---------------|---------------|-|
    | `"steemit"` | `1000` | `1000` | Запрос аккаунта с именем `steemit` начиная с последнего элемента истории, до 1 000 результатов. |
    | `"alice"` | `-1` | `10000` | Запрос аккаунта с именем `alice` начиная с самого старого элемента истории, до 10 000 результатов. |

    См. также: account_history_api.get_account_history, Paginated API Methods
  condenser_api.get_account_references: |-
    **Не реализовано**
  condenser_api.get_account_reputations: |-
    Возвращает список репутаций (reputation) аккаунтов. Параметры: `account_lower_bound:string`; `limit:int` до 1000

    | `account_lower_bound` (string) | `limit` (int) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `1` | Запрос аккаунтов, начинающихся с "steemit", только один результат. |
    | `"a"` | `10` | Запрос аккаунтов, начинающихся с "a", до 10 результатов. |

    См. также: follow_api.get_account_reputations
  condenser_api.get_account_votes: |-
    Возвращает все голоса (vote) аккаунта. Параметры: `account:string`

    | `account` (string) | |
    |-------------------|-|
    | `"steemit"` | Запрос голосов, отданных "steemit". |
    | `"alice"` | Запрос голосов, отданных "alice". |
  condenser_api.get_accounts: |-
    Возвращает аккаунты, найденные по имени. Параметры: `account:string array`

    | `account` (string array) | |
    |-------------------|-|
    | `["steemit"]` | Запрос аккаунта с именем "steemit". |
    | `["steemit", "alice"]` | Запрос аккаунтов с именами "steemit" и "alice". |

    См. также: database_api.find_accounts
  condenser_api.get_active_votes: |-
    Возвращает все голоса (vote) за заданный пост (post). Параметры: `author:string`; `permlink:string`

    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Запрос голосов за контент со слагом (slug) `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Запрос голосов за контент со слагом (slug) `@alice/a-post-by-alice` |

    См. также: tags_api.get_active_votes
  condenser_api.get_active_witnesses: |-
    Возвращает список активных свидетелей (witness).

    См. также: database_api.get_active_witnesses
  condenser_api.get_block: |-
    Возвращает блок (block). Параметры: `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Запрос самого первого блока. |
    | `8675309` | Запрос блока с номером 8 675 309. |
    | `62396745` | Запрос блока с номером 62 396 745. |

    См. также: block_api.get_block
  condenser_api.get_block_header: |-
    Возвращает заголовок блока (block header). Параметры: `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Запрос заголовка самого первого блока. |
    | `8675309` | Запрос заголовка блока с номером 8 675 309. |
    | `62396745` | Запрос заголовка блока с номером 62 396 745. |

    См. также: block_api.get_block_header
  condenser_api.get_blog: |-
    Возвращает список записей блога (blog) для аккаунта. Параметры: `account:string`; `start_entry_id:int`; `limit:int` до 500

    | `account` (string) | `start_entry_id` (int) | `limit` (int) | |
    |-------------------|------------------------|---------------|-|
    | "steemit" | `0` | `1` | Запрос блога аккаунта с именем "steemit", до одного результата. |
    | "alice" | `0` | `50` | Запрос блога аккаунта с именем "alice", до 50 результатов. |

    См. также: follow_api.get_blog, Paginated API Methods
  condenser_api.get_blog_authors: |-
    Возвращает список авторов, чей контент был реблогнут (reblog) в заданном аккаунте блога (blog). Параметры: `account:string`

    | `account` (string) | |
