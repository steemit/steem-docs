  transaction_status_api.find_transaction: |-
    Возвращает статус заданной транзакции (transaction) по её идентификатору (transaction id). Параметры: `trx_id:string`; `expiration:timestamp` (необязательный)

    Результат будет содержать одно из следующих значений `status`:

    | Статус | Значение |
    |--------|---------|
    | `unknown` | Время истечения в будущем, транзакция не включена в блок (block) или пул памяти (mempool) |
    | `within_mempool` | Транзакция в пуле памяти (mempool) |
    | `within_reversible_block` | Транзакция включена в блок, блок ещё не является необратимым |
    | `within_irreversible_block` | Транзакция включена в блок, блок необратимый |
    | `expired_reversible` | Срок транзакции истёк, транзакция не является необратимой (может находиться в форке) |
    | `expired_irreversible` | Срок транзакции истёк, транзакция необратима (не может находиться в форке) |
    | `too_old` | Транзакция слишком старая, о ней ничего не известно |
