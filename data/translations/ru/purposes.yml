    |--------------------|------------------|-----------------|---------------|-|
    | `"steemit"` | `null` | `"blog"` | `10` | Запрос подписок (follow) аккаунта с именем `steemit`, до 10 результатов. |
    | `"alice"` | `null` | `"ignore"` | `100` | Запрос заглушек (mute) аккаунта с именем `alice`, до 100 результатов. |

