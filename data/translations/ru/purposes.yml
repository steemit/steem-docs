  follow_api.get_following_by_page: |-
    Возвращает аккаунты, на которые подписан аккаунт, постранично. (EOL) Псевдоним `condenser_api.get_following_by_page`: параметры передаются позиционным массивом — `account:string`; `page:int` (от нуля — страница `0` возвращает первую страницу, каждая следующая пропускает ещё `page_size` строк); `page_size:int` (обязательный, максимум `100`); `follow_type:string` (необязательный, по умолчанию `blog`).

    **Примечание:** смещение строки равно `page * page_size`. `page_size` обязателен; при его отсутствии возвращается `-32602`.

    | `account` (string) | `page` (int) | `page_size` (int) | |
    |--------------------|--------------|-------------------|-|
    | `"steemitblog"` | `0` | `2` | Запрос первой страницы (страница `0`) аккаунтов, на которые подписан `steemitblog`, по 2 на страницу. |
    | `"alice"` | `1` | `100` | Запрос страницы `1` — пропускает первые 100 строк — аккаунтов, на которые подписан `alice`, по 100 на страницу. |

    См. также: condenser_api.get_following_by_page, Paginated API Methods
