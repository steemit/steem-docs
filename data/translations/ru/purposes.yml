  database_api.find_withdraw_vesting_routes: |-
    Возвращает список маршрутов вывода вестинга (vesting withdraw route) для аккаунта.
  database_api.find_witnesses: |-
    Ищет свидетелей (witness).
  database_api.get_active_witnesses: |-
    Возвращает список активных свидетелей (witness).
  database_api.get_config: |-
    Возвращает сведения о константах времени компиляции. Некоторые свойства могут отсутствовать. См.: Understanding Configuration Values
  database_api.get_current_price_feed: |-
    Возвращает текущую цену фида (feed price).
  database_api.get_dynamic_global_properties: |-
    Возвращает текущие динамические глобальные свойства (dynamic global properties). См.: Understanding Dynamic Global Properties
  database_api.get_feed_history: |-
    Возвращает историю значений цены фида (feed price).
  database_api.get_hardfork_properties: |-
    Возвращает текущие свойства хардфорков (hardfork) блокчейна.
  database_api.get_nai_pool: |-
    Возвращает массив идентификаторов числовых активов (Numeric Asset Identifier, NAI), доступных для использования в новых создаваемых SMT.

    См.: [Numerical Asset Identifiers](https://github.com/steemit/smt-whitepaper/blob/master/smt-manual/manual.md#numerical-asset-identifiers)
  database_api.get_order_book: |-
    Возвращает стакан заявок (order book).
  database_api.get_potential_signatures: |-
    Возвращает множество всех публичных ключей, которые потенциально могут подписать заданную транзакцию (transaction). Этот вызов могут использовать кошельки, чтобы перед вызовом `get_required_signatures` (получение минимального подмножества) отфильтровать свой набор публичных ключей до релевантного подмножества.
  database_api.get_required_signatures: |-
    Метод принимает частично подписанную транзакцию (transaction) и набор публичных ключей, которыми владелец способен подписать, и возвращает минимальное подмножество публичных ключей, которые должны добавить подписи к транзакции.
  database_api.get_reward_funds: |-
    Возвращает сведения о текущих фондах вознаграждений (reward fund).
  database_api.get_transaction_hex: |-
    Возвращает hex-дамп сериализованной двоичной формы транзакции (transaction).
  database_api.get_version: |-
    Возвращает версии блокчейна, steem и FC, зафиксированные на этапе компиляции. Также возвращает версию идентификатора цепочки (chain id), определяемую на этапе загрузки (*может* отличаться от значения времени компиляции только в тестовой сети (testnet))
  database_api.get_witness_schedule: |-
    Возвращает текущее расписание свидетелей (witness schedule).
  database_api.list_account_recovery_requests: |-
    Возвращает список заявок на восстановление аккаунта (account recovery request). Параметры: `start:string`, `limit:int`, `order:string`

    * `limit` - до 1000.
    * `order` может быть одним из:
      * `by_account` - упорядочение по имени аккаунта
      * `by_expiration` - упорядочение по сроку истечения (expiration)

    | `account` (string) | `limit` (int) | `order` (string) | |
    |--------------------|-|
    | `"steemit"` | 10 | `"by_account"` | Запрос заявок на восстановление для аккаунта с именем "steemit", упорядоченных по имени аккаунта. |
    | `["1960-01-01T00:00:00"]` | 10 | `"by_expiration"`| Запрос заявок на восстановление на эту дату, упорядоченных по сроку истечения. |
  database_api.list_accounts: |-
    Перечисляет аккаунты, упорядоченные по указанному ключу. Параметры: `start:object`, `limit:int`, `order:string`

    * `limit` - до 1000.
    * `order` может быть одним из:
      * `by_name` - упорядочение по имени аккаунта
      * `by_proxy` - упорядочение по прокси (proxy)
      * `by_next_vesting_withdrawal` - упорядочение по следующему-следующему выводу вестинга (vesting withdrawal)

    | `start` (object) | `limit` (int) | `order` (string) |
    |-------------------|-|
    | `""` | `10` | `"by_name"` Запрос до 10 аккаунтов с самого начала, упорядоченных по имени. |
    | `["", ""]` | `10` | `"by_proxy"` Запрос до 10 аккаунтов с самого начала, упорядоченных по прокси. |
    | `["1960-01-01T00:00:00", ""]` | `10` | `"by_next_vesting_withdrawal"` Запрос до 10 аккаунтов с самого начала, упорядоченных по времени следующего вывода вестинга. |

    См. также: Paginated API Methods
  database_api.list_change_recovery_account_requests: |-
    Возвращает список заявок на смену аккаунта восстановления (recovery account). Параметры: `start:object`, `limit:int`, `order:string`

    * `start` зависит от `order` (см. ниже)
    * `limit` - до 1000.
    * `order` может быть одним из:
      * `by_account` - упорядочение по аккаунту
        * `start` - строка вида: `account`
      * `by_effective_date` - упорядочение по дате вступления в силу (effective date)
        * `start` - массив из двух значений: `timestamp`, `account`

    | `start` (object) | `limit` (int) | `order` (string) | |
    |----------------------------|---------------|-|
    | `""` | 10 | `"by_account"` | Запрос первых 10 заявок, сортировка по аккаунту |
    | `["1960-01-01T00:00:00", ""]` | 10 | `"by_effective_date"` | Запрос первых 10 заявок, сортировка по дате вступления в силу |

    См. также: Paginated API Methods
  database_api.list_comments: |-
    Возвращает все комментарии (comment), начиная с указанных опций. Параметры: `start:array`; `limit:int`; `order:string`

    * `start` зависит от `order` (см. ниже)
    * `limit` - до 1000.
    * `order` может быть одним из:
      * `by_cashout_time` - упорядочение по времени выплаты (cashout time)
        * `start` - массив из одного обязательного и двух необязательных значений: `timestamp`, `author`, `permlink`
      * `by_permlink` - упорядочение по пермалинку (permlink)
        * `start` - массив из двух необязательных значений: `author`, `permlink`
      * `by_root` - упорядочение по корню (root)
        * `start` - массив из двух обязательных и двух необязательных значений: `root_author`, `root_permlink`, `child_author`, `child_permlink`
      * `by_parent` - упорядочение по родителю (parent)
        * `start` - массив из двух обязательных и двух необязательных значений: `parent_author`, `parent_permlink`, `child_author`, `child_permlink`

    | `start` (array) | `limit` (int) | `order` (string) | |
    |----------------------------|---------------|-|
    | `["1970-01-01T00:00:00", "", ""]` | 10 | `"by_cashout_time"` | Запрос первых 10 комментариев, сортировка по времени выплаты |
    | `["", ""]` | 10 | `"by_permlink"` | Запрос первых 10 комментариев, сортировка по пермалинку |
