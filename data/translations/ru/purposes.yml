    | `"steemit"` | `"outgoing"` | Запрос исходящих маршрутов вывода (withdraw route) для "steemit". |
    | `"steemit"` | `"incoming"` | Запрос входящих маршрутов вывода (withdraw route) для "steemit". |
    | `"steemit"` | `"all"` | Запрос всех маршрутов вывода (withdraw route) для "steemit". |

    См. также: database_api.list_withdraw_vesting_routes
  condenser_api.get_witness_by_account: |-
    Возвращает свидетеля (witness) аккаунта. Параметры: `account:string`

