  database_api.get_required_signatures: |-
    Cette API prend une transaction (transaction) partiellement signée et un ensemble de clés publiques (public key) que le propriétaire est capable de signer, et retourne le sous-ensemble minimal de clés publiques devant ajouter des signatures à la transaction.
