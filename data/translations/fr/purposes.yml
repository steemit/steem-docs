# ---------------------------------------------------------------------------
# fr translations of API method purposes — batch 1-5（238 条全量）
# (phase4-plan §1-T28；schema/风格沿用 zh-method-purposes/v1，batch 字段标
# 语言内批次：batch 1 = C 序 #1-48、batch 2 = #49-96、batch 3 = #97-144、
# batch 4 = #145-192、batch 5 = #193-238，按写入顺序)
#
# api_method -> traduction française du purpose。原文以 data/apidefinitions/*.yml 中
# 现有 en purpose 字段为准，不增不减不改语义；markdown 结构（表格/列表/加粗/
# 链接）按原文保留，仅翻译文字内容。
#
# 术语遵循 docs/.vitepress/fr-glossary.json 的 30 条冻结基线（witness 保留英文、
# « témoin » 仅作解释；parts de vesting (VESTS)、dollars STEEM (SBD)、
# Resource Credits (RC)、curation、hard fork、propriétés globales dynamiques、
# historique de compte、permlink (lien permanent)、proposition、post (publication)
# 等）；方法名、参数名、字段值、API 名与被引用文档页标题保留英文。术语首次
# 出现按 glossary conventions 使用『法译 (English)』格式；SMT 无冻结条目，按
# 惯用展开 SMT (jetons médiatiques intelligents)。行文为简洁说明句，不使用
# 感叹号。
#
# en 原文的既有缺陷语义如实保留，不擅自“修正”：datbase_api.list_proposals
# 引用拼写（condenser_api.list_proposal_votes/list_proposals 各 1 处）、
# get_vesting_delegations 另见行 Paginated API Methods 重复、
# get_blog_authors 表内 alice". 缺左引号、list_accounts/list_owner_histories
# 等断表（列数不齐）、list_limit_orders/list_witness_votes 表内 order 值串行
# （by_effective_date/by_withdraw_route/by_destination）、
# "next next vesting withdrawal" 等均照原文直译或原样保留。
#
# 死方法（deprecated/disabled/removed 三族 35 个）照常翻译，不因死亡而省略；
# 23 个三期新增方法（bridge 系 14、condenser_api follow 分页对 2、chain_api 2、
# hive 1、tags 1、call 1 及 T22 补页清单其余）全部在内。
#
# 排序口径仍为 LC_ALL=C（字节序），是唯一口径。机械核验（LC_ALL=C sort 对
# en_US.UTF-8 sort）确认全量 238 键共有 5 处 C/UTF-8 collation 分歧对：
#   1. condenser_api.get_account_votes ↔ get_accounts（C #39/#40）
#   2. condenser_api.get_witness_schedule ↔ get_witnesses（C #110/#111，
#      UTF-8 下 schedule 排到 get_witnesses_by_vote 之后）
#   3. condenser_api.list_proposal_votes ↔ list_proposals（C #113/#114）
#   4. database_api.list_proposal_votes ↔ list_proposals（C #161/#162）
#   5. database_api.list_witness_votes ↔ list_witnesses（C #172/#173）
# 各分歧对均整体落在同一 batch 窗口内，batch 边界一律按本头注记的 C 序执行。
#
# 消费方：scripts/gen-api-docs.mjs --locale fr。
# ---------------------------------------------------------------------------
schema: zh-method-purposes/v1
locale: fr
batch: 1-5
purposes:
  account_by_key_api.get_key_references: |-
    Retourne tous les comptes dont la clé est associée aux autorités (authority) owner ou active.
  account_history_api.enum_virtual_ops: |-
    Retourne les opérations virtuelles (virtual operation) dans une plage de blocs (block), avec filtrage facultatif par compte et par type d'opération.
  account_history_api.get_account_history: |-
    Retourne l'historique de compte (account history) — toutes les opérations d'un compte donné.

    Voir aussi : Paginated API Methods
  account_history_api.get_ops_in_block: |-
    Retourne toutes les opérations contenues dans un bloc (block).
  account_history_api.get_transaction: |-
    Retourne les détails d'une transaction (transaction) à partir d'un identifiant de transaction (transaction id).
  block_api.get_block: |-
    Récupère le bloc (block) signé complet du bloc référencé, ou null si aucun bloc correspondant n'a été trouvé.

    **Parameters:**

      * `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Interroge le tout premier bloc. |
    | `8675309` | Interroge le bloc numéro 8 675 309. |
    | `62396745` | Interroge le bloc numéro 62 396 745. |
  block_api.get_block_header: |-
    Récupère l'en-tête du bloc (block header) référencé, ou null si aucun bloc correspondant n'a été trouvé.

    **Parameters:**
      
      * `block_num:int` - Hauteur du bloc dont l'en-tête doit être renvoyé

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Interroge les en-têtes du tout premier bloc. |
    | `8675309` | Interroge les en-têtes du bloc numéro 8 675 309. |
    | `62396745` | Interroge les en-têtes du bloc numéro 62 396 745. |
  bridge.account_notifications: |-
    Notifications (notification) d'un compte.

    Valeurs prises en charge pour `type` :
      * `new_community` - une nouvelle communauté (community) a été créée
      * `set_role` - un modérateur/administrateur ajoute un rôle à un compte
      * `set_props` - des propriétés ont été définies pour une communauté
      * `set_label` - un titre/badge/étiquette (title/badge/label) a été défini pour un compte
      * `mute_post` - un post (publication) a été mis en sourdine (mute), avec un motif
      * `unmute_post` - la mise en sourdine (unmute) d'un post a été levée, avec un motif
      * `pin_post` - un post a été épinglé (pin)
      * `unpin_post` - un post a été désépinglé (unpin)
      * `flag_post` - un post a été signalé (flagged) par un membre, avec un motif
      * `error` - fournit un retour aux développeurs pour les opérations qui ne peuvent pas être interprétées
      * `subscribe` - un compte s'est abonné à une communauté
      * `reply` - un post a reçu une réponse (reply)
      * `reblog` - un post a été reblogué (reblogged/resteemed)
      * `follow` - un compte suit un autre compte
      * `mention` - l'auteur mentionne un compte
      * `vote` - le votant vote pour un auteur

    La valeur `score` est basée sur le rang (rank) du compte d'origine.
  bridge.get_account_posts: |-
    Obtient les posts (publication) d'un compte — blog, flux (feed), commentaires ou réponses.

    Valeurs prises en charge pour `sort` :
      * `blog`
      * `feed`
      * `posts`
      * `comments`
      * `replies`
      * `payout`

    Paramètres : `sort:string` ; `account:string` ; `start_author:string` (facultatif, vide par défaut) ; `start_permlink:string` (facultatif, vide par défaut) ; `limit:int` (facultatif, `20` par défaut, max `100`) ; `observer:string` (facultatif)

    Voir aussi : bridge.get_ranked_posts
  bridge.get_community: |-
    Obtient les détails d'une communauté (community).
  bridge.get_community_context: |-
    Pour une paire communauté/compte, retourne le rôle, le titre et l'état d'abonnement du compte.

    Paramètres : `name:string` (nom de la communauté, par exemple : `hive-123456`) ; `account:string`

    Voir aussi : bridge.get_community
  bridge.get_discussion: |-
    Retourne un fil de discussion (thread) complet — le post racine et ses réponses, indexés par `author/permlink`. Il s'agit du remplacement hivemind de la partie fil de `condenser_api.get_state`.

    Paramètres : `author:string` ; `permlink:string`
  bridge.get_payout_stats: |-
    Obtient les statistiques de paiement (payout) pour construire un treemap : paiement total du blog plus un tuple `(url, label, payout, posts, authors)` par communauté principale.

    Paramètres : `limit:int` (facultatif, `250` par défaut, max `250`)
  bridge.get_post: |-
    Récupère un seul post (publication).

    Paramètres : `author:string` ; `permlink:string` ; `observer:string` (facultatif)
  bridge.get_post_header: |-
    Récupère les données de base d'un post : auteur, permlink (lien permanent), catégorie et profondeur.

    Paramètres : `author:string` ; `permlink:string`
  bridge.get_profile: |-
    Charge les données de compte/profil (profile) : métadonnées, réputation (reputation), statistiques d'abonnement et listes noires (blacklist).

    Paramètres : `account:string` ; `observer:string` (facultatif)
  bridge.get_ranked_posts: |-
    Obtient les posts classés (ranked posts).

    Valeurs prises en charge pour `sort` :
      * `trending`
      * `hot`
      * `created`
      * `promoted`
      * `payout`
      * `payout_comments`
      * `muted`
      
    La valeur de `tag` peut être n'importe quel tag valide.

    La valeur de `observer` peut être n'importe quel compte valide ou une chaîne vide.
  bridge.get_trending_topics: |-
    Retourne les sujets (topic) les plus en tendance parmi les posts en attente (un mélange de communautés et de tags).

    Paramètres : `limit:int` (facultatif, `10` par défaut, max `25`) ; `observer:string` (facultatif, pas encore utilisé)
  bridge.list_all_subscriptions: |-
    Liste tous les abonnements (subscription) d'un compte à des communautés.
  bridge.list_communities: |-
    Liste toutes les communautés (community), paginées. Retourne une liste de communautés allégée (lite).

    Valeurs prises en charge pour `sort` :
      * `rank`
      * `new`
      * `subs`

    Paramètres : `last:string` (facultatif, vide par défaut) ; `limit:int` (facultatif, `100` par défaut, max `100`) ; `query:string` (facultatif, recherche en texte intégral sur le titre et la description) ; `sort:string` (facultatif, `rank` par défaut) ; `observer:string` (facultatif)

    Voir aussi : bridge.get_community
  bridge.list_community_roles: |-
    Liste les rôles et étiquettes (label) de communauté de chaque compte de la communauté.
  bridge.list_pop_communities: |-
    Liste les communautés par nombre de nouveaux abonnés (subscriber). Retourne une liste de communautés allégée (lite).

    Paramètres : `limit:int` (facultatif, `25` par défaut, max `25`)

    Note : à la date du 2026-10-28, les nœuds publics renvoient une erreur serveur pour cet appel (la version déployée de hivemind ne lie jamais le paramètre de requête `cutoff`). La réponse ci-dessous montre la forme prévue.
  bridge.list_subscribers: |-
    Liste les abonnés (subscriber) d'une communauté (jusqu'à 250, du plus récent au plus ancien), sous forme de tuples `name`/`role`/`title`/`created_at`.

    Paramètres : `community:string` (par exemple : `hive-123456`)
  bridge.normalize_post: |-
    Prend un objet post steemd (tel que renvoyé par `condenser_api.get_content`) et produit la version normalisée (normalized) de la bridge-api.

    Paramètres : `post:object` (un objet post steemd complet, exactement tel que renvoyé par `condenser_api.get_content`, transmis enveloppé dans un tableau à un élément : `params: [{ <post object> }]`)

    **Note :** l'objet post doit porter l'ensemble complet des champs steemd — l'exemple ci-dessous n'abrège que `body` pour la lisibilité. Passer l'objet nu comme `params` (sans enveloppe tableau) renvoie `-32602` ; un objet incomplet (par exemple des entrées `active_votes` sans `percent`/`reputation`, ou des champs de paiement manquants comme `cashout_time`) renvoie `-32000`.
  bridge.post_notifications: |-
    Charge les notifications d'un post donné.

    Paramètres : `author:string` ; `permlink:string` ; `min_score:int` (facultatif, `25` par défaut) ; `last_id:int` (facultatif, reprise à partir de cet identifiant de notification) ; `limit:int` (facultatif, `100` par défaut, max `100`)

    Note : à la date du 2026-10-28, les nœuds publics renvoient une erreur interne pour cet appel sur les posts qui ont des notifications. La réponse ci-dessous montre la forme prévue.

    Voir aussi : bridge.account_notifications
  bridge.unread_notifications: |-
    Charge l'état des notifications d'un compte donné : l'heure de dernière lecture et le nombre de notifications non lues ayant un score d'au moins `min_score`.

    Paramètres : `account:string` ; `min_score:int` (facultatif, `25` par défaut)

    Voir aussi : bridge.account_notifications
  call: |-
    Achemine les requêtes de méthode `call` de style ancien (legacy).

    Paramètres : `api:string` (seul `condenser_api` est accepté) ; `method:string` (une des méthodes acheminées de condenser_api : get_followers, get_following, get_followers_by_page, get_following_by_page, get_follow_count, get_content, get_content_replies, get_trending_tags, get_state, get_discussions_by_trending, get_discussions_by_hot, get_discussions_by_promoted, get_discussions_by_created, get_post_discussions_by_payout, get_comment_discussions_by_payout, get_discussions_by_blog, get_discussions_by_feed, get_discussions_by_comments, get_replies_by_last_update, get_discussions_by_author_before_date, get_blog, get_blog_entries, get_account_votes) ; `params:array` (les paramètres de la méthode acheminée)

    Toute autre méthode renvoie une erreur.
  chain_api.push_block: |-
    Pousse un bloc (block) vers le nœud.

    Paramètres : `block:object` (un bloc signé) ; `currently_syncing:bool` (facultatif, `false` par défaut)

    Retourne `success:bool` et, en cas d'échec, une `error:string`.
  chain_api.push_transaction: |-
    Pousse une transaction (transaction) vers le nœud.

    Paramètres : l'objet transaction signé lui-même, non enveloppé : `ref_block_num:int` ; `ref_block_prefix:int` ; `expiration:timestamp` ; `operations:array` ; `extensions:array` ; `signatures:array`

    Retourne `success:bool` et, en cas d'échec, une `error:string`.
  condenser_api.broadcast_block: |-
    Utilisé pour diffuser (broadcast) un bloc (block).

    Voir aussi : network_broadcast_api.broadcast_block
  condenser_api.broadcast_transaction: |-
    Utilisé pour diffuser une transaction (transaction).

    Voir aussi : network_broadcast_api.broadcast_transaction
  condenser_api.broadcast_transaction_synchronous: |-
    Utilisé pour diffuser une transaction et attendre qu'elle soit traitée de manière synchrone.
  condenser_api.find_proposals: |-
    Trouve des propositions (proposal) par `proposal.id` (pas `proposal.proposal_id`).

    Voir aussi : database_api.find_proposals
  condenser_api.get_account_bandwidth: |-
    **Désactivé depuis la version 0.20.6, voir : [#3029](https://github.com/steemit/steem/issues/3029#issuecomment-428404844)**

    Retourne la bande passante (bandwidth) disponible d'un compte. Paramètres : `account:string` ; `type:string`, par exemple : `forum` ou `market`

    | `account` (string) | `type` (string) | |
    |--------------------|-----------------|-|
    | `"steemit"` | `"forum"` | Interroge la bande passante forum disponible pour le compte nommé "steemit". |
    | `"alice"` | `"market"` | Interroge la bande passante market disponible pour le compte nommé "alice". |

    Voir : Forum/Market Bandwidth
  condenser_api.get_account_count: |-
    Retourne le nombre de comptes.
  condenser_api.get_account_history: |-
    Retourne l'historique de compte (account history) — toutes les opérations d'un compte donné. Paramètres : `account:string` ; `start:int`, par exemple : -1 pour un historique en ordre inverse ou tout nombre positif ; `limit:int` jusqu'à 10000

    | `account` (string) | `start` (int) | `limit` (int) | |
    |--------------------|---------------|---------------|-|
    | `"steemit"` | `1000` | `1000` | Interroge le compte nommé `steemit` à partir du dernier élément de l'historique, jusqu'à 1 000 résultats. |
    | `"alice"` | `-1` | `10000` | Interroge le compte nommé `alice` à partir du plus ancien élément de l'historique, jusqu'à 10 000 résultats. |

    Voir aussi : account_history_api.get_account_history, Paginated API Methods
  condenser_api.get_account_references: |-
    **Non implémenté**
  condenser_api.get_account_reputations: |-
    Retourne une liste de réputations (reputation) de comptes. Paramètres : `account_lower_bound:string` ; `limit:int` jusqu'à 1000

    | `account_lower_bound` (string) | `limit` (int) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `1` | Interroge les comptes commençant par "steemit", un seul résultat. |
    | `"a"` | `10` | Interroge les comptes commençant par "a", jusqu'à 10 résultats. |

    Voir aussi : follow_api.get_account_reputations
  condenser_api.get_account_votes: |-
    Retourne tous les votes (vote) d'un compte. Paramètres : `account:string`

    | `account` (string) | |
    |-------------------|-|
    | `"steemit"` | Interroge les votes de "steemit". |
    | `"alice"` | Interroge les votes de "alice". |
  condenser_api.get_accounts: |-
    Retourne des comptes, interrogés par nom. Paramètres : `account:string array`

    | `account` (string array) | |
    |-------------------|-|
    | `["steemit"]` | Interroge le compte nommé "steemit". |
    | `["steemit", "alice"]` | Interroge les comptes nommés "steemit" et "alice". |

    Voir aussi : database_api.find_accounts
  condenser_api.get_active_votes: |-
    Retourne tous les votes (vote) pour le post (publication) donné. Paramètres : `author:string` ; `permlink:string`

    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Interroge les votes du contenu de slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Interroge les votes du contenu de slug `@alice/a-post-by-alice` |

    Voir aussi : tags_api.get_active_votes
  condenser_api.get_active_witnesses: |-
    Retourne la liste des witness (témoins) actifs.

    Voir aussi : database_api.get_active_witnesses
  condenser_api.get_block: |-
    Retourne un bloc (block). Paramètres : `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Interroge le tout premier bloc. |
    | `8675309` | Interroge le bloc numéro 8 675 309. |
    | `62396745` | Interroge le bloc numéro 62 396 745. |

    Voir aussi : block_api.get_block
  condenser_api.get_block_header: |-
    Retourne un en-tête de bloc (block header). Paramètres : `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Interroge les en-têtes du tout premier bloc. |
    | `8675309` | Interroge les en-têtes du bloc numéro 8 675 309. |
    | `62396745` | Interroge les en-têtes du bloc numéro 62 396 745. |

    Voir aussi : block_api.get_block_header
  condenser_api.get_blog: |-
    Retourne la liste des entrées de blog (blog entry) d'un compte. Paramètres : `account:string` ; `start_entry_id:int` ; `limit:int` jusqu'à 500

    | `account` (string) | `start_entry_id` (int) | `limit` (int) | |
    |-------------------|------------------------|---------------|-|
    | "steemit" | `0` | `1` | Interroge le blog (blog) du compte nommé "steemit", jusqu'à un résultat. |
    | "alice" | `0` | `50` | Interroge le blog du compte nommé "alice", jusqu'à 50 résultats. |

    Voir aussi : follow_api.get_blog, Paginated API Methods
  condenser_api.get_blog_authors: |-
    Retourne une liste d'auteurs dont le contenu a été reblogué (reblog) sur le blog (blog) d'un compte donné. Paramètres : `account:string`

    | `account` (string) | |
    |-------------------|-|
    | `"steemit"` | Interroge le compte nommé "steemit". |
    | `"alice"` | Interroge les comptes nommés alice". |

    Voir aussi : follow_api.get_blog_authors
  condenser_api.get_blog_entries: |-
    Retourne la liste des entrées de blog (blog entry) d'un compte. Paramètres : `account:string` ; `start_entry_id:int` ; `limit:int` jusqu'à 500

    | `account` (string) | `start_entry_id` (int) | `limit` (int) | |
    |-------------------|------------------------|---------------|-|
    | "steemit" | `0` | `1` | Interroge les entrées de blog du compte nommé "steemit", jusqu'à un résultat. |
    | "alice" | `0` | `50` | Interroge les entrées de blog du compte nommé "alice", jusqu'à 50 résultats. |

    Voir aussi : follow_api.get_blog_entries, Paginated API Methods
  condenser_api.get_chain_properties: |-
    Retourne les propriétés de la chaîne (chain properties).
  condenser_api.get_comment_discussions_by_payout: |-
    Retourne une liste de discussions (discussion) triées par paiement (payout).

    Voir aussi : tags_api.get_comment_discussions_by_payout
  condenser_api.get_config: |-
    Retourne des informations sur les constantes de compilation. Voir : Understanding Configuration Values

    Voir aussi : database_api.get_config
  condenser_api.get_content: |-
    Retourne le contenu (post (publication) ou commentaire (comment)). Paramètres : `author:string` ; `permlink:string`

    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Interroge le contenu de slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Interroge le contenu de slug `@alice/a-post-by-alice` |
  condenser_api.get_content_replies: |-
    Retourne une liste de réponses (reply). Paramètres : `author:string` ; `permlink:string`


    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Interroge les réponses pour un slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Interroge les réponses pour un slug `@alice/a-post-by-alice` |

    Voir aussi : tags_api.get_content_replies
  condenser_api.get_conversion_requests: |-
    Retourne une liste de demandes de conversion (conversion request). Paramètres : `id:integer`

    | `id` (int) | |
    |-------------------|-|
    | `1234` | Interroge une demande de conversion dont l'id est 1234. |

    Voir aussi : database_api.list_sbd_conversion_requests
  condenser_api.get_current_median_history_price: |-
    Retourne le prix médian historique actuel, c'est-à-dire le taux de change STEEM:SBD publié par les witness via le prix de flux (feed price).
  condenser_api.get_discussions_by_active: |-
    Retourne une liste de discussions (discussion) triées par activité (active).

    Voir aussi : tags_api.get_discussions_by_active
  condenser_api.get_discussions_by_author_before_date: |-
    Retourne une liste de discussions (discussion) triées par auteur avant une date.

    Voir aussi : tags_api.get_discussions_by_author_before_date, Paginated API Methods
  condenser_api.get_discussions_by_blog: |-
    Retourne une liste de discussions (discussion) par blog (blog).

