        * `start` est une chaîne de caractères : `account`
      * `by_effective_date` - tri par date d'entrée en vigueur (effective date)
        * `start` est un tableau de deux valeurs : `timestamp`, `account`

    | `start` (object) | `limit` (int) | `order` (string) | |
