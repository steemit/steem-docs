    |--------------------|------------------|-----------------|---------------|-|
    | `"steemit"` | `null` | `"blog"` | `10` | Interroge les abonnements (follow) du compte nommé `steemit`, jusqu'à 10 résultats. |
    | `"alice"` | `null` | `"ignore"` | `100` | Interroge les mises en sourdine (mute) du compte nommé `alice`, jusqu'à 100 résultats. |

    Voir aussi : follow_api.get_followers, Paginated API Methods
  condenser_api.get_followers_by_page: |-
    Retourne les abonnés (followers) d'un compte, par page. (EOL) Paramètres : `account:string` ; `page:int` (à partir de zéro — la page `0` renvoie la première page, chaque page suivante saute encore `page_size` lignes) ; `page_size:int` (obligatoire, max `100`) ; `follow_type:string` (facultatif, par exemple : `blog`, `blog` par défaut)

    **Note :** le décalage de ligne est `page * page_size`. `page_size` est obligatoire ; son omission renvoie `-32602` (en forme positionnelle comme en forme nommée).

    | `account` (string) | `page` (int) | `page_size` (int) | |
    |--------------------|--------------|-------------------|-|
    | `"steemit"` | `0` | `5` | Interroge la première page (page `0`) des comptes abonnés à `steemit`, 5 par page. |
    | `"alice"` | `1` | `100` | Interroge la page `1` — saute les 100 premières lignes — des comptes abonnés à `alice`, 100 par page. |

    Voir aussi : condenser_api.get_followers, follow_api.get_followers_by_page
