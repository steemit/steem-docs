    | `15` | `"2018-01-01T00:00:00"` | `"2018-01-02T00:00:00"` | Interroge l'historique du marché entre le 1er janvier 2018 et le 2 janvier 2018, segmenté par 15 secondes. |
    | `60` | `"2018-01-01T00:00:00"` | `"2018-01-02T00:00:00"` | Interroge l'historique du marché entre le 1er janvier 2018 et le 2 janvier 2018, segmenté par une minute. |
    | `300` | `"2018-01-01T00:00:00"` | `"2018-01-02T00:00:00"` | Interroge l'historique du marché entre le 1er janvier 2018 et le 2 janvier 2018, segmenté par cinq minutes. |
    | `3600` | `"2018-01-01T00:00:00"` | `"2018-01-02T00:00:00"` | Interroge l'historique du marché entre le 1er janvier 2018 et le 2 janvier 2018, segmenté par une heure. |
    | `86400` | `"2018-01-01T00:00:00"` | `"2018-01-02T00:00:00"` | Interroge l'historique du marché entre le 1er janvier 2018 et le 2 janvier 2018, segmenté par un jour. |

    Voir aussi : market_history_api.get_market_history
