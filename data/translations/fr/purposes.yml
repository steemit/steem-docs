    | `""` | 10 | `"by_account"` | Interroge les 10 premières demandes, tri par compte |
    | `["1960-01-01T00:00:00", ""]` | 10 | `"by_effective_date"` | Interroge les 10 premières demandes, tri par date d'entrée en vigueur |

