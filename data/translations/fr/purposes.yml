    | `"alice"` | `null` | `"ignore"` | `100` | Interroge les mises en sourdine (mute) du compte nommé `alice`, jusqu'à 100 résultats. |

    Voir aussi : follow_api.get_following, Paginated API Methods
  condenser_api.get_following_by_page: |-
