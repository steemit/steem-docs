  transaction_status_api.find_transaction: |-
    Retourne le statut d'un identifiant de transaction (transaction id) donné. Paramètres : `trx_id:string` ; `expiration:timestamp` (facultatif)

    Le résultat contiendra l'une des valeurs `status` suivantes :

    | Statut | Signification |
    |--------|---------|
    | `unknown` | Heure d'expiration dans le futur, transaction non incluse dans un bloc (block) ni dans le mempool (file des transactions en attente) |
    | `within_mempool` | Transaction dans le mempool (file des transactions en attente) |
    | `within_reversible_block` | Transaction incluse dans un bloc, bloc pas encore irréversible |
    | `within_irreversible_block` | Transaction incluse dans un bloc, bloc irréversible |
    | `expired_reversible` | Transaction expirée, transaction non irréversible (la transaction peut être dans un fork) |
    | `expired_irreversible` | Transaction expirée, transaction irréversible (la transaction ne peut pas être dans un fork) |
    | `too_old` | Transaction trop ancienne, je n'en ai pas connaissance |
