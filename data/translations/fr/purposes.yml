  database_api.list_account_recovery_requests: |-
    Retourne une liste de demandes de récupération (recovery request) de comptes. Paramètres : `start:string`, `limit:int`, `order:string`

    * `limit` est limité à 1000.
    * `order` peut être l'un des suivants :
      * `by_account` - tri par nom de compte
      * `by_expiration` - tri par expiration

    | `account` (string) | `limit` (int) | `order` (string) | |
    |--------------------|-|
    | `"steemit"` | 10 | `"by_account"` | Interroge les demandes de récupération du compte nommé "steemit", triées par nom de compte. |
    | `["1960-01-01T00:00:00"]` | 10 | `"by_expiration"`| Interroge les demandes de récupération par date, triées par expiration. |
  database_api.list_accounts: |-
    Liste les comptes triés selon la clé spécifiée. Paramètres : `start:object`, `limit:int`, `order:string`

    * `limit` est limité à 1000.
    * `order` peut être l'un des suivants :
      * `by_name` - tri par nom de compte
      * `by_proxy` - tri par proxy (proxy)
      * `by_next_vesting_withdrawal` - tri par le prochain-prochain retrait de vesting (vesting withdrawal)

    | `start` (object) | `limit` (int) | `order` (string) |
    |-------------------|-|
    | `""` | `10` | `"by_name"` Interroge jusqu'à 10 comptes à partir du début, triés par nom. |
    | `["", ""]` | `10` | `"by_proxy"` Interroge jusqu'à 10 comptes à partir du début, triés par proxy. |
    | `["1960-01-01T00:00:00", ""]` | `10` | `"by_next_vesting_withdrawal"` Interroge jusqu'à 10 comptes à partir du début, triés par le prochain retrait de vesting. |

    Voir aussi : Paginated API Methods
  database_api.list_change_recovery_account_requests: |-
    Retourne une liste de demandes de changement de compte de récupération (recovery account). Paramètres : `start:object`, `limit:int`, `order:string`

    * `start` dépend de `order` (voir ci-dessous)
    * `limit` est limité à 1000.
    * `order` peut être l'un des suivants :
      * `by_account` - tri par compte
        * `start` est une chaîne de caractères : `account`
      * `by_effective_date` - tri par date d'entrée en vigueur (effective date)
        * `start` est un tableau de deux valeurs : `timestamp`, `account`

    | `start` (object) | `limit` (int) | `order` (string) | |
    |----------------------------|---------------|-|
    | `""` | 10 | `"by_account"` | Interroge les 10 premières demandes, tri par compte |
    | `["1960-01-01T00:00:00", ""]` | 10 | `"by_effective_date"` | Interroge les 10 premières demandes, tri par date d'entrée en vigueur |

    Voir aussi : Paginated API Methods
  database_api.list_comments: |-
    Retourne tous les commentaires (comment), à partir des options spécifiées. Paramètres : `start:array` ; `limit:int` ; `order:string`

    * `start` dépend de `order` (voir ci-dessous)
    * `limit` est limité à 1000.
    * `order` peut être l'un des suivants :
      * `by_cashout_time` - tri par date de paiement (cashout time)
        * `start` est un tableau d'une valeur obligatoire et de deux facultatives : `timestamp`, `author`, `permlink`
      * `by_permlink` - tri par permlink (lien permanent)
        * `start` est un tableau de deux valeurs facultatives : `author`, `permlink`
      * `by_root` - tri par racine (root)
        * `start` est un tableau de deux valeurs obligatoires et de deux facultatives : `root_author`, `root_permlink`, `child_author`, `child_permlink`
      * `by_parent` - tri par parent (parent)
        * `start` est un tableau de deux valeurs obligatoires et de deux facultatives : `parent_author`, `parent_permlink`, `child_author`, `child_permlink`

    | `start` (array) | `limit` (int) | `order` (string) | |
    |----------------------------|---------------|-|
    | `["1970-01-01T00:00:00", "", ""]` | 10 | `"by_cashout_time"` | Interroge les 10 premiers commentaires, tri par date de paiement |
    | `["", ""]` | 10 | `"by_permlink"` | Interroge les 10 premiers commentaires, tri par permlink |
    | `["steemit","firstpost", "", ""]` | 10 | `"by_root"` | Interroge les 10 commentaires suivants à partir de @steemit/firstpost, tri par racine |
    | `["steemit","firstpost", "", ""]` | 10 | `"by_parent"` | Interroge les 10 commentaires suivants à partir de @steemit/firstpost, tri par parent |

    Voir aussi : Paginated API Methods
  database_api.list_decline_voting_rights_requests: |-
