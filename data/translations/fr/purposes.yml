  database_api.list_proposal_votes: |-
    Retourne tous les votes pour les propositions (proposal vote), à partir du votant ou du `proposal.id` spécifiés. Paramètres : `start:array` ; `limit:int` ; `order:string` ; `order_direction:string` ; `status:string`

    * `start` dépend de `order` (voir ci-dessous)
      * `voter` - votant de la proposition (nom de compte sous forme de chaîne)
      * `proposal.id` - identifiant de la proposition (int)
    * `limit` est limité à 1000.
    * `order` peut être l'un des suivants :
      * `by_voter_proposal` - tri par votant de la proposition
      * `by_proposal_voter` - tri par `proposal.id`
    * `order_direction` peut être l'un des suivants :
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `["alice"]` | 10 | `by_voter_proposal` | `ascending` | `active` | liste 10 propositions avec le statut actif, triées par votant, ordre croissant |
    | `[10]` | 1000 | `by_proposal_voter` | `ascending` | `votable` | liste 1000 votes sur la proposition 10, triés par `proposal.id`, ordre croissant |

    Voir aussi : Paginated API Methods
  database_api.list_proposals: |-
    Retourne toutes les propositions (proposal), à partir du créateur ou de la date de début spécifiés. Paramètres : `start:array` ; `limit:int` ; `order:string` ; `order_direction:string` ; `status:string`

    * `start` dépend de `order` (voir ci-dessous)
      * `creator` - créateur de la proposition (nom de compte sous forme de chaîne)
      * `start_date` - date de début de la proposition (chaîne date)
      * `end_date` - date de fin de la proposition (chaîne date)
      * `total_votes` - nombre total de votes de la proposition (int)
    * `limit` est limité à 1000.
    * `order` peut être l'un des suivants :
      * `by_creator` - tri par créateur de la proposition
      * `by_start_date` - tri par date de début de la proposition
      * `by_end_date` - tri par date de fin de la proposition
      * `by_total_votes` - tri par nombre total de votes de la proposition
    * `order_direction` peut être l'un des suivants :
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `[""]` | 10 | `by_creator` | `ascending` | `active` | liste 10 propositions avec le statut actif, triées par créateur, ordre croissant |
    | `["2019-08-07T16:54:03"]` | 1000 | `by_start_date` | `ascending` | `inactive` | liste 1000 propositions avec le statut inactif, triées par date de début, ordre croissant, depuis 2019-08-07T16:54:03 |
    | `["a"]` | 1 | `by_creator` | `ascending` | `expired` | liste 1 proposition avec le statut expiré, triée par créateur, ordre croissant, pour les comptes commençant par "a" |
    | `["alice"]` | 10 | `by_creator` | `ascending` | `all` | liste 10 propositions avec n'importe quel statut, triées par créateur, ordre croissant, pour alice |
    | `[""]` | 1000 | `by_creator` | `ascending` | `votable` | liste 1000 propositions votables, triées par créateur, ordre croissant |
    | `[10]` | 1000 | `by_total_votes` | `ascending` | `votable` | liste 1000 propositions votables, triées par créateur, ordre croissant, ayant au moins 10 votes |

    Voir aussi : Paginated API Methods
  database_api.list_savings_withdrawals: |-
    Retourne une liste de retraits d'épargne (savings withdrawal). Paramètres : `start:object`, `limit:int`, `order:string`

