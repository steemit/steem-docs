# ---------------------------------------------------------------------------
# ko translations of the quickstart page prose (T6-2). Consumed by
# scripts/gen-nodes.mjs --locale ko -> docs/ko/quickstart/index.md.
#
# 페이지 산문 조각들의 한국어 번역. 라이브러리 표·노드 표의 행과 curl 예시는
# 영어 원본과 동일한 소스를 공유하며 여기서 번역하지 않는다(표 열 머리글은
# 번역 가능). 링크 대상은 영어판 그대로 두고 링크 텍스트만 번역한다. 용어는
# docs/.vitepress/ko-glossary.json 동결 기준을 따른다. 동적 전역 속성
# (dynamic global properties) 등 용어는 첫 등장 시 『한국어 표기 (English)』
# 형식으로 병기하고, STEEM·JSON-RPC·steemd·steem-js·steemgosdk·steem-python
# 등 식별자는 영어 원형을 유지한다. {updated}와 {example_url}는 생성기
# 플레이스홀더이므로 삭제해서는 안 된다.
# ---------------------------------------------------------------------------
schema: lc-quickstart/v1
locale: ko
strings:
  title: 빠른 시작
  description: Steem 클라이언트 라이브러리를 선택하고, 퍼블릭 API 노드에 연결하여 첫 번째 JSON-RPC 호출을 수행하세요.
  intro: |-
    Steem 블록체인에 연결하려면 두 가지를 결정해야 합니다. 자신의 스택에 맞는 **클라이언트 라이브러리**(client library)를 고르고, 이를 **API 노드**(API node)에 연결하는 것입니다. 이 페이지에서 두 과정을 모두 다루므로, 몇 분 안에 첫 요청을 보낼 수 있습니다.
  choose_library:
    heading: 라이브러리 선택
    lead: |-
      공식 클라이언트 라이브러리를 사용하면 인프라와 목적에 맞춰 쉽게 Steem 데이터에 접근할 수 있습니다:
    table_headers: [언어, 라이브러리, 설명]
    note: |-
      이 라이브러리들은 모두 JSON-RPC로 `steemd` 노드와 통신합니다 — 다음 절의 연결 설정은 그중 어느 라이브러리에도 똑같이 적용됩니다.
  connect_node:
    heading: 노드에 연결
    lead: |-
      Steem 블록체인과 직접 통신하는 애플리케이션은 `steemd` 노드에 연결해야 합니다. 자체 인스턴스를 운영하거나, 아래에 나열된 퍼블릭 API 노드 중 하나로 시작할 수 있습니다.
    websocket_note: |-
      `steemd`는 WebSocket(`wss://`와 `ws://`)을 완전히 지원하지만, 퍼블릭 노드는 보통 그렇지 않습니다. 여기에 나열된 모든 노드는 HTTPS를 사용합니다.
    table_headers: [URL, 운영자]
    freshness_note: |-
      이 목록은 커뮤니티가 관리하며 언제든 바뀔 수 있습니다. 위의 각 노드는 {updated}에 직접 JSON-RPC 호출로 라이브 검증을 거쳤으며, 테스트에 실패한 노드는 제거되었습니다. 어떤 노드가 응답하지 않으면 표의 다른 항목으로 전환하세요.
  test_curl:
    heading: curl로 노드 테스트
    lead: |-
      모든 퍼블릭 노드는 HTTPS로 JSON-RPC를 제공합니다. 아래 예시는 {example_url}에 체인의 동적 전역 속성(dynamic global properties)을 요청합니다 — 응답의 `head_block_number` 필드가 해당 노드가 서빙하는 체인의 꼭대기입니다:
  closing: |-
    동일한 요청 봉투(envelope)는 [API 레퍼런스](/api/)의 모든 메서드에 그대로 동작합니다 — 위 표의 어떤 노드로든 요청을 보내거나, 그 URL을 클라이언트 라이브러리의 노드 설정에 넣어 주세요.
