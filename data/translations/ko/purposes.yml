  database_api.get_active_witnesses: |-
    활동 중인 위트니스 (witness) 목록을 반환합니다.
  database_api.get_config: |-
    컴파일 타임 상수에 대한 정보를 반환합니다. 일부 속성은 존재하지 않을 수 있습니다.  참고: Understanding Configuration Values
  database_api.get_current_price_feed: |-
    현재 가격 피드를 반환합니다.
  database_api.get_dynamic_global_properties: |-
    현재 동적 전역 속성을 반환합니다.  참고: Understanding Dynamic Global Properties
  database_api.get_feed_history: |-
    피드 가격 (feed price) 값의 이력을 반환합니다.
  database_api.get_hardfork_properties: |-
    블록체인의 하드포크에 관한 현재 속성을 반환합니다.
  database_api.get_nai_pool: |-
    새로 생성할 SMT (스마트 미디어 토큰)에 사용할 수 있는, 숫자 자산 식별자 (NAI, Numeric Asset Identifier) 배열을 반환합니다.

    참고: [Numerical Asset Identifiers](https://github.com/steemit/smt-whitepaper/blob/master/smt-manual/manual.md#numerical-asset-identifiers)
  database_api.get_order_book: |-
    호가창 (order book)을 반환합니다.
  database_api.get_potential_signatures: |-
    이 메서드는 주어진 트랜잭션에 대해 서명할 수 있는 모든 공개 키의 집합을 반환합니다. 지갑은 이 호출을 통해, 최소 부분집합을 얻기 위해 `get_required_signatures`를 호출하기 전에 자신이 보유한 공개 키 집합을 관련 부분집합만 남도록 걸러낼 수 있습니다.
  database_api.get_required_signatures: |-
    이 API는 부분 서명된 트랜잭션과, 소유자가 서명할 수 있는 공개 키 집합을 받아서, 트랜잭션에 서명을 추가해야 하는 공개 키의 최소 부분집합을 반환합니다.
  database_api.get_reward_funds: |-
    현재 보상 펀드 (reward fund)에 대한 정보를 반환합니다.
  database_api.get_transaction_hex: |-
    트랜잭션의 직렬화된 이진 형태를 헥스 덤프 (hexdump)로 반환합니다.
  database_api.get_version: |-
    블록체인, steem, FC의 컴파일 타임 버전을 반환합니다. 체인 id의 부팅 시점 버전도 함께 반환합니다 (테스트넷 / 메인넷 중 테스트넷을 볼 때에만 컴파일 타임 값과 다를 *수* 있습니다)
  database_api.get_witness_schedule: |-
    현재 위트니스 (witness) 스케줄을 반환합니다.
  database_api.list_account_recovery_requests: |-
    계정 복구 요청 목록을 반환합니다.  파라미터: `start:string`, `limit:int`, `order:string`

    * `limit`는 최대 1000입니다.
    * `order`는 다음 중 하나:
      * `by_account` - 계정 이름 순
      * `by_expiration` - 만료일 순

    | `account` (string) | `limit` (int) | `order` (string) | |
    |--------------------|-|
    | `"steemit"` | 10 | `"by_account"` | "steemit" 계정의 복구 요청을, 계정 이름 순으로 조회합니다. |
    | `["1960-01-01T00:00:00"]` | 10 | `"by_expiration"`| 날짜 기준의 복구 요청을, 만료일 순으로 조회합니다. |
  database_api.list_accounts: |-
    지정된 키 순으로 계정을 나열합니다.  파라미터: `start:object`, `limit:int`, `order:string`

    * `limit`는 최대 1000입니다.
    * `order`는 다음 중 하나:
      * `by_name` - 계정 이름 순
      * `by_proxy` - 프록시 (proxy) 순
      * `by_next_vesting_withdrawal` - 다음 다음 베스팅 인출 순

    | `start` (object) | `limit` (int) | `order` (string) |
    |-------------------|-|
    | `""` | `10` | `"by_name"` 처음부터 시작하는 계정을, 이름 순으로 최대 10개 조회합니다. |
    | `["", ""]` | `10` | `"by_proxy"` 처음부터 시작하는 계정을, 프록시 순으로 최대 10개 조회합니다. |
    | `["1960-01-01T00:00:00", ""]` | `10` | `"by_next_vesting_withdrawal"` 처음부터 시작하는 계정을, 다음 베스팅 인출 순으로 최대 10개 조회합니다. |

    함께 보기: Paginated API Methods
  database_api.list_change_recovery_account_requests: |-
    복구 계정 변경 요청 목록을 반환합니다.  파라미터: `start:object`, `limit:int`, `order:string`

    * `start`는 `order`에 따라 달라집니다 (아래 참고)
    * `limit`는 최대 1000입니다.
    * `order`는 다음 중 하나:
      * `by_account` - 계정 순
        * `start`는 `account` 문자열입니다
      * `by_effective_date` - 적용일 (effective date) 순
        * `start`는 `timestamp`, `account` 두 값으로 이루어진 배열입니다

    | `start` (object) | `limit` (int) | `order` (string) | |
    |----------------------------|---------------|-|
    | `""` | 10 | `"by_account"` | 처음 10개 요청을, 계정 순으로 조회합니다 |
    | `["1960-01-01T00:00:00", ""]` | 10 | `"by_effective_date"` | 처음 10개 요청을, 적용일 순으로 조회합니다 |

