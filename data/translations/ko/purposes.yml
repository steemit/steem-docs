# ---------------------------------------------------------------------------
# ko translations of API method purposes — batch 1-5（238 条全量）
# (phase4-plan §1-T32；schema/风格沿用 zh-method-purposes/v1，batch 字段标
# 语言内批次：batch 1 = C 序 #1-48、batch 2 = #49-96、batch 3 = #97-144、
# batch 4 = #145-192、batch 5 = #193-238，按写入顺序)
#
# api_method -> 한국어 purpose 번역。原文以 data/apidefinitions/*.yml 中
# 现有 en purpose 字段为准，不增不减不改语义；markdown 结构（表格/列表/加粗/
# 链接/代码 span）按原文保留（含 en 表格断列：list_accounts、list_owner_histories、
# find_vesting_delegation_expirations、find_vesting_delegations、
# list_savings_withdrawals、list_sbd_conversion_requests、list_limit_orders、
# list_account_recovery_requests、list_smt_contributions、list_smt_token_emissions、
# list_smt_tokens、list_vesting_delegation_expirations、list_vesting_delegations
# 等表头/分隔/行列数不齐，以及 lookup_accounts/lookup_witness_accounts 表行缺尾竖线），
# 仅翻译文字内容；代码 span 内文字一律不动。
#
# 术语遵循 docs/.vitepress/ko-glossary.json 的 34 条冻结基线（위트니스 (witness)、
# 베스팅 지분 (VESTS)、스팀 달러 (SBD)、Resource Credits (RC)、큐레이션、하드포크、
# 동적 전역 속성、계정 기록、퍼머링크 (permlink)、프로포절 (제안)、포스트 (게시물)、
# 피드 가격 (feed price)、스레드、평판、태그、STEEM Power (SP) 等）；
# 方法名、参数名、字段值、API 名与被引用文档页标题（Paginated API Methods、
# Understanding Configuration Values、Understanding Dynamic Global Properties、
# Forum/Market Bandwidth、SMT 白皮书章节链接文本）保留英文。术语首次出现按
# glossary conventions 使用『한국어 표기 (English)』格式；SMT 冻结条目为
# SMT (스마트 미디어 토큰)（本轮 v1.1 回写）。行文为「합니다」体简洁说明句，不使用
# 感叹号；「Also see:」译作「함께 보기:」、「See:」译作「참고:」、「Note:」译作「참고:」，
# 表内引用账户名处照原文使用直引号。
#
# en 原文的既有缺陷语义如实保留，不擅自“修正”：condenser_api.list_proposal_votes
# /list_proposals 的 Also see 行引用拼写 datbase_api（各 1 处）、
# get_vesting_delegations 的 Also see 行 Paginated API Methods 重复、
# get_blog_authors 表内 alice". 缺左引号、lookup_accounts 参数行缺冒号
# （파라미터`lower_bound_name）、lookup_accounts/lookup_witness_accounts 表行
# 缺尾竖线、list_limit_orders/list_witness_votes 表内 order 值串行
# （by_effective_date/by_withdraw_route/by_destination）、
# get_witnesses_by_vote 表内 limit `1` 配文 “top 10”、find_rc_accounts 表内
# 第二行只列 alice 而行文写 “alice" and "bob”、list_accounts 的
# “next next vesting withdrawal” 与 accont/withdrawl 拼写、
# get_witness_by_account 的 “(of `null` if none exists)”（of 应为 or）等均照原文
# 直译或原样保留。en 硬换行（Understanding Configuration Values、
# Understanding Dynamic Global Properties、database_api.get_config 的
# “Some properties may / not be present.”、database_api.get_potential_signatures
# 段落、database_api.get_version 句子共 5 处）在韩语中并为一行，语义不变。
#
# 死方法（deprecated/disabled/removed 三族）照常翻译，不因死亡而省略；
# 机械核验（isDeadWithCause：死亡 flag + 非空 detail）确认全量 238 键共
# 35 个死方法（disabled 25、removed 3、deprecated 7）；裸 badge 5 个
# （get_state、verify_account_authority ×2 变体、account_history_api.get_transaction、
# get_account_references）照常翻译；23 个三期新增方法（bridge 系 14、
# condenser_api follow 分页对 2、chain_api 2、hive 1、tags 1、call 1 及
# T22 补页清单其余）全部在内。
#
# 排序口径仍为 LC_ALL=C（字节序），是唯一口径。机械核验（LC_ALL=C sort 对
# en_US.UTF-8 sort）：ko 的键为 ASCII（api_method 名），与 es 同一键集，故
# C/UTF-8 collation 分歧对与 es 完全相同，共 5 处：
#   1. condenser_api.get_account_votes ↔ get_accounts（C 序 #39/#40）
#   2. condenser_api.get_witness_schedule ↔ get_witnesses（C 序 #110/#111，
#      UTF-8 下 schedule 排到 get_witnesses_by_vote 之后）
#   3. condenser_api.list_proposal_votes ↔ list_proposals（C 序 #113/#114）
#   4. database_api.list_proposal_votes ↔ list_proposals（C 序 #161/#162）
#   5. database_api.list_witness_votes ↔ list_witnesses（C 序 #172/#173）
# 各分歧对均整体落在同一 batch 窗口内，batch 边界一律按本头注记的 C 序执行。
# （韩语值文本不参与键排序——排序对象是 api_method 键，故不存在韩文音节序分歧。）
#
# 消费方：scripts/gen-api-docs.mjs --locale ko。
# ---------------------------------------------------------------------------
schema: zh-method-purposes/v1
locale: ko
batch: 1-5
purposes:
  account_by_key_api.get_key_references: |-
    해당 키를 자신의 owner 또는 active 권한 (authority)에 연결하고 있는 모든 계정을 반환합니다.
  account_history_api.enum_virtual_ops: |-
    블록 범위 안의 버추얼 오퍼레이션 (virtual operation)을 반환하며, 계정과 오퍼레이션 유형으로 필터링할 수 있습니다.
  account_history_api.get_account_history: |-
    주어진 계정의 모든 오퍼레이션 기록을 반환합니다.

    함께 보기: Paginated API Methods
  account_history_api.get_ops_in_block: |-
    하나의 블록에 포함된 모든 오퍼레이션을 반환합니다.
  account_history_api.get_transaction: |-
    트랜잭션 id로 해당 트랜잭션의 상세 정보를 반환합니다.
  block_api.get_block: |-
    지정한 블록의 서명된 전체 블록을 조회합니다. 일치하는 블록이 없으면 `null`을 반환합니다.

    **파라미터:**

      * `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | 가장 첫 번째 블록을 조회합니다. |
    | `8675309` | 블록 번호 8,675,309를 조회합니다. |
    | `62396745` | 블록 번호 62,396,745를 조회합니다. |
  block_api.get_block_header: |-
    지정한 블록의 블록 헤더를 조회합니다. 일치하는 블록이 없으면 `null`을 반환합니다.

    **파라미터:**
      
      * `block_num:int` - 헤더를 반환할 블록의 높이

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | 가장 첫 번째 블록의 블록 헤더를 조회합니다. |
    | `8675309` | 블록 번호 8,675,309의 블록 헤더를 조회합니다. |
    | `62396745` | 블록 번호 62,396,745의 블록 헤더를 조회합니다. |
  bridge.account_notifications: |-
    계정 알림 (notification)입니다.

    `type`에 사용할 수 있는 값:
      * `new_community` - 새 커뮤니티가 생성됨
      * `set_role` - mod/admin이 계정에 역할을 추가함
      * `set_props` - 커뮤니티 속성이 설정됨
      * `set_label` - 계정에 칭호/배지/라벨이 설정됨
      * `mute_post` - 포스트 (게시물)가 사유와 함께 뮤트 (mute)됨
      * `unmute_post` - 포스트가 사유와 함께 뮤트 해제됨
      * `pin_post` - 포스트가 고정됨
      * `unpin_post` - 포스트가 고정 해제됨
      * `flag_post` - 포스트가 회원에 의해 사유와 함께 신고 (flag)됨
      * `error` - 해석할 수 없는 오퍼레이션에 대해 개발자에게 피드백을 전달함
      * `subscribe` - 계정이 커뮤니티를 구독함
      * `reply` - 포스트에 답글이 달림
      * `reblog` - 포스트가 리블로그 (resteem)됨
      * `follow` - 계정이 다른 계정을 팔로우함
      * `mention` - 저자가 계정을 멘션함
      * `vote` - 투표자가 저자에게 투표함

    `score` 값은 알림이 발생한 계정의 랭크를 기준으로 합니다.
  bridge.get_account_posts: |-
    계정의 포스트 (게시물)를 조회합니다 — 블로그, 피드, 댓글 또는 답글.

    `sort`에 사용할 수 있는 값:
      * `blog`
      * `feed`
      * `posts`
      * `comments`
      * `replies`
      * `payout`

    파라미터: `sort:string`; `account:string`; `start_author:string` (선택 사항, 기본값은 빈 값); `start_permlink:string` (선택 사항, 기본값은 빈 값); `limit:int` (선택 사항, 기본값 `20`, 최대 `100`); `observer:string` (선택 사항)

    함께 보기: bridge.get_ranked_posts
  bridge.get_community: |-
    커뮤니티 상세 정보를 조회합니다.
  bridge.get_community_context: |-
    커뮤니티/계정 쌍에 대해, 해당 계정의 역할과 칭호, 구독 여부를 반환합니다.

    파라미터: `name:string` (커뮤니티 이름, 예: `hive-123456`); `account:string`

    함께 보기: bridge.get_community
  bridge.get_discussion: |-
    `author/permlink`를 키로 하는 전체 토론 스레드 — 루트 포스트 (게시물)와 그에 달린 답글 전체 — 를 반환합니다. 이는 `condenser_api.get_state` 중 스레드에 해당하는 부분을 대체하는 hivemind 버전입니다.

    파라미터: `author:string`; `permlink:string`
  bridge.get_payout_stats: |-
    트리맵 (treemap)을 만들기 위한 지급 (payout) 통계를 조회합니다: 전체 블로그 지급액에 더해, 상위 커뮤니티마다 하나의 `(url, label, payout, posts, authors)` 튜플.

    파라미터: `limit:int` (선택 사항, 기본값 `250`, 최대 `250`)
  bridge.get_post: |-
    포스트 (게시물) 하나를 가져옵니다.

    파라미터: `author:string`; `permlink:string`; `observer:string` (선택 사항)
  bridge.get_post_header: |-
    포스트 (게시물)의 기본 데이터를 가져옵니다: 저자, 퍼머링크 (permlink), 카테고리, 깊이.

    파라미터: `author:string`; `permlink:string`
  bridge.get_profile: |-
    계정/프로필 데이터를 조회합니다: 메타데이터, 평판, 팔로우 통계, 블랙리스트.

    파라미터: `account:string`; `observer:string` (선택 사항)
  bridge.get_ranked_posts: |-
    랭킹이 매겨진 포스트 (게시물)를 조회합니다.

    `sort`에 사용할 수 있는 값:
      * `trending`
      * `hot`
      * `created`
      * `promoted`
      * `payout`
      * `payout_comments`
      * `muted`
      
    `tag` 값에는 유효한 모든 태그를 사용할 수 있습니다.

    `observer` 값에는 유효한 모든 계정 또는 빈 문자열을 사용할 수 있습니다.
  bridge.get_trending_topics: |-
    대기 중인 포스트 (게시물) 전반(커뮤니티와 태그가 섞여 있음)에서 상위 인기 (trending) 주제를 반환합니다.

    파라미터: `limit:int` (선택 사항, 기본값 `10`, 최대 `25`); `observer:string` (선택 사항, 아직 사용되지 않음)
  bridge.list_all_subscriptions: |-
    한 계정의 커뮤니티 구독 전체를 나열합니다.
  bridge.list_communities: |-
    모든 커뮤니티를 페이지 단위로 나열합니다. 요약 (lite) 형태의 커뮤니티 목록을 반환합니다.

    `sort`에 사용할 수 있는 값:
      * `rank`
      * `new`
      * `subs`

    파라미터: `last:string` (선택 사항, 기본값은 빈 값); `limit:int` (선택 사항, 기본값 `100`, 최대 `100`); `query:string` (선택 사항, 제목과 소개에 대한 전문 (full-text) 검색); `sort:string` (선택 사항, 기본값 `rank`); `observer:string` (선택 사항)

    함께 보기: bridge.get_community
  bridge.list_community_roles: |-
    커뮤니티 안의 각 계정에 대한 커뮤니티 역할과 라벨을 나열합니다.
  bridge.list_pop_communities: |-
    새 구독자 수 기준으로 커뮤니티를 나열합니다. 요약 (lite) 형태의 커뮤니티 목록을 반환합니다.

    파라미터: `limit:int` (선택 사항, 기본값 `25`, 최대 `25`)

    참고: 2026-10-28 기준으로, 퍼블릭 노드는 이 호출에 대해 서버 오류를 반환합니다 (배포된 hivemind 빌드는 `cutoff` 쿼리 파라미터를 아예 바인딩하지 않습니다). 아래 응답은 의도된 형태를 보여줍니다.
  bridge.list_subscribers: |-
    커뮤니티의 구독자를 나열합니다 (최대 250명, 최신 순) — `name`/`role`/`title`/`created_at` 튜플 형태입니다.

    파라미터: `community:string` (예: `hive-123456`)
  bridge.normalize_post: |-
    steemd 포스트 (게시물) 객체(`condenser_api.get_content`가 반환한 것)를 받아서 bridge-api 정규화 버전을 출력합니다.

    파라미터: `post:object` (`condenser_api.get_content`가 반환한 것과 정확히 같은 전체 steemd 포스트 객체를, 요소 하나짜리 배열로 감싸서 전달: `params: [{ <post object> }]`)

    **참고:** 포스트 객체는 steemd 필드 전체를 담고 있어야 합니다 — 아래 예시는 가독성을 위해 `body`만 축약한 것입니다. 객체를 배열로 감싸지 않고 `params`에 그대로 전달하면 `-32602`가 반환되고, 불완전한 객체(`percent`/`reputation`이 없는 `active_votes` 항목, `cashout_time` 같은 지급 필드가 빠진 경우 등)는 `-32000`을 반환합니다.
  bridge.post_notifications: |-
    특정 포스트 (게시물)의 알림을 조회합니다.

    파라미터: `author:string`; `permlink:string`; `min_score:int` (선택 사항, 기본값 `25`); `last_id:int` (선택 사항, 이 알림 id부터 탐색); `limit:int` (선택 사항, 기본값 `100`, 최대 `100`)

    참고: 2026-10-28 기준으로, 알림이 있는 포스트에 대해 퍼블릭 노드는 이 호출에서 내부 오류를 반환합니다. 아래 응답은 의도된 형태를 보여줍니다.

    함께 보기: bridge.account_notifications
  bridge.unread_notifications: |-
    지정된 계정의 알림 상태를 조회합니다: 마지막으로 읽은 시각과, `min_score` 이상의 점수를 가진 읽지 않은 알림 수.

    파라미터: `account:string`; `min_score:int` (선택 사항, 기본값 `25`)

    함께 보기: bridge.account_notifications
  call: |-
    구버전 방식의 `call` 메서드 요청을 라우팅합니다.

    파라미터: `api:string` (`condenser_api`만 허용됨); `method:string` (라우팅되는 condenser_api 메서드 중 하나: get_followers, get_following, get_followers_by_page, get_following_by_page, get_follow_count, get_content, get_content_replies, get_trending_tags, get_state, get_discussions_by_trending, get_discussions_by_hot, get_discussions_by_promoted, get_discussions_by_created, get_post_discussions_by_payout, get_comment_discussions_by_payout, get_discussions_by_blog, get_discussions_by_feed, get_discussions_by_comments, get_replies_by_last_update, get_discussions_by_author_before_date, get_blog, get_blog_entries, get_account_votes); `params:array` (라우팅되는 메서드의 파라미터)

    그 밖의 메서드는 오류를 반환합니다.
  chain_api.push_block: |-
    블록을 노드에 푸시합니다.

    파라미터: `block:object` (서명된 블록); `currently_syncing:bool` (선택 사항, 기본값 `false`)

    `success:bool`을 반환하며, 실패 시 `error:string`을 반환합니다.
  chain_api.push_transaction: |-
    트랜잭션을 노드에 푸시합니다.

    파라미터: 래퍼 없이 서명된 트랜잭션 객체 그 자체: `ref_block_num:int`; `ref_block_prefix:int`; `expiration:timestamp`; `operations:array`; `extensions:array`; `signatures:array`

    `success:bool`을 반환하며, 실패 시 `error:string`을 반환합니다.
  condenser_api.broadcast_block: |-
    블록을 브로드캐스트하는 데 사용합니다.

    함께 보기: network_broadcast_api.broadcast_block
  condenser_api.broadcast_transaction: |-
    트랜잭션을 브로드캐스트하는 데 사용합니다.

