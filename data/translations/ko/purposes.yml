    **참고:** 행 오프셋은 `page * page_size`입니다. `page_size`는 필수이며, 생략하면 위치 형식이든 이름 형식이든 `-32602`를 반환합니다.

    | `account` (string) | `page` (int) | `page_size` (int) | |
