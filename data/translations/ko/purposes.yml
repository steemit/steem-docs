  database_api.list_comments: |-
    지정된 옵션부터 모든 댓글을 반환합니다.  파라미터: `start:array`; `limit:int`; `order:string`

    * `start`는 `order`에 따라 달라집니다(아래 참조)
    * `limit`는 최대 1000입니다.
    * `order`는 다음 중 하나입니다:
      * `by_cashout_time` - 캐시아웃 시간 기준 정렬
        * `start`는 필수 값 하나와 선택 값 두 개(`timestamp`, `author`, `permlink`)의 배열
      * `by_permlink` - 퍼머링크(permlink) 기준 정렬
        * `start`는 선택 값 두 개(`author`, `permlink`)의 배열
      * `by_root` - 루트 기준 정렬
        * `start`는 필수 값 두 개와 선택 값 두 개(`root_author`, `root_permlink`, `child_author`, `child_permlink`)의 배열
      * `by_parent` - 부모 기준 정렬
        * `start`는 필수 값 두 개와 선택 값 두 개(`parent_author`, `parent_permlink`, `child_author`, `child_permlink`)의 배열

    | `start` (array) | `limit` (int) | `order` (string) | |
    |----------------------------|---------------|-|
    | `["1970-01-01T00:00:00", "", ""]` | 10 | `"by_cashout_time"` | 첫 10개 댓글을 캐시아웃 시간 기준 정렬로 조회합니다 |
    | `["", ""]` | 10 | `"by_permlink"` | 첫 10개 댓글을 퍼머링크 기준 정렬로 조회합니다 |
