# ---------------------------------------------------------------------------
# ko translations of API method purposes — batch 1-5（238 条全量）
# (phase4-plan §1-T32；schema/风格沿用 zh-method-purposes/v1，batch 字段标
# 语言内批次：batch 1 = C 序 #1-48、batch 2 = #49-96、batch 3 = #97-144、
# batch 4 = #145-192、batch 5 = #193-238，按写入顺序)
#
# api_method -> 한국어 purpose 번역。原文以 data/apidefinitions/*.yml 中
# 现有 en purpose 字段为准，不增不减不改语义；markdown 结构（表格/列表/加粗/
# 链接/代码 span）按原文保留，仅翻译文字内容；代码 span 内文字一律不动。
#
# 术语遵循 docs/.vitepress/ko-glossary.json 的 30 条冻结基线：witness 译作韩国
# Steem 社区通用的「위트니스」并首现括注英文；Resource Credits (RC)、STEEM Power
# (SP)、permlink 保留英文（首现括注）；VESTS=베스팅 지분 (VESTS)；SBD=스팀 달러
# (SBD)；hardfork=하드포크；dynamic global properties=동적 전역 속성；account
# history=계정 기록；proposal=프로포절 (제안)；post=포스트 (게시물)；curation=
# 큐레이션；reputation=평판；tag=태그等。方法名、参数名、字段值、API 名与被引用
# 文档页标题（Paginated API Methods、Understanding Configuration Values、
# Understanding Dynamic Global Properties、Forum/Market Bandwidth 及 SMT 白皮书
# 链接文字）保留英文。术语首次出现按 glossary conventions 使用
# 『한국어 표기 (English)』格式；SMT 无冻结条目，按惯用展开 SMT (스마트 미디어
# 토큰)。行文为简洁说明句（합니다체），不使用感叹号；表内引用账户名处照原文
# 使用直引号。
#
# en 原文的既有缺陷语义如实保留，不擅自“修正”：condenser_api.list_proposal_votes
# /list_proposals 的 Also see 行引用拼写 datbase_api（各 1 处）、
# get_vesting_delegations 的 Also see 行 Paginated API Methods 重复、
# get_blog_authors 表内 alice". 缺左引号、lookup_accounts 参数行缺冒号
# （파라미터`lower_bound_name）、lookup_accounts/lookup_witness_accounts 表行
# 缺尾竖线、list_accounts/list_owner_histories/find_vesting_delegation_expirations
# 等断表（表头/分隔/行 列数不齐）、list_limit_orders/list_witness_votes 表内
# order 值串行（by_effective_date/by_withdraw_route/by_destination）、
# get_witnesses_by_vote 表内 limit `1` 配文 “상위 10개”、find_rc_accounts 表内
# 第二行只列 alice 而行文写 “alice"과 "bob”、list_accounts 的
# “next next vesting withdrawal” 与 accont/withdrawl 拼写等均照原文直译或
# 原样保留。en 硬换行（Understanding Configuration Values、
# Understanding Dynamic Global Properties、get_potential_signatures 段落、
# verify_authority 句子共 7 处）在韩语中并为一行，语义不变。
#
# 死方法（deprecated/disabled/removed 三族）照常翻译，不因死亡而省略；
# 机械核验（isDeadWithCause：死亡 flag + 非空 detail）确认全量 238 键共
# 35 个死方法（disabled 25、removed 3、deprecated 7）；裸 badge 5 个
# （get_state、verify_account_authority ×2 变体、account_history_api.get_transaction、
# get_account_references）照常翻译；23 个三期新增方法（bridge 系 14、
# condenser_api follow 分页对 2、chain_api 2、hive 1、tags 1、call 1 及
# T22 补页清单其余）全部在内。
#
# 排序口径仍为 LC_ALL=C（字节序），是唯一口径。机械核验（LC_ALL=C sort 对
# ko_KR.UTF-8 sort）确认全量 238 键共 0 处 C/UTF-8 collation 分歧对——
# ko_KR.UTF-8 下 238 键排序与 C 序逐位相同（键集为纯 ASCII 方法名，韩语
# 多音节 collation 不参与键排序），如实记零。
#
# 消费方：scripts/gen-api-docs.mjs --locale ko。
# ---------------------------------------------------------------------------
schema: zh-method-purposes/v1
locale: ko
batch: 1-5
purposes:
  account_by_key_api.get_key_references: |-
    오너(owner) 또는 액티브(active) 권한(authority)에 연결된 키를 가진 모든 계정을 반환합니다.
  account_history_api.enum_virtual_ops: |-
    블록 범위 내의 가상 오퍼레이션(virtual operation)을 반환합니다. 계정과 오퍼레이션 유형으로 선택적으로 필터링할 수 있습니다.
  account_history_api.get_account_history: |-
    주어진 계정의 모든 오퍼레이션 이력을 반환합니다.

    추가 참조: Paginated API Methods
  account_history_api.get_ops_in_block: |-
    블록에 포함된 모든 오퍼레이션을 반환합니다.
  account_history_api.get_transaction: |-
    트랜잭션 ID를 기준으로 트랜잭션의 상세 정보를 반환합니다.
  block_api.get_block: |-
    참조된 블록의 전체 서명된 블록을 가져오며, 일치하는 블록이 없으면 null을 반환합니다.

    **파라미터:**

      * `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | 가장 첫 번째 블록을 조회합니다. |
    | `8675309` | 블록 번호 8,675,309를 조회합니다. |
    | `62396745` | 블록 번호 62,396,745를 조회합니다. |
  block_api.get_block_header: |-
    참조된 블록의 블록 헤더를 가져오며, 일치하는 블록이 없으면 null을 반환합니다.

    **파라미터:**
      
      * `block_num:int` - 헤더를 반환할 블록의 높이(height)

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | 가장 첫 번째 블록의 블록 헤더를 조회합니다. |
    | `8675309` | 블록 번호 8,675,309의 블록 헤더를 조회합니다. |
    | `62396745` | 블록 번호 62,396,745의 블록 헤더를 조회합니다. |
  bridge.account_notifications: |-
    계정 알림(notification)입니다.

    `type`에 지원되는 값:
      * `new_community` - 새 커뮤니티가 생성되었습니다
      * `set_role` - 모더레이터/관리자가 계정에 역할을 추가합니다
      * `set_props` - 커뮤니티 속성이 설정됩니다
      * `set_label` - 계정에 칭호/배지/라벨이 설정됩니다
      * `mute_post` - 포스트가 사유와 함께 뮤트되었습니다
      * `unmute_post` - 포스트가 사유와 함께 뮤트 해제되었습니다
      * `pin_post` - 포스트가 고정되었습니다
      * `unpin_post` - 포스트의 고정이 해제되었습니다
      * `flag_post` - 포스트가 멤버에 의해 사유와 함께 신고되었습니다
      * `error` - 해석할 수 없는 오퍼레이션에 대해 개발자에게 피드백을 제공합니다
      * `subscribe` - 계정이 커뮤니티를 구독했습니다
      * `reply` - 포스트에 답글이 달렸습니다
      * `reblog` - 포스트가 리블로그되거나 리스팀(resteem)되었습니다
      * `follow` - 계정이 다른 계정을 팔로우했습니다
      * `mention` - 저자가 계정을 멘션했습니다
      * `vote` - 투표자가 저자에게 투표했습니다

    `score` 값은 발신 계정의 랭크를 기준으로 합니다.
  bridge.get_account_posts: |-
    계정의 포스트를 가져옵니다 -- 블로그, 피드, 댓글 또는 답글.

    `sort`에 지원되는 값:
      * `blog`
      * `feed`
      * `posts`
      * `comments`
      * `replies`
      * `payout`

    파라미터: `sort:string`; `account:string`; `start_author:string` (선택, 기본값은 빈 값); `start_permlink:string` (선택, 기본값은 빈 값); `limit:int` (선택, 기본값 `20`, 최대 `100`); `observer:string` (선택)

    추가 참조: bridge.get_ranked_posts
  bridge.get_community: |-
    커뮤니티 상세 정보를 가져옵니다.
  bridge.get_community_context: |-
    커뮤니티/계정 쌍에 대해 계정의 역할, 칭호, 구독 여부를 반환합니다.

    파라미터: `name:string` (커뮤니티 이름, 예: `hive-123456`); `account:string`

    추가 참조: bridge.get_community
  bridge.get_discussion: |-
    `author/permlink`를 키로, 루트 포스트와 그 답글 전체로 이루어진 토론 스레드를 반환합니다.  이것은 `condenser_api.get_state`의 스레드 부분을 대체하는 hivemind 버전입니다.

    파라미터: `author:string`; `permlink:string`
  bridge.get_payout_stats: |-
    트리맵(treemap) 작성용 정산(payout) 통계를 가져옵니다: 전체 블로그 정산 금액에 상위 커뮤니티별로 하나의 `(url, label, payout, posts, authors)` 튜플이 더해집니다.

    파라미터: `limit:int` (선택, 기본값 `250`, 최대 `250`)
  bridge.get_post: |-
    포스트 하나를 가져옵니다.

    파라미터: `author:string`; `permlink:string`; `observer:string` (선택)
  bridge.get_post_header: |-
    포스트의 기본 데이터를 가져옵니다: 저자, 퍼머링크(permlink), 카테고리, 깊이.

    파라미터: `author:string`; `permlink:string`
  bridge.get_profile: |-
    계정/프로필 데이터를 로드합니다: 메타데이터, 평판, 팔로우 통계, 블랙리스트.

    파라미터: `account:string`; `observer:string` (선택)
  bridge.get_ranked_posts: |-
    랭킹에 매겨진 포스트를 가져옵니다.

    `sort`에 지원되는 값:
      * `trending`
      * `hot`
      * `created`
      * `promoted`
      * `payout`
      * `payout_comments`
      * `muted`
      
    `tag` 값으로는 유효한 모든 태그를 쓸 수 있습니다.

    `observer` 값으로는 유효한 모든 계정 또는 빈 문자열을 쓸 수 있습니다.
  bridge.get_trending_topics: |-
    보류 중인 포스트 전반의 상위 인기 토픽(커뮤니티와 태그의 혼합)을 반환합니다.

    파라미터: `limit:int` (선택, 기본값 `10`, 최대 `25`); `observer:string` (선택, 아직 사용되지 않음)
  bridge.list_all_subscriptions: |-
    한 계정의 모든 커뮤니티 구독을 나열합니다.
  bridge.list_communities: |-
    모든 커뮤니티를 페이지네이션(pagination)으로 나열합니다. 라이트(lite) 버전의 커뮤니티 목록을 반환합니다.

    `sort`에 지원되는 값:
      * `rank`
      * `new`
      * `subs`

    파라미터: `last:string` (선택, 기본값은 빈 값); `limit:int` (선택, 기본값 `100`, 최대 `100`); `query:string` (선택, 제목과 소개에 대한 전문 검색); `sort:string` (선택, 기본값 `rank`); `observer:string` (선택)

    추가 참조: bridge.get_community
  bridge.list_community_roles: |-
    커뮤니티 안의 각 계정에 대한 커뮤니티 역할과 라벨을 나열합니다.
  bridge.list_pop_communities: |-
    새 구독자 수 기준으로 커뮤니티를 나열합니다. 라이트(lite) 버전의 커뮤니티 목록을 반환합니다.

    파라미터: `limit:int` (선택, 기본값 `25`, 최대 `25`)

    참고: 2026-10-28 기준으로, 이 호출은 퍼블릭 노드에서 서버 오류를 반환합니다(배포된 hivemind 빌드는 `cutoff` 쿼리 파라미터를 바인딩하지 않습니다). 아래 응답은 의도된 형태를 보여줍니다.
  bridge.list_subscribers: |-
    커뮤니티의 구독자(최대 250명, 최신 항목 우선)를 `name`/`role`/`title`/`created_at` 튜플 형태로 나열합니다.

    파라미터: `community:string` (예: `hive-123456`)
  bridge.normalize_post: |-
    steemd 포스트 객체(`condenser_api.get_content`가 반환하는 형태)를 받아 bridge-api 정규화 버전을 출력합니다.

    파라미터: `post:object` (`condenser_api.get_content`가 반환하는 것과 정확히 동일한, 전체 steemd 포스트 객체. 요소 하나짜리 배열로 감싸서 전달: `params: [{ <post object> }]`)

    **참고:** 포스트 객체는 steemd 필드 전체를 담고 있어야 합니다 -- 아래 예시는 가독성을 위해 `body`만 축약되어 있습니다. `params`에 배열로 감싸지 않은 객체를 그대로 전달하면 `-32602`가 반환되고, 불완전한 객체(예: `active_votes` 항목에 `percent`/`reputation`이 없는 경우, 또는 `cashout_time` 같은 정산 필드가 누락된 경우)는 `-32000`을 반환합니다.
  bridge.post_notifications: |-
    특정 포스트의 알림을 로드합니다.

    파라미터: `author:string`; `permlink:string`; `min_score:int` (선택, 기본값 `25`); `last_id:int` (선택, 이 알림 ID부터 탐색); `limit:int` (선택, 기본값 `100`, 최대 `100`)

    참고: 2026-10-28 기준으로, 알림이 있는 포스트에 대한 이 호출은 퍼블릭 노드에서 내부 오류를 반환합니다. 아래 응답은 의도된 형태를 보여줍니다.

    추가 참조: bridge.account_notifications
  bridge.unread_notifications: |-
    지정된 계정의 알림 상태를 로드합니다: 마지막으로 읽은 시각과 `min_score` 이상의 점수를 가진 읽지 않은 알림 수.

    파라미터: `account:string`; `min_score:int` (선택, 기본값 `25`)

    추가 참조: bridge.account_notifications
  call: |-
    레거시(legacy) 스타일의 `call` 메서드 요청을 라우팅합니다.

    파라미터: `api:string` (`condenser_api`만 허용됨); `method:string` (라우팅되는 condenser_api 메서드 중 하나: get_followers, get_following, get_followers_by_page, get_following_by_page, get_follow_count, get_content, get_content_replies, get_trending_tags, get_state, get_discussions_by_trending, get_discussions_by_hot, get_discussions_by_promoted, get_discussions_by_created, get_post_discussions_by_payout, get_comment_discussions_by_payout, get_discussions_by_blog, get_discussions_by_feed, get_discussions_by_comments, get_replies_by_last_update, get_discussions_by_author_before_date, get_blog, get_blog_entries, get_account_votes); `params:array` (라우팅되는 메서드의 파라미터)

    그 외의 메서드는 오류를 반환합니다.
  chain_api.push_block: |-
    블록을 노드에 푸시합니다.

    파라미터: `block:object` (서명된 블록); `currently_syncing:bool` (선택, 기본값 `false`)

    `success:bool`을 반환하고, 실패 시 `error:string`을 반환합니다.
  chain_api.push_transaction: |-
    트랜잭션을 노드에 푸시합니다.

    파라미터: 감싸지 않은 서명된 트랜잭션 객체 그 자체: `ref_block_num:int`; `ref_block_prefix:int`; `expiration:timestamp`; `operations:array`; `extensions:array`; `signatures:array`

    `success:bool`을 반환하고, 실패 시 `error:string`을 반환합니다.
  condenser_api.broadcast_block: |-
    블록을 브로드캐스트할 때 사용합니다.

    추가 참조: network_broadcast_api.broadcast_block
  condenser_api.broadcast_transaction: |-
    트랜잭션을 브로드캐스트할 때 사용합니다.

    추가 참조: network_broadcast_api.broadcast_transaction
  condenser_api.broadcast_transaction_synchronous: |-
    트랜잭션을 브로드캐스트하고 동기적으로 처리될 때까지 기다립니다.
  condenser_api.find_proposals: |-
    `proposal.id`(`proposal.proposal_id`가 아님)로 프로포절(제안)을 찾습니다.

    추가 참조: database_api.find_proposals
  condenser_api.get_account_bandwidth: |-
    **0.20.6부터 비활성화되었습니다. 참조: [#3029](https://github.com/steemit/steem/issues/3029#issuecomment-428404844)**

    계정의 사용 가능한 대역폭(bandwidth)을 반환합니다.  파라미터: `account:string`; `type:string`, 예: `forum` 또는 `market`

    | `account` (string) | `type` (string) | |
    |--------------------|-----------------|-|
    | `"steemit"` | `"forum"` | "steemit"이라는 이름의 계정에 대해 사용 가능한 forum 대역폭을 조회합니다. |
