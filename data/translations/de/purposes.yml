  condenser_api.list_proposal_votes: |-
    Gibt alle Vorschlags-Stimmen (proposal votes) zurück, beginnend mit dem angegebenen Wähler oder `proposal.id`. Parameter: `start:array`; `limit:int`; `order:string`; `order_direction:string`; `status:string`

    * `start` hängt von `order` ab (siehe unten)
      * `voter` - Wähler des Vorschlags (Kontoname als String)
      * `proposal.id` - ID des Vorschlags (int)
    * `limit` - bis zu 1000.
    * `order` kann einer der folgenden sein:
      * `by_voter_proposal` - Ordnung nach Vorschlags-Wähler
      * `by_proposal_voter` - Ordnung nach `proposal.id`
    * `order_direction` kann einer der folgenden sein:
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `["alice"]` | 10 | `by_voter_proposal` | `ascending` | `active` | listet 10 Vorschläge mit aktivem Status auf, geordnet nach Wähler, aufsteigend |
    | `[10]` | 1000 | `by_proposal_voter` | `ascending` | `votable` | listet 1000 Stimmen für Vorschlag 10 auf, geordnet nach `proposal.id`, aufsteigend |

    Siehe auch: datbase_api.list_proposals
  condenser_api.list_proposals: |-
    Gibt alle Vorschläge zurück, beginnend mit dem angegebenen Ersteller oder Startdatum. Parameter: `start:array`; `limit:int`; `order:string`; `order_direction:string`; `status:string`

    * `start` hängt von `order` ab (siehe unten)
      * `creator` - Ersteller des Vorschlags (Kontoname als String)
      * `start_date` - Startdatum des Vorschlags (Datum als String)
      * `end_date` - Enddatum des Vorschlags (Datum als String)
      * `total_votes` - Gesamtstimmen des Vorschlags (int)
    * `limit` - bis zu 1000.
    * `order` kann einer der folgenden sein:
      * `by_creator` - Ordnung nach Ersteller des Vorschlags
      * `by_start_date` - Ordnung nach Startdatum des Vorschlags
      * `by_end_date` - Ordnung nach Enddatum des Vorschlags
      * `by_total_votes` - Ordnung nach Gesamtstimmen des Vorschlags
    * `order_direction` kann einer der folgenden sein:
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `[""]` | 10 | `by_creator` | `ascending` | `active` | listet 10 Vorschläge mit aktivem Status auf, geordnet nach Ersteller, aufsteigend |
    | `["2019-08-07T16:54:03"]` | 1000 | `by_start_date` | `ascending` | `inactive` | listet 1000 Vorschläge mit inaktivem Status auf, geordnet nach Startdatum, aufsteigend, ab 2019-08-07T16:54:03 |
    | `["a"]` | 1 | `by_creator` | `ascending` | `expired` | listet 1 Vorschlag mit abgelaufenem Status auf, geordnet nach Ersteller, aufsteigend, für Konten, die mit "a" beginnen |
