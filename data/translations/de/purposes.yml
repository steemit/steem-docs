  transaction_status_api.find_transaction: |-
    Gibt den Status einer bestimmten Transaktions-ID zurück. Parameter: `trx_id:string`; `expiration:timestamp` (optional)

    Das Ergebnis enthält einen der folgenden `status`-Werte:

    | Status | Bedeutung |
    |--------|---------|
    | `unknown` | Ablaufzeit in der Zukunft, Transaktion weder in einem Block noch im Mempool enthalten |
    | `within_mempool` | Transaktion im Mempool |
    | `within_reversible_block` | Transaktion wurde in einen Block aufgenommen, Block ist noch nicht irreversibel |
    | `within_irreversible_block` | Transaktion wurde in einen Block aufgenommen, Block ist irreversibel |
    | `expired_reversible` | Transaktion ist abgelaufen, Transaktion ist nicht irreversibel (Transaktion könnte in einem Fork sein) |
    | `expired_irreversible` | Transaktion ist abgelaufen, Transaktion ist irreversibel (Transaktion kann nicht in einem Fork sein) |
    | `too_old` | Transaktion ist zu alt, ich kenne sie nicht |
