# ---------------------------------------------------------------------------
# de translations of API method purposes — batch 1-5（238 条全量）
# (phase4-plan §1-T29；schema/风格沿用 zh-method-purposes/v1，batch 字段标
# 语言内批次：batch 1 = C 序 #1-48、batch 2 = #49-96、batch 3 = #97-144、
# batch 4 = #145-192、batch 5 = #193-238，按写入顺序)
#
# api_method -> deutsche Übersetzung des purpose。原文以 data/apidefinitions/*.yml 中
# 现有 en purpose 字段为准，不增不减不改语义；markdown 结构（表格/列表/加粗/
# 链接）按原文保留，仅翻译文字内容。
#
# 术语遵循 docs/.vitepress/de-glossary.json 的 30 条冻结基线（Witness、
# Vesting-Anteile (VESTS)、STEEM-Dollar (SBD)、Resource Credits (RC)、
# Permlink (permanenter Link)、dynamische globale Eigenschaften 等）；方法名、
# 参数名、字段值、API 名与被引用文档页标题保留英文。术语首次出现按 glossary
# conventions 使用『Deutsche Übersetzung (English)』格式；行文为简洁说明句，
# 不使用感叹号。SMT 等缩写在语内首现以德语全称展开（Smart Media Token (SMT)）。
#
# en 原文的既有缺陷语义如实保留，不擅自“修正”：datbase_api.list_proposals
# 引用拼写（condenser_api.list_proposal_votes/list_proposals 各 1 处）、
# get_vesting_delegations 另见行 Paginated API Methods 重复、
# get_blog_authors 表内 alice". 缺左引号、lookup_accounts 参数行缺冒号且
# 表行缺收尾竖线、list_accounts/list_owner_histories/list_savings_withdrawals
# 等断表（列数不齐）、list_limit_orders/list_witness_votes 表内 order 值串行
# （by_effective_date/by_withdraw_route/by_destination）、
# list_vesting_delegation_expirations by_account_expiration 名义 two values
# 实列三值、get_witnesses_by_vote limit=1 行仍写 top 10、
# list_proposals 末行 by_total_votes 行文仍写 geordnet nach Ersteller 等均
# 照原文直译或原样保留。
#
# 死方法照常翻译，不因死亡而省略。计数口径 = isDeadWithCause（badge+detail）：
# 三族合计 35 个（T27 校准值，与 data/audit/drift-2026-10-28 一致）；
# get_state / verify_account_authority / account_history_api.get_transaction
# 5 个裸 badge 无 detail 的遗留条目不计入 35（与 coverage 快照裸 badge 清单一致）。23 个三期新增方法（bridge 系 14、
# condenser_api follow 分页对 2、chain_api 2、hive 1、tags 1、call 1 及 T22
# 补页清单其余）全部在内。
#
# 排序口径仍为 LC_ALL=C（字节序），是唯一口径。机械核验（LC_ALL=C sort 对
# en_US.UTF-8 sort）确认全量 238 键共有 5 处 C/UTF-8 collation 分歧对：
#   1. condenser_api.get_account_votes ↔ get_accounts（C #39/#40）
#   2. condenser_api.get_witness_schedule ↔ get_witnesses（C #110/#111，
#      UTF-8 下 schedule 排到 get_witnesses_by_vote 之后）
#   3. condenser_api.list_proposal_votes ↔ list_proposals（C #113/#114）
#   4. database_api.list_proposal_votes ↔ list_proposals（C #161/#162）
#   5. database_api.list_witness_votes ↔ list_witnesses（C #172/#173）
# 各分歧对均整体落在同一 batch 窗口内，batch 边界一律按本头注记的 C 序执行。
#
# 消费方：scripts/gen-api-docs.mjs --locale de。
# ---------------------------------------------------------------------------
schema: zh-method-purposes/v1
locale: de
batch: 1-5
purposes:
  account_by_key_api.get_key_references: |-
    Gibt alle Konten zurück, die den Schlüssel mit ihren Owner- oder Active-Berechtigungen (authority) verknüpft haben.
  account_history_api.enum_virtual_ops: |-
    Gibt die virtuellen Operationen (virtual operation) innerhalb eines Blockbereichs zurück, optional gefiltert nach Konto und Operationstyp.
  account_history_api.get_account_history: |-
    Gibt den Verlauf aller Operationen eines bestimmten Kontos zurück (Kontoverlauf).

    Siehe auch: Paginated API Methods
  account_history_api.get_ops_in_block: |-
    Gibt alle in einem Block enthaltenen Operationen zurück.
  account_history_api.get_transaction: |-
    Gibt die Details einer Transaktion (transaction) anhand einer Transaktions-ID (transaction id) zurück.
  block_api.get_block: |-
    Ruft einen vollständigen, signierten Block (block) für den referenzierten Block ab, oder null, wenn kein passender Block gefunden wurde.

    **Parameters:**

      * `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Abfrage des allerersten Blocks. |
    | `8675309` | Abfrage des Blocks mit der Nummer 8.675.309. |
    | `62396745` | Abfrage des Blocks mit der Nummer 62.396.745. |
  block_api.get_block_header: |-
    Ruft den Block-Header (block header) des referenzierten Blocks ab, oder null, wenn kein passender Block gefunden wurde.

    **Parameters:**

      * `block_num:int` - Höhe des Blocks, dessen Header zurückgegeben werden soll

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Abfrage der Block-Header für den allerersten Block. |
    | `8675309` | Abfrage der Block-Header für den Block mit der Nummer 8.675.309. |
    | `62396745` | Abfrage der Block-Header für den Block mit der Nummer 62.396.745. |
  bridge.account_notifications: |-
    Benachrichtigungen (notification) eines Kontos.

    Unterstützte Werte für `type`:
      * `new_community` - eine neue Community wurde erstellt
      * `set_role` - ein Moderator/Administrator weist einem Konto eine Rolle zu
      * `set_props` - Eigenschaften wurden für eine Community festgelegt
      * `set_label` - einem Konto wurde ein Titel/Abzeichen/Label (title/badge/label) zugewiesen
      * `mute_post` - ein Beitrag wurde mit Begründung stummgeschaltet (muted)
      * `unmute_post` - die Stummschaltung eines Beitrags wurde mit Begründung aufgehoben (unmuted)
      * `pin_post` - ein Beitrag wurde angeheftet (pinned)
      * `unpin_post` - die Anheftung eines Beitrags wurde aufgehoben (unpinned)
      * `flag_post` - ein Beitrag wurde von einem Mitglied mit Begründung gemeldet (flagged)
      * `error` - Feedback für Entwickler zu Operationen, die nicht interpretiert werden konnten
      * `subscribe` - ein Konto hat eine Community abonniert
      * `reply` - auf einen Beitrag wurde geantwortet
      * `reblog` - ein Beitrag wurde gerebloggt (reblogged/resteemed)
      * `follow` - ein Konto hat einem anderen Konto gefolgt
      * `mention` - der Autor hat ein Konto erwähnt
      * `vote` - der Wähler hat für einen Autor gestimmt

    Der Wert `score` basiert auf dem Rang (rank) des ursprünglichen Kontos.
  bridge.get_account_posts: |-
    Ruft Beiträge (post) eines Kontos ab — Blog, Feed, Kommentare oder Antworten.

    Unterstützte Werte für `sort`:
      * `blog`
      * `feed`
      * `posts`
      * `comments`
      * `replies`
      * `payout`

    Parameter: `sort:string`; `account:string`; `start_author:string` (optional, Standard: leer); `start_permlink:string` (optional, Standard: leer); `limit:int` (optional, Standard `20`, Maximum `100`); `observer:string` (optional)

    Siehe auch: bridge.get_ranked_posts
  bridge.get_community: |-
    Ruft die Details einer Community ab.
  bridge.get_community_context: |-
    Gibt für ein Community/Konto-Paar die Rolle, den Titel und den Abonnentenstatus (subscribed) des Kontos zurück.

    Parameter: `name:string` (Name der Community, z. B.: `hive-123456`); `account:string`

    Siehe auch: bridge.get_community
  bridge.get_discussion: |-
    Gibt einen vollständigen Diskussionsfaden (thread) zurück — den Root-Beitrag und seine Antworten, geschlüsselt nach `author/permlink`. Dies ist der hivemind-Ersatz für den Fadenteil von `condenser_api.get_state`.

    Parameter: `author:string`; `permlink:string`
  bridge.get_payout_stats: |-
    Ruft Auszahlungsstatistiken (payout stats) für den Aufbau einer Treemap ab: Gesamtauszahlung des Blogs plus ein `(url, label, payout, posts, authors)`-Tupel je Top-Community.

    Parameter: `limit:int` (optional, Standard `250`, Maximum `250`)
  bridge.get_post: |-
    Ruft einen einzelnen Beitrag ab.

    Parameter: `author:string`; `permlink:string`; `observer:string` (optional)
  bridge.get_post_header: |-
    Ruft grundlegende Beitragsdaten ab: Autor, Permlink (permanenter Link), Kategorie und Tiefe.

    Parameter: `author:string`; `permlink:string`
  bridge.get_profile: |-
    Lädt Konto-/Profildaten: Metadaten, Reputation, Follow-Statistiken und Blacklists.

    Parameter: `account:string`; `observer:string` (optional)
  bridge.get_ranked_posts: |-
    Ruft gereihte Beiträge (ranked posts) ab.

    Unterstützte Werte für `sort`:
      * `trending`
      * `hot`
      * `created`
      * `promoted`
      * `payout`
      * `payout_comments`
      * `muted`

    Der Wert für `tag` kann ein beliebiges gültiges Tag sein.

    Der Wert für `observer` kann ein beliebiges gültiges Konto oder ein leerer String sein.
  bridge.get_trending_topics: |-
    Gibt die angesagtesten Themen (trending topics) über ausstehende Beiträge hinweg zurück (eine Mischung aus Communities und Tags).

    Parameter: `limit:int` (optional, Standard `10`, Maximum `25`); `observer:string` (optional, noch nicht verwendet)
  bridge.list_all_subscriptions: |-
    Listet alle Community-Abonnements eines Kontos auf.
  bridge.list_communities: |-
    Listet alle Communities paginiert auf. Gibt eine kompakte Community-Liste zurück.

    Unterstützte Werte für `sort`:
      * `rank`
      * `new`
      * `subs`

    Parameter: `last:string` (optional, Standard: leer); `limit:int` (optional, Standard `100`, Maximum `100`); `query:string` (optional, Volltextsuche über Titel und Beschreibung); `sort:string` (optional, Standard `rank`); `observer:string` (optional)

    Siehe auch: bridge.get_community
  bridge.list_community_roles: |-
    Listet Community-Rollen und Labels für jedes Konto der Community auf.
  bridge.list_pop_communities: |-
    Listet Communities nach der Anzahl neuer Abonnenten auf. Gibt eine kompakte Community-Liste zurück.

    Parameter: `limit:int` (optional, Standard `25`, Maximum `25`)

    Hinweis: Stand 2026-10-28 geben öffentliche Knoten für diesen Aufruf einen Serverfehler zurück (der deployte hivemind-Build bindet den Abfrageparameter `cutoff` nie). Die Antwort unten zeigt die beabsichtigte Struktur.
  bridge.list_subscribers: |-
    Listet die Abonnenten einer Community auf (bis zu 250, neueste zuerst), als `name`/`role`/`title`/`created_at`-Tupel.

    Parameter: `community:string` (z. B.: `hive-123456`)
  bridge.normalize_post: |-
    Nimmt ein steemd-Beitragsobjekt (wie von `condenser_api.get_content` zurückgegeben) entgegen und gibt die normalisierte Version der bridge-api zurück.

    Parameter: `post:object` (ein vollständiges steemd-Beitragsobjekt, genau wie von `condenser_api.get_content` zurückgegeben, übergeben verpackt in einem Array mit einem Element: `params: [{ <post object> }]`)

    **Hinweis:** das Beitragsobjekt muss den vollständigen steemd-Feldsatz enthalten — das Beispiel unten kürzt der Lesbarkeit halber nur `body` ab. Übergabe des bloßen Objekts als `params` (ohne Array-Verpackung) liefert `-32602`; ein unvollständiges Objekt (z. B. `active_votes`-Einträge ohne `percent`/`reputation` oder fehlende Auszahlungsfelder wie `cashout_time`) liefert `-32000`.
  bridge.post_notifications: |-
    Lädt die Benachrichtigungen für einen bestimmten Beitrag.

    Parameter: `author:string`; `permlink:string`; `min_score:int` (optional, Standard `25`); `last_id:int` (optional, Suche ab dieser Benachrichtigungs-ID); `limit:int` (optional, Standard `100`, Maximum `100`)

    Hinweis: Stand 2026-10-28 geben öffentliche Knoten für diesen Aufruf bei Beiträgen mit Benachrichtigungen einen internen Fehler zurück. Die Antwort unten zeigt die beabsichtigte Struktur.

    Siehe auch: bridge.account_notifications
  bridge.unread_notifications: |-
    Lädt den Benachrichtigungsstatus für ein genanntes Konto: den Zeitpunkt der letzten Lese-Markierung und die Anzahl ungelesener Benachrichtigungen mit mindestens `min_score`.

    Parameter: `account:string`; `min_score:int` (optional, Standard `25`)

    Siehe auch: bridge.account_notifications
  call: |-
    Leitet Anfragen der Legacy-Methode `call` weiter.

    Parameter: `api:string` (nur `condenser_api` wird akzeptiert); `method:string` (eine der weitergeleiteten condenser_api-Methoden: get_followers, get_following, get_followers_by_page, get_following_by_page, get_follow_count, get_content, get_content_replies, get_trending_tags, get_state, get_discussions_by_trending, get_discussions_by_hot, get_discussions_by_promoted, get_discussions_by_created, get_post_discussions_by_payout, get_comment_discussions_by_payout, get_discussions_by_blog, get_discussions_by_feed, get_discussions_by_comments, get_replies_by_last_update, get_discussions_by_author_before_date, get_blog, get_blog_entries, get_account_votes); `params:array` (die Parameter der weitergeleiteten Methode)

    Jede andere Methode gibt einen Fehler zurück.
  chain_api.push_block: |-
    Schiebt einen Block an den Knoten.

    Parameter: `block:object` (ein signierter Block); `currently_syncing:bool` (optional, Standard `false`)

    Liefert `success:bool` und im Fehlerfall ein `error:string`.
  chain_api.push_transaction: |-
    Schiebt eine Transaktion an den Knoten.

    Parameter: das signierte Transaktionsobjekt selbst, nicht verpackt: `ref_block_num:int`; `ref_block_prefix:int`; `expiration:timestamp`; `operations:array`; `extensions:array`; `signatures:array`

    Liefert `success:bool` und im Fehlerfall ein `error:string`.
  condenser_api.broadcast_block: |-
    Wird verwendet, um einen Block zu broadcasten (broadcast).

    Siehe auch: network_broadcast_api.broadcast_block
  condenser_api.broadcast_transaction: |-
    Wird verwendet, um eine Transaktion zu broadcasten (broadcast).

    Siehe auch: network_broadcast_api.broadcast_transaction
  condenser_api.broadcast_transaction_synchronous: |-
    Wird verwendet, um eine Transaktion zu broadcasten und synchron auf ihre Verarbeitung zu warten.
  condenser_api.find_proposals: |-
    Findet Vorschläge (proposal) anhand `proposal.id` (nicht `proposal.proposal_id`).

    Siehe auch: database_api.find_proposals
  condenser_api.get_account_bandwidth: |-
    **Deaktiviert seit 0.20.6, siehe: [#3029](https://github.com/steemit/steem/issues/3029#issuecomment-428404844)**

    Gibt die verfügbare Bandbreite (bandwidth) eines Kontos zurück. Parameter: `account:string`; `type:string`, z. B.: `forum` oder `market`

    | `account` (string) | `type` (string) | |
    |--------------------|-----------------|-|
    | `"steemit"` | `"forum"` | Abfrage der verfügbaren Forum-Bandbreite für das Konto mit dem Namen "steemit". |
    | `"alice"` | `"market"` | Abfrage der verfügbaren Markt-Bandbreite für das Konto mit dem Namen "alice". |

    Siehe: Forum/Market Bandwidth
  condenser_api.get_account_count: |-
    Gibt die Anzahl der Konten zurück.
  condenser_api.get_account_history: |-
    Gibt den Verlauf aller Operationen eines bestimmten Kontos zurück. Parameter: `account:string`; `start:int`, z. B.: -1 für umgekehrten Verlauf oder eine beliebige positive Zahl; `limit:int` bis zu 10000

    | `account` (string) | `start` (int) | `limit` (int) | |
    |--------------------|---------------|---------------|-|
    | `"steemit"` | `1000` | `1000` | Abfrage des Kontos mit dem Namen `steemit` beginnend beim neuesten Eintrag des Verlaufs, bis zu 1.000 Ergebnisse. |
    | `"alice"` | `-1` | `10000` | Abfrage des Kontos mit dem Namen `alice` beginnend beim ältesten Eintrag des Verlaufs, bis zu 10.000 Ergebnisse. |

    Siehe auch: account_history_api.get_account_history, Paginated API Methods
  condenser_api.get_account_references: |-
    **Nicht implementiert**
  condenser_api.get_account_reputations: |-
    Gibt eine Liste von Konto-Reputationen zurück. Parameter: `account_lower_bound:string`; `limit:int` bis zu 1000

    | `account_lower_bound` (string) | `limit` (int) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `1` | Abfrage von Konten, die mit "steemit" beginnen, nur ein Ergebnis. |
    | `"a"` | `10` | Abfrage von Konten, die mit "a" beginnen, bis zu 10 Ergebnisse. |

    Siehe auch: follow_api.get_account_reputations
  condenser_api.get_account_votes: |-
    Gibt alle Stimmen (vote) eines Kontos zurück. Parameter: `account:string`

    | `account` (string) | |
    |-------------------|-|
    | `"steemit"` | Abfrage der Stimmen von "steemit". |
    | `"alice"` | Abfrage der Stimmen von "alice". |
  condenser_api.get_accounts: |-
    Gibt Konten zurück, abgefragt nach Name. Parameter: `account:string array`

    | `account` (string array) | |
    |-------------------|-|
    | `["steemit"]` | Abfrage des Kontos mit dem Namen "steemit". |
    | `["steemit", "alice"]` | Abfrage der Konten mit den Namen "steemit" und "alice". |

    Siehe auch: database_api.find_accounts
  condenser_api.get_active_votes: |-
    Gibt alle Stimmen für den angegebenen Beitrag zurück. Parameter: `author:string`; `permlink:string`

    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Abfrage der Stimmen für Inhalt mit dem Slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Abfrage der Stimmen für Inhalt mit dem Slug `@alice/a-post-by-alice` |

    Siehe auch: tags_api.get_active_votes
  condenser_api.get_active_witnesses: |-
    Gibt die Liste der aktiven Witness zurück.

    Siehe auch: database_api.get_active_witnesses
  condenser_api.get_block: |-
    Gibt einen Block zurück. Parameter: `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Abfrage des allerersten Blocks. |
    | `8675309` | Abfrage des Blocks mit der Nummer 8.675.309. |
    | `62396745` | Abfrage des Blocks mit der Nummer 62.396.745. |

    Siehe auch: block_api.get_block
  condenser_api.get_block_header: |-
    Gibt einen Block-Header zurück. Parameter: `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Abfrage der Block-Header für den allerersten Block. |
    | `8675309` | Abfrage der Block-Header für den Block mit der Nummer 8.675.309. |
    | `62396745` | Abfrage der Block-Header für den Block mit der Nummer 62.396.745. |

    Siehe auch: block_api.get_block_header
  condenser_api.get_blog: |-
    Gibt die Liste der Blog-Einträge eines Kontos zurück. Parameter: `account:string`; `start_entry_id:int`; `limit:int` bis zu 500

    | `account` (string) | `start_entry_id` (int) | `limit` (int) | |
    |-------------------|------------------------|---------------|-|
    | "steemit" | `0` | `1` | Abfrage des Blogs des Kontos mit dem Namen "steemit", bis zu einem Ergebnis. |
    | "alice" | `0` | `50` | Abfrage des Blogs des Kontos mit dem Namen "alice", bis zu 50 Ergebnisse. |

    Siehe auch: follow_api.get_blog, Paginated API Methods
  condenser_api.get_blog_authors: |-
    Gibt eine Liste von Autoren zurück, deren Inhalt auf einem bestimmten Blog-Konto gerebloggt wurde. Parameter: `account:string`

    | `account` (string) | |
    |-------------------|-|
    | `"steemit"` | Abfrage des Kontos mit dem Namen "steemit". |
    | `"alice"` | Abfrage der Konten mit dem Namen alice". |

    Siehe auch: follow_api.get_blog_authors
  condenser_api.get_blog_entries: |-
    Gibt die Liste der Blog-Einträge eines Kontos zurück. Parameter: `account:string`; `start_entry_id:int`; `limit:int` bis zu 500

    | `account` (string) | `start_entry_id` (int) | `limit` (int) | |
    |-------------------|------------------------|---------------|-|
    | "steemit" | `0` | `1` | Abfrage der Blog-Einträge des Kontos mit dem Namen "steemit", bis zu einem Ergebnis. |
    | "alice" | `0` | `50` | Abfrage der Blog-Einträge des Kontos mit dem Namen "alice", bis zu 50 Ergebnisse. |

    Siehe auch: follow_api.get_blog_entries, Paginated API Methods
  condenser_api.get_chain_properties: |-
    Gibt die Chain-Eigenschaften (chain properties) zurück.
  condenser_api.get_comment_discussions_by_payout: |-
    Gibt eine Liste von Diskussionen basierend auf Auszahlung (payout) zurück.

    Siehe auch: tags_api.get_comment_discussions_by_payout
  condenser_api.get_config: |-
    Gibt Informationen über Kompilierzeit-Konstanten zurück. Siehe: Understanding Configuration Values

    Siehe auch: database_api.get_config
  condenser_api.get_content: |-
    Gibt den Inhalt (Beitrag oder Kommentar) zurück. Parameter: `author:string`; `permlink:string`

    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Abfrage des Inhalts mit dem Slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Abfrage des Inhalts mit dem Slug `@alice/a-post-by-alice` |
  condenser_api.get_content_replies: |-
    Gibt eine Liste von Antworten zurück. Parameter: `author:string`; `permlink:string`

    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Abfrage der Antworten für den Slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Abfrage der Antworten für den Slug `@alice/a-post-by-alice` |

    Siehe auch: tags_api.get_content_replies
  condenser_api.get_conversion_requests: |-
    Gibt eine Konvertierungsanfrage (conversion request) zurück. Parameter: `id:integer`

    | `id` (int) | |
    |-------------------|-|
    | `1234` | Abfrage einer Konvertierungsanfrage mit der ID 1234. |

    Siehe auch: database_api.list_sbd_conversion_requests
  condenser_api.get_current_median_history_price: |-
    Gibt den aktuellen mittleren Verlaufspreis (median history price) zurück, d. h. den von den Witness gespeisten STEEM:SBD-Wechselkurs.
  condenser_api.get_discussions_by_active: |-
