# scripts/gen-nodes.mjs --locale de -> docs/de/quickstart/index.md.
#
# Deutsche Übersetzungen der Prosatexte der Seite. Die Zeilen der
# Bibliotheks- und Knotentabelle sowie das curl-Beispiel stammen aus der
# englischen Quelle und werden hier nicht übersetzt (Spaltenüberschriften
# ausgenommen); Linkziele bleiben unverändert wie in der englischen Version,
# nur der Linktext wird übersetzt. Die Terminologie folgt der eingefrorenen
# Basis docs/.vitepress/de-glossary.json: „dynamische globale Eigenschaften
# (dynamic global properties)" mit englischer Klammer bei der ersten Nennung;
# STEEM, JSON-RPC, steemd, steem-js, steemgosdk, steem-python und andere
# Bezeichner bleiben englisch. {updated} und {example_url} sind
# Generator-Platzhalter und dürfen nicht entfernt werden.
