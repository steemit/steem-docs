# ---------------------------------------------------------------------------
# it translations of API method purposes — batch 1-5（238 条全量）
# (phase4-plan §1-T30；schema/风格沿用 zh-method-purposes/v1，batch 字段标
# 语言内批次：batch 1 = C 序 #1-48、batch 2 = #49-96、batch 3 = #97-144、
# batch 4 = #145-192、batch 5 = #193-238，按写入顺序)
#
# api_method -> traduzione italiana del purpose。原文以 data/apidefinitions/*.yml 中
# 现有 en purpose 字段为准，不增不减不改语义；markdown 结构（表格/列表/加粗/
# 链接/代码 span）按原文保留，仅翻译文字内容；代码 span 内文字一律不动。
#
# 术语遵循 docs/.vitepress/it-glossary.json 的 30 条冻结基线（witness 保留英文、
# “witness” 仅作解释；quote di vesting (VESTS)、dollari STEEM (SBD)、
# Resource Credits (RC)、curation、hardfork、proprietà globali dinamiche、
# cronologia dell’account、permlink (link permanente)、proposta、post 等）；
# 方法名、参数名、字段值、API 名与被引用文档页标题保留英文。术语首次出现按
# glossary conventions 使用『意译 (English)』格式；SMT 无冻结条目，按惯用展开
# SMT (token multimediali intelligenti)。行文为简洁说明句，不使用感叹号；
# 意语缩写号统一用弯引号 ’（与 docs/it 手写页一致）。
#
# en 原文的既有缺陷语义如实保留，不擅自“修正”：condenser_api.list_proposal_votes
# /list_proposals 的 Also see 行引用拼写 datbase_api（各 1 处）、
# get_vesting_delegations 的 Also see 行 Paginated API Methods 重复、
# get_blog_authors 表内 alice". 缺左引号、lookup_accounts 参数行缺冒号
# （Parameters`lower_bound_name）、lookup_accounts/lookup_witness_accounts 表行
# 缺尾竖线、list_accounts/list_owner_histories/find_vesting_delegation_expirations
# 等断表（表头/分隔/行 列数不齐）、list_limit_orders/list_witness_votes 表内
# order 值串行（by_effective_date/by_withdraw_route/by_destination）、
# get_witnesses_by_vote 表内 limit `1` 配文 “top 10”、find_rc_accounts 表内
# 第二行只列 alice 而行文写 “alice" and "bob”、“next next vesting withdrawal”
# 等均照原文直译或原样保留。en 硬换行（Understanding Configuration Values、
# Understanding Dynamic Global Properties、get_potential_signatures 段落、
# verify_authority 句子共 6 处）在意大利语中并为一行，语义不变。
#
# 死方法（deprecated/disabled/removed 三族）照常翻译，不因死亡而省略；
# 机械核验（isDeadWithCause：死亡 flag + 非空 detail）确认全量 238 键共
# 35 个死方法（disabled 25、removed 3、deprecated 7）；23 个三期新增方法
# （bridge 系 14、condenser_api follow 分页对 2、chain_api 2、hive 1、tags 1、
# call 1 及 T22 补页清单其余）全部在内。
#
# 排序口径仍为 LC_ALL=C（字节序），是唯一口径。机械核验（LC_ALL=C sort 对
# en_US.UTF-8 sort）确认全量 238 键共有 5 处 C/UTF-8 collation 分歧对：
#   1. condenser_api.get_account_votes ↔ get_accounts（C 序 #39/#40）
#   2. condenser_api.get_witness_schedule ↔ get_witnesses（C 序 #110/#111，
#      UTF-8 下 schedule 排到 get_witnesses_by_vote 之后）
#   3. condenser_api.list_proposal_votes ↔ list_proposals（C 序 #113/#114）
#   4. database_api.list_proposal_votes ↔ list_proposals（C 序 #161/#162）
#   5. database_api.list_witness_votes ↔ list_witnesses（C 序 #172/#173）
# 各分歧对均整体落在同一 batch 窗口内，batch 边界一律按本头注记的 C 序执行。
#
# 消费方：scripts/gen-api-docs.mjs --locale it。
# ---------------------------------------------------------------------------
schema: zh-method-purposes/v1
locale: it
batch: 1-5
purposes:
  account_by_key_api.get_key_references: |-
    Restituisce tutti gli account la cui chiave è associata alle autorità (authority) owner o active.
  account_history_api.enum_virtual_ops: |-
    Restituisce le operazioni virtuali (virtual operation) in un intervallo di blocchi (block), con filtraggio facoltativo per account e per tipo di operazione.
  account_history_api.get_account_history: |-
    Restituisce la cronologia dell’account (account history) — tutte le operazioni di un account dato.

    Vedere anche: Paginated API Methods
  account_history_api.get_ops_in_block: |-
    Restituisce tutte le operazioni contenute in un blocco (block).
  account_history_api.get_transaction: |-
    Restituisce i dettagli di una transazione (transaction) a partire da un identificatore di transazione (transaction id).
  block_api.get_block: |-
    Recupera il blocco (block) firmato completo del blocco referenziato, oppure null se non è stato trovato alcun blocco corrispondente.

    **Parametri:**

      * `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Interroga il primissimo blocco. |
    | `8675309` | Interroga il blocco numero 8.675.309. |
    | `62396745` | Interroga il blocco numero 62.396.745. |
  block_api.get_block_header: |-
    Recupera l’intestazione (block header) del blocco (block) referenziato, oppure null se non è stato trovato alcun blocco corrispondente.

    **Parametri:**
      
      * `block_num:int` - Altezza del blocco di cui restituire l’intestazione

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Interroga le intestazioni per il primissimo blocco. |
    | `8675309` | Interroga le intestazioni per il blocco numero 8.675.309. |
    | `62396745` | Interroga le intestazioni per il blocco numero 62.396.745. |
  bridge.account_notifications: |-
    Notifiche (notification) di un account.

    Valori supportati per `type`:
      * `new_community` - è stata creata una nuova comunità (community)
      * `set_role` - un mod/admin assegna un ruolo a un account
      * `set_props` - proprietà impostate per una comunità
      * `set_label` - un titolo/distintivo/etichetta è stato assegnato a un account
      * `mute_post` - un post è stato messo in mute, con un motivo
      * `unmute_post` - a un post è stato tolto il mute, con un motivo
      * `pin_post` - un post è stato fissato in alto (pin)
      * `unpin_post` - il pin di un post è stato rimosso
      * `flag_post` - un post è stato segnalato (flag) da un membro, con un motivo
      * `error` - fornisce un feedback agli sviluppatori per le operazioni che non possono essere interpretate
      * `subscribe` - un account si è iscritto a una comunità
      * `reply` - un post ha ricevuto una risposta
      * `reblog` - un post è stato rebloggato/resteemato
      * `follow` - un account ha iniziato a seguirne un altro
      * `mention` - l’autore menziona un account
      * `vote` - un votante vota per un autore

    Il valore `score` si basa sul rank dell’account di origine.
  bridge.get_account_posts: |-
    Ottiene i post di un account — blog, feed, commenti o risposte.

    Valori supportati per `sort`:
      * `blog`
      * `feed`
      * `posts`
      * `comments`
      * `replies`
      * `payout`

    Parametri: `sort:string`; `account:string`; `start_author:string` (facoltativo, di default vuoto); `start_permlink:string` (facoltativo, di default vuoto); `limit:int` (facoltativo, di default `20`, max `100`); `observer:string` (facoltativo)

    Vedere anche: bridge.get_ranked_posts
  bridge.get_community: |-
    Ottiene i dettagli di una comunità (community).
  bridge.get_community_context: |-
    Per una coppia comunità/account, restituisce il ruolo, il titolo e lo stato di iscrizione dell’account.

    Parametri: `name:string` (nome della comunità, ad esempio: `hive-123456`); `account:string`

    Vedere anche: bridge.get_community
  bridge.get_discussion: |-
    Restituisce un intero thread di discussione — il post radice e le sue risposte, con chiave `author/permlink`. È la sostituzione di hivemind per la parte di thread di `condenser_api.get_state`.

    Parametri: `author:string`; `permlink:string`
  bridge.get_payout_stats: |-
    Ottiene le statistiche di pagamento (payout) per costruire una treemap: pagamento totale del blog più una tupla `(url, label, payout, posts, authors)` per ogni comunità principale.

    Parametri: `limit:int` (facoltativo, di default `250`, max `250`)
  bridge.get_post: |-
    Recupera un singolo post.

    Parametri: `author:string`; `permlink:string`; `observer:string` (facoltativo)
  bridge.get_post_header: |-
    Recupera i dati di base di un post: autore, permlink (link permanente), categoria e profondità.

    Parametri: `author:string`; `permlink:string`
  bridge.get_profile: |-
    Carica i dati di account/profilo: metadati, reputazione (reputation), statistiche di follow e blacklist.

    Parametri: `account:string`; `observer:string` (facoltativo)
  bridge.get_ranked_posts: |-
    Ottiene i post classificati (ranked posts).

    Valori supportati per `sort`:
      * `trending`
      * `hot`
      * `created`
      * `promoted`
      * `payout`
      * `payout_comments`
      * `muted`
      
    Il valore per `tag` può essere qualsiasi tag valido.

    Il valore per `observer` può essere qualsiasi account valido o una stringa vuota.
  bridge.get_trending_topics: |-
    Restituisce gli argomenti di tendenza principali tra i post in sospeso (un misto di comunità e tag).

    Parametri: `limit:int` (facoltativo, di default `10`, max `25`); `observer:string` (facoltativo, non ancora utilizzato)
  bridge.list_all_subscriptions: |-
    Elenca tutte le iscrizioni (subscription) di un account alle comunità.
  bridge.list_communities: |-
    Elenca tutte le comunità (community), con paginazione. Restituisce un elenco sintetico di comunità.

    Valori supportati per `sort`:
      * `rank`
      * `new`
      * `subs`

    Parametri: `last:string` (facoltativo, di default vuoto); `limit:int` (facoltativo, di default `100`, max `100`); `query:string` (facoltativo, ricerca a testo pieno su titolo e descrizione); `sort:string` (facoltativo, di default `rank`); `observer:string` (facoltativo)

    Vedere anche: bridge.get_community
  bridge.list_community_roles: |-
    Elenca i ruoli e le etichette di comunità per ogni account nella comunità.
  bridge.list_pop_communities: |-
    Elenca le comunità per numero di nuovi iscritti. Restituisce un elenco sintetico di comunità.

    Parametri: `limit:int` (facoltativo, di default `25`, max `25`)

    Nota: al 2026-10-28, i nodi pubblici restituiscono un errore del server per questa chiamata (la build di hivemind distribuita non associa mai il parametro di query `cutoff`). La risposta seguente mostra la forma prevista.
  bridge.list_subscribers: |-
    Elenca gli iscritti (subscriber) a una comunità (fino a 250, i più recenti prima), come tuple `name`/`role`/`title`/`created_at`.

    Parametri: `community:string` (ad esempio: `hive-123456`)
  bridge.normalize_post: |-
    Prende un oggetto post di steemd (come restituito da `condenser_api.get_content`) e produce la versione normalizzata secondo bridge-api.

    Parametri: `post:object` (un oggetto post di steemd completo, esattamente come restituito da `condenser_api.get_content`, passato avvolto in un array di un elemento: `params: [{ <post object> }]`)

    **Nota:** l’oggetto post deve portare l’insieme completo dei campi di steemd — l’esempio seguente abbrevia solo `body` per leggibilità. Passando l’oggetto nudo come `params` (senza avvolgerlo in un array) si ottiene `-32602`; un oggetto incompleto (ad esempio voci `active_votes` senza `percent`/`reputation`, o campi di payout mancanti come `cashout_time`) restituisce `-32000`.
  bridge.post_notifications: |-
    Carica le notifiche di un post specifico.

    Parametri: `author:string`; `permlink:string`; `min_score:int` (facoltativo, di default `25`); `last_id:int` (facoltativo, parte da questo id di notifica); `limit:int` (facoltativo, di default `100`, max `100`)

    Nota: al 2026-10-28, i nodi pubblici restituiscono un errore interno per questa chiamata sui post che hanno notifiche. La risposta seguente mostra la forma prevista.

    Vedere anche: bridge.account_notifications
  bridge.unread_notifications: |-
    Carica lo stato delle notifiche per un account indicato: l’ora dell’ultima lettura e il numero di notifiche non lette con punteggio di almeno `min_score`.

    Parametri: `account:string`; `min_score:int` (facoltativo, di default `25`)

    Vedere anche: bridge.account_notifications
  call: |-
    Instrada le richieste del metodo `call` in stile legacy.

    Parametri: `api:string` (viene accettato solo `condenser_api`); `method:string` (uno dei metodi instradati di condenser_api: get_followers, get_following, get_followers_by_page, get_following_by_page, get_follow_count, get_content, get_content_replies, get_trending_tags, get_state, get_discussions_by_trending, get_discussions_by_hot, get_discussions_by_promoted, get_discussions_by_created, get_post_discussions_by_payout, get_comment_discussions_by_payout, get_discussions_by_blog, get_discussions_by_feed, get_discussions_by_comments, get_replies_by_last_update, get_discussions_by_author_before_date, get_blog, get_blog_entries, get_account_votes); `params:array` (i parametri del metodo instradato)

    Qualsiasi altro metodo restituisce un errore.
  chain_api.push_block: |-
    Inserisce (push) un blocco (block) nel nodo.

    Parametri: `block:object` (un blocco firmato); `currently_syncing:bool` (facoltativo, di default `false`)

    Restituisce `success:bool` e, in caso di fallimento, un `error:string`.
  chain_api.push_transaction: |-
    Inserisce (push) una transazione (transaction) nel nodo.

    Parametri: l’oggetto transazione firmato stesso, non avvolto: `ref_block_num:int`; `ref_block_prefix:int`; `expiration:timestamp`; `operations:array`; `extensions:array`; `signatures:array`

    Restituisce `success:bool` e, in caso di fallimento, un `error:string`.
  condenser_api.broadcast_block: |-
    Usato per trasmettere (broadcast) un blocco.

    Vedere anche: network_broadcast_api.broadcast_block
  condenser_api.broadcast_transaction: |-
    Usato per trasmettere (broadcast) una transazione.

    Vedere anche: network_broadcast_api.broadcast_transaction
  condenser_api.broadcast_transaction_synchronous: |-
    Usato per trasmettere (broadcast) una transazione e ne attende l’elaborazione in modo sincrono.
  condenser_api.find_proposals: |-
    Trova le proposte (proposal) per `proposal.id` (non `proposal.proposal_id`).

    Vedere anche: database_api.find_proposals
  condenser_api.get_account_bandwidth: |-
    **Disabilitato dalla versione 0.20.6, vedere: [#3029](https://github.com/steemit/steem/issues/3029#issuecomment-428404844)**

    Restituisce la larghezza di banda (bandwidth) disponibile di un account. Parametri: `account:string`; `type:string`, ad esempio: `forum` o `market`

    | `account` (string) | `type` (string) | |
    |--------------------|-----------------|-|
    | `"steemit"` | `"forum"` | Interroga la larghezza di banda forum disponibile per l’account denominato "steemit". |
    | `"alice"` | `"market"` | Interroga la larghezza di banda market disponibile per l’account denominato "alice". |

    Vedere: Forum/Market Bandwidth
  condenser_api.get_account_count: |-
    Restituisce il numero di account.
  condenser_api.get_account_history: |-
    Restituisce la cronologia dell’account (account history) — tutte le operazioni di un account dato. Parametri: `account:string`; `start:int`. ad esempio: -1 per la cronologia inversa o qualsiasi numero positivo; `limit:int` fino a 10000

    | `account` (string) | `start` (int) | `limit` (int) | |
    |--------------------|---------------|---------------|-|
    | `"steemit"` | `1000` | `1000` | Interroga l’account denominato `steemit` partendo dall’elemento più recente nella cronologia, fino a 1.000 risultati. |
    | `"alice"` | `-1` | `10000` | Interroga l’account denominato `alice` partendo dall’elemento più vecchio nella cronologia, fino a 10.000 risultati. |

    Vedere anche: account_history_api.get_account_history, Paginated API Methods
  condenser_api.get_account_references: |-
    **Non implementato**
  condenser_api.get_account_reputations: |-
    Restituisce un elenco di reputazioni (reputation) degli account. Parametri: `account_lower_bound:string`; `limit:int` fino a 1000

    | `account_lower_bound` (string) | `limit` (int) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `1` | Interroga gli account che iniziano per "steemit", un solo risultato. |
    | `"a"` | `10` | Interroga gli account che iniziano per "a", fino a 10 risultati. |

    Vedere anche: follow_api.get_account_reputations
  condenser_api.get_account_votes: |-
    Restituisce tutti i voti (vote) espressi da un account. Parametri: `account:string`

    | `account` (string) | |
    |-------------------|-|
    | `"steemit"` | Interroga i voti di "steemit". |
    | `"alice"` | Interroga i voti di "alice". |
  condenser_api.get_accounts: |-
    Restituisce gli account, interrogati per nome. Parametri: `account:string array`

    | `account` (string array) | |
    |-------------------|-|
    | `["steemit"]` | Interroga l’account denominato "steemit". |
    | `["steemit", "alice"]` | Interroga gli account denominati "steemit" e "alice". |

    Vedere anche: database_api.find_accounts
  condenser_api.get_active_votes: |-
    Restituisce tutti i voti (vote) per il post dato. Parametri: `author:string`; `permlink:string`

    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Interroga i voti per il contenuto con slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Interroga i voti per il contenuto con slug `@alice/a-post-by-alice` |

    Vedere anche: tags_api.get_active_votes
  condenser_api.get_active_witnesses: |-
    Restituisce l’elenco dei witness attivi.

    Vedere anche: database_api.get_active_witnesses
  condenser_api.get_block: |-
    Restituisce un blocco (block). Parametri: `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Interroga il primissimo blocco. |
    | `8675309` | Interroga il blocco numero 8.675.309. |
    | `62396745` | Interroga il blocco numero 62.396.745. |

    Vedere anche: block_api.get_block
  condenser_api.get_block_header: |-
    Restituisce un’intestazione di blocco (block header). Parametri: `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Interroga le intestazioni per il primissimo blocco. |
    | `8675309` | Interroga le intestazioni per il blocco numero 8.675.309. |
    | `62396745` | Interroga le intestazioni per il blocco numero 62.396.745. |

    Vedere anche: block_api.get_block_header
  condenser_api.get_blog: |-
    Restituisce l’elenco delle voci (blog entry) del blog di un account. Parametri: `account:string`; `start_entry_id:int`; `limit:int` fino a 500

    | `account` (string) | `start_entry_id` (int) | `limit` (int) | |
    |-------------------|------------------------|---------------|-|
    | "steemit" | `0` | `1` | Interroga il blog dell’account denominato "steemit", fino a un risultato. |
    | "alice" | `0` | `50` | Interroga il blog dell’account denominato "alice", fino a 50 risultati. |

    Vedere anche: follow_api.get_blog, Paginated API Methods
  condenser_api.get_blog_authors: |-
    Restituisce un elenco di autori il cui contenuto è stato rebloggato (reblog) sul blog di un account dato. Parametri: `account:string`

    | `account` (string) | |
    |-------------------|-|
    | `"steemit"` | Interroga l’account denominato "steemit". |
    | `"alice"` | Interroga i conti denominati alice". |

    Vedere anche: follow_api.get_blog_authors
  condenser_api.get_blog_entries: |-
    Restituisce un elenco di voci (blog entry) del blog per un account. Parametri: `account:string`; `start_entry_id:int`; `limit:int` fino a 500

    | `account` (string) | `start_entry_id` (int) | `limit` (int) | |
    |-------------------|------------------------|---------------|-|
    | "steemit" | `0` | `1` | Interroga le voci del blog dell’account denominato "steemit", fino a un risultato. |
    | "alice" | `0` | `50` | Interroga le voci del blog dell’account denominato "alice", fino a 50 risultati. |

    Vedere anche: follow_api.get_blog_entries, Paginated API Methods
  condenser_api.get_chain_properties: |-
    Restituisce le proprietà della catena (chain properties).
  condenser_api.get_comment_discussions_by_payout: |-
    Restituisce un elenco di discussioni (discussion) ordinate per pagamento (payout).

    Vedere anche: tags_api.get_comment_discussions_by_payout
  condenser_api.get_config: |-
    Restituisce informazioni sulle costanti di compilazione. Vedere: Understanding Configuration Values

    Vedere anche: database_api.get_config
  condenser_api.get_content: |-
    Restituisce il contenuto (post o commento). Parametri: `author:string`; `permlink:string`

    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Interroga il contenuto con slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Interroga il contenuto con slug `@alice/a-post-by-alice` |
  condenser_api.get_content_replies: |-
    Restituisce un elenco di risposte (reply). Parametri: `author:string`; `permlink:string`


    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Interroga le risposte per lo slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Interroga le risposte per lo slug `@alice/a-post-by-alice` |

    Vedere anche: tags_api.get_content_replies
  condenser_api.get_conversion_requests: |-
    Restituisce un elenco di richieste di conversione (conversion request). Parametri: `id:integer`

    | `id` (int) | |
    |-------------------|-|
    | `1234` | Interroga una richiesta di conversione con id 1234. |

    Vedere anche: database_api.list_sbd_conversion_requests
  condenser_api.get_current_median_history_price: |-
