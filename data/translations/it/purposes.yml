  condenser_api.list_proposal_votes: |-
    Restituisce tutti i voti sulle proposte (proposal vote), a partire dal votante indicato o da `proposal.id`. Parametri: `start:array`; `limit:int`; `order:string`; `order_direction:string`; `status:string`

    * `start` dipende da `order` (vedere sotto)
      * `voter` - votante della proposta  (stringa nome account)
      * `proposal.id` - id della proposta (int)
    * `limit` è fino a 1000.
    * `order` può essere uno tra:
      * `by_voter_proposal` - ordina per votante della proposta
      * `by_proposal_voter` - ordina per `proposal.id`
    * `order_direction` può essere uno tra:
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `["alice"]` | 10 | `by_voter_proposal` | `ascending` | `active` | elenca 10 proposte con stato active, ordinate per votante, in ordine ascendente |
    | `[10]` | 1000 | `by_proposal_voter` | `ascending` | `votable` | elenca 1000 voti sulla proposta 10, ordinati per `proposal.id`, in ordine ascendente |

    Vedere anche: datbase_api.list_proposals
  condenser_api.list_proposals: |-
    Restituisce tutte le proposte (proposal), a partire dal creatore indicato o dalla data di inizio. Parametri: `start:array`; `limit:int`; `order:string`; `order_direction:string`; `status:string`

    * `start` dipende da `order` (vedere sotto)
      * `creator` - creatore della proposta  (stringa nome account)
      * `start_date` - data di inizio della proposta (stringa data)
      * `end_date` - data di fine della proposta (stringa data)
      * `total_votes` - voti totali della proposta (int)
    * `limit` è fino a 1000.
    * `order` può essere uno tra:
      * `by_creator` - ordina per creatore della proposta
      * `by_start_date` - ordina per data di inizio della proposta
      * `by_end_date` - ordina per data di fine della proposta
      * `by_total_votes` - ordina per voti totali della proposta
    * `order_direction` può essere uno tra:
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `[""]` | 10 | `by_creator` | `ascending` | `active` | elenca 10 proposte con stato active, ordinate per creatore, in ordine ascendente |
