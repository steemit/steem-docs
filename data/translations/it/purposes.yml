  transaction_status_api.find_transaction: |-
    Restituisce lo stato di un dato identificatore di transazione (transaction id). Parametri: `trx_id:string`; `expiration:timestamp` (facoltativo)

    Il risultato conterrà uno dei seguenti valori `status`:

    | Stato | Significato |
    |--------|---------|
    | `unknown` | Orario di scadenza nel futuro, transazione non inclusa in un blocco (block) né nel mempool (file delle transazioni in attesa) |
    | `within_mempool` | Transazione nel mempool (file delle transazioni in attesa) |
    | `within_reversible_block` | Transazione inclusa in un blocco, blocco non ancora irreversibile |
    | `within_irreversible_block` | Transazione inclusa in un blocco, blocco irreversibile |
    | `expired_reversible` | Transazione scaduta, transazione non irreversibile (la transazione potrebbe trovarsi in un fork) |
    | `expired_irreversible` | Transazione scaduta, transazione irreversibile (la transazione non può trovarsi in un fork) |
    | `too_old` | Transazione troppo vecchia, non risulta conoscuta |
