      * `by_permlink` - ordenar por permlink
        * `start` es un array de dos valores opcionales: `author`, `permlink`
      * `by_root` - ordenar por raíz (root)
        * `start` es un array de dos valores obligatorios y dos opcionales: `root_author`, `root_permlink`, `child_author`, `child_permlink`
      * `by_parent` - ordenar por padre (parent)
        * `start` es un array de dos valores obligatorios y dos opcionales: `parent_author`, `parent_permlink`, `child_author`, `child_permlink`

