  transaction_status_api.find_transaction: |-
    Devuelve el estado de un id de transacción (transaction id) dado.  Parámetros: `trx_id:string`; `expiration:timestamp` (opcional)

    El resultado contendrá uno de los siguientes valores de `status`:

    | Estado | Significado |
    |--------|---------|
    | `unknown` | Hora de expiración en el futuro, transacción (transaction) no incluida en bloque (block) ni en el mempool (cola de transacciones en espera) |
    | `within_mempool` | Transacción en el mempool (cola de transacciones en espera) |
    | `within_reversible_block` | Transacción incluida en un bloque, el bloque aún no es irreversible |
    | `within_irreversible_block` | Transacción incluida en un bloque, el bloque es irreversible |
    | `expired_reversible` | La transacción ha expirado, la transacción no es irreversible (podría estar en un fork) |
    | `expired_irreversible` | La transacción ha expirado, la transacción es irreversible (no puede estar en un fork) |
    | `too_old` | La transacción es demasiado antigua, no tengo constancia de ella |
