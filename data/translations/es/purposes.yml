  condenser_api.list_proposal_votes: |-
    Devuelve todos los votos a propuestas (proposal vote), empezando por el votante o el `proposal.id` especificados. Parámetros: `start:array`; `limit:int`; `order:string`; `order_direction:string`; `status:string`

    * `start` depende de `order` (ver más abajo)
      * `voter` - votante de la propuesta  (cadena con el nombre de cuenta)
      * `proposal.id` - id de la propuesta (int)
    * `limit` es hasta 1000.
    * `order` puede ser uno de:
      * `by_voter_proposal` - ordenar por votante de la propuesta
      * `by_proposal_voter` - ordenar por `proposal.id`
    * `order_direction` puede ser uno de:
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `["alice"]` | 10 | `by_voter_proposal` | `ascending` | `active` | enumera 10 propuestas con estado active, ordenadas por votante, en orden ascendente |
    | `[10]` | 1000 | `by_proposal_voter` | `ascending` | `votable` | enumera 1000 votos de la propuesta 10, ordenados por `proposal.id`, en orden ascendente |

    Véase también: datbase_api.list_proposals
  condenser_api.list_proposals: |-
    Devuelve todas las propuestas (proposal), empezando por el creador o la fecha de inicio especificados. Parámetros: `start:array`; `limit:int`; `order:string`; `order_direction:string`; `status:string`

    * `start` depende de `order` (ver más abajo)
      * `creator` - creador de la propuesta  (cadena con el nombre de cuenta)
      * `start_date` - fecha de inicio de la propuesta (cadena de fecha)
      * `end_date` - fecha de fin de la propuesta (cadena de fecha)
      * `total_votes` - votos totales de la propuesta (int)
    * `limit` es hasta 1000.
    * `order` puede ser uno de:
      * `by_creator` - ordenar por creador de la propuesta
      * `by_start_date` - ordenar por fecha de inicio de la propuesta
      * `by_end_date` - ordenar por fecha de fin de la propuesta
      * `by_total_votes` - ordenar por votos totales de la propuesta
    * `order_direction` puede ser uno de:
      * `ascending`
      * `descending`
    * `status`
      * `all`
      * `inactive`
      * `active`
      * `expired`
      * `votable`

    | `start` (array) | `limit` (int) | `order` (string) | `order_direction` (string) | `status` (string) | |
    |-------------------|-|-|-|-|-|
    | `[""]` | 10 | `by_creator` | `ascending` | `active` | enumera 10 propuestas con estado active, ordenadas por creador, en orden ascendente |
