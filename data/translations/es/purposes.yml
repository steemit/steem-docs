    | `["", ""]` | 10 | `"by_permlink"` | Consulta los primeros 10 comentarios, ordenados por permlink |
    | `["steemit","firstpost", "", ""]` | 10 | `"by_root"` | Consulta los siguientes 10 comentarios empezando en @steemit/firstpost, ordenados por raíz |
    | `["steemit","firstpost", "", ""]` | 10 | `"by_parent"` | Consulta los siguientes 10 comentarios empezando en @steemit/firstpost, ordenados por padre |

