# ---------------------------------------------------------------------------
# es translations of API method purposes — batch 1-5（238 条全量）
# (phase4-plan §1-T31；schema/风格沿用 zh-method-purposes/v1，batch 字段标
# 语言内批次：batch 1 = C 序 #1-48、batch 2 = #49-96、batch 3 = #97-144、
# batch 4 = #145-192、batch 5 = #193-238，按写入顺序)
#
# api_method -> traducción española del purpose。原文以 data/apidefinitions/*.yml 中
# 现有 en purpose 字段为准，不增不减不改语义；markdown 结构（表格/列表/加粗/
# 链接/代码 span）按原文保留，仅翻译文字内容；代码 span 内文字一律不动。
#
# 术语遵循 docs/.vitepress/es-glossary.json 的 30 条冻结基线（witness 保留英文、
# “testigo” 仅作解释；acciones de vesting (VESTS)、dólares STEEM (SBD)、
# Resource Credits (RC)、curación、hard fork、propiedades globales dinámicas、
# historial de la cuenta、permlink (enlace permanente)、propuesta、post 等）；
# 方法名、参数名、字段值、API 名与被引用文档页标题保留英文。术语首次出现按
# glossary conventions 使用『traducción española (English)』格式；SMT 无冻结条目，
# 按惯用展开 SMT (tokens de medios inteligentes)。行文为简洁说明句，不使用
# 感叹号；表内引用账户名处照原文使用直引号。
#
# en 原文的既有缺陷语义如实保留，不擅自“修正”：condenser_api.list_proposal_votes
# /list_proposals 的 Also see 行引用拼写 datbase_api（各 1 处）、
# get_vesting_delegations 的 Also see 行 Paginated API Methods 重复、
# get_blog_authors 表内 alice". 缺左引号、lookup_accounts 参数行缺冒号
# （Parámetros`lower_bound_name）、lookup_accounts/lookup_witness_accounts 表行
# 缺尾竖线、list_accounts/list_owner_histories/find_vesting_delegation_expirations
# 等断表（表头/分隔/行 列数不齐）、list_limit_orders/list_witness_votes 表内
# order 值串行（by_effective_date/by_withdraw_route/by_destination）、
# get_witnesses_by_vote 表内 limit `1` 配文 “top 10”、find_rc_accounts 表内
# 第二行只列 alice 而行文写 “alice" and "bob”、list_accounts 的
# “next next vesting withdrawal” 与 accont/withdrawl 拼写等均照原文直译或
# 原样保留。en 硬换行（Understanding Configuration Values、
# Understanding Dynamic Global Properties、get_potential_signatures 段落、
# verify_authority 句子共 6 处）在西班牙语中并为一行，语义不变。
#
# 死方法（deprecated/disabled/removed 三族）照常翻译，不因死亡而省略；
# 机械核验（isDeadWithCause：死亡 flag + 非空 detail）确认全量 238 键共
# 35 个死方法（disabled 25、removed 3、deprecated 7）；裸 badge 5 个
# （get_state、verify_account_authority ×2 变体、account_history_api.get_transaction、
# get_account_references）照常翻译；23 个三期新增方法（bridge 系 14、
# condenser_api follow 分页对 2、chain_api 2、hive 1、tags 1、call 1 及
# T22 补页清单其余）全部在内。
#
# 排序口径仍为 LC_ALL=C（字节序），是唯一口径。机械核验（LC_ALL=C sort 对
# en_US.UTF-8 sort）确认全量 238 键共有 5 处 C/UTF-8 collation 分歧对：
#   1. condenser_api.get_account_votes ↔ get_accounts（C 序 #39/#40）
#   2. condenser_api.get_witness_schedule ↔ get_witnesses（C 序 #110/#111，
#      UTF-8 下 schedule 排到 get_witnesses_by_vote 之后）
#   3. condenser_api.list_proposal_votes ↔ list_proposals（C 序 #113/#114）
#   4. database_api.list_proposal_votes ↔ list_proposals（C 序 #161/#162）
#   5. database_api.list_witness_votes ↔ list_witnesses（C 序 #172/#173）
# 各分歧对均整体落在同一 batch 窗口内，batch 边界一律按本头注记的 C 序执行。
#
# 消费方：scripts/gen-api-docs.mjs --locale es。
# ---------------------------------------------------------------------------
schema: zh-method-purposes/v1
locale: es
batch: 1-5
purposes:
  account_by_key_api.get_key_references: |-
    Devuelve todas las cuentas que tienen la clave asociada a sus autoridades (authority) de propietario o activas.
  account_history_api.enum_virtual_ops: |-
    Devuelve las operaciones virtuales (virtual operation) dentro de un rango de bloques (block), con filtrado opcional por cuenta y por tipo de operación.
  account_history_api.get_account_history: |-
    Devuelve el historial de la cuenta (account history) — todas las operaciones de una cuenta dada.

    Véase también: Paginated API Methods
  account_history_api.get_ops_in_block: |-
    Devuelve todas las operaciones contenidas en un bloque (block).
  account_history_api.get_transaction: |-
    Devuelve los detalles de una transacción (transaction) a partir de un id de transacción.
  block_api.get_block: |-
    Recupera el bloque (block) firmado completo del bloque referenciado, o null si no se encontró ningún bloque coincidente.

    **Parámetros:**

      * `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Consulta el primer bloque de todos. |
    | `8675309` | Consulta el bloque número 8.675.309. |
    | `62396745` | Consulta el bloque número 62.396.745. |
  block_api.get_block_header: |-
    Recupera la cabecera de bloque (block header) del bloque referenciado, o null si no se encontró ningún bloque coincidente.

    **Parámetros:**
      
      * `block_num:int` - Altura del bloque cuya cabecera debe devolverse

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Consulta las cabeceras del primer bloque de todos. |
    | `8675309` | Consulta las cabeceras del bloque número 8.675.309. |
    | `62396745` | Consulta las cabeceras del bloque número 62.396.745. |
  bridge.account_notifications: |-
    Notificaciones de cuenta (account notifications).

    Valores admitidos para `type`:
      * `new_community` - se creó una nueva comunidad (community)
      * `set_role` - un mod/admin añade un rol (role) a una cuenta
      * `set_props` - se establecieron propiedades para una comunidad
      * `set_label` - se estableció un título/distintivo/etiqueta (label) para una cuenta
      * `mute_post` - un post (publicación) fue silenciado (mute), con un motivo
      * `unmute_post` - se quitó el silencio a un post, con un motivo
      * `pin_post` - un post fue fijado (pin)
      * `unpin_post` - se quitó el fijado de un post
      * `flag_post` - un post fue marcado con flag por un miembro, con un motivo
      * `error` - ofrece retroalimentación a los desarrolladores para operaciones (ops) que no se pueden interpretar
      * `subscribe` - una cuenta se suscribió a una comunidad
      * `reply` - un post recibió una respuesta
      * `reblog` - un post fue reblogueado/repromocionado (reblogged/resteemed)
      * `follow` - una cuenta siguió a otra cuenta
      * `mention` - el autor menciona a una cuenta
      * `vote` - el votante vota a un autor

    El valor de `score` se basa en la clasificación (rank) de la cuenta de origen.
  bridge.get_account_posts: |-
    Obtiene los posts (publicación) de una cuenta — blog, feed, comentarios o respuestas.

    Valores admitidos para `sort`:
      * `blog`
      * `feed`
      * `posts`
      * `comments`
      * `replies`
      * `payout`

    Parámetros: `sort:string`; `account:string`; `start_author:string` (opcional, vacío por defecto); `start_permlink:string` (opcional, vacío por defecto); `limit:int` (opcional, `20` por defecto, máximo `100`); `observer:string` (opcional)

    Véase también: bridge.get_ranked_posts
  bridge.get_community: |-
    Obtiene los detalles de una comunidad (community).
  bridge.get_community_context: |-
    Para un par comunidad/cuenta, devuelve el rol de la cuenta, su título y su estado de suscripción.

    Parámetros: `name:string` (nombre de la comunidad, p. ej.: `hive-123456`); `account:string`

    Véase también: bridge.get_community
  bridge.get_discussion: |-
    Devuelve un hilo de discusión (thread) completo — el post raíz y sus respuestas, indexados por `author/permlink`. Es el reemplazo de hivemind para la parte de hilo de `condenser_api.get_state`.

    Parámetros: `author:string`; `permlink:string`
  bridge.get_payout_stats: |-
    Obtiene estadísticas de pagos (payout) para construir un treemap: el pago total del blog más una tupla `(url, label, payout, posts, authors)` por cada comunidad principal.

    Parámetros: `limit:int` (opcional, `250` por defecto, máximo `250`)
  bridge.get_post: |-
    Obtiene un único post (publicación).

    Parámetros: `author:string`; `permlink:string`; `observer:string` (opcional)
  bridge.get_post_header: |-
    Obtiene datos básicos de un post (publicación): autor, permlink (enlace permanente), categoría y profundidad.

    Parámetros: `author:string`; `permlink:string`
  bridge.get_profile: |-
    Carga los datos de cuenta/perfil (profile): metadatos, reputación, estadísticas de seguimiento y listas negras (blacklist).

    Parámetros: `account:string`; `observer:string` (opcional)
  bridge.get_ranked_posts: |-
    Obtiene posts (publicación) clasificados (ranked).

    Valores admitidos para `sort`:
      * `trending`
      * `hot`
      * `created`
      * `promoted`
      * `payout`
      * `payout_comments`
      * `muted`
      
    El valor de `tag` puede ser cualquier etiqueta (tag) válida.

    El valor de `observer` puede ser cualquier cuenta válida o una cadena vacía.
  bridge.get_trending_topics: |-
    Devuelve los principales temas en tendencia (trending) entre los posts pendientes (una mezcla de comunidades y etiquetas).

    Parámetros: `limit:int` (opcional, `10` por defecto, máximo `25`); `observer:string` (opcional, aún sin uso)
  bridge.list_all_subscriptions: |-
    Enumera todas las suscripciones (subscription) de una cuenta a una comunidad.
  bridge.list_communities: |-
    Enumera todas las comunidades (community), paginadas. Devuelve una lista ligera de comunidades.

    Valores admitidos para `sort`:
      * `rank`
      * `new`
      * `subs`

    Parámetros: `last:string` (opcional, vacío por defecto); `limit:int` (opcional, `100` por defecto, máximo `100`); `query:string` (opcional, búsqueda de texto completo en el título y el «acerca de»); `sort:string` (opcional, `rank` por defecto); `observer:string` (opcional)

    Véase también: bridge.get_community
  bridge.list_community_roles: |-
    Enumera los roles y las etiquetas (label) de cada cuenta de la comunidad.
  bridge.list_pop_communities: |-
    Enumera comunidades por número de nuevos suscriptores. Devuelve una lista ligera de comunidades.

    Parámetros: `limit:int` (opcional, `25` por defecto, máximo `25`)

    Nota: a fecha de 2026-10-28, los nodos públicos devuelven un error de servidor para esta llamada (la build de hivemind desplegada nunca vincula el parámetro de consulta `cutoff`). La respuesta de abajo muestra la forma prevista.
  bridge.list_subscribers: |-
    Enumera los suscriptores (subscriber) de una comunidad (hasta 250, los más nuevos primero), como tuplas `name`/`role`/`title`/`created_at`.

    Parámetros: `community:string` (p. ej.: `hive-123456`)
  bridge.normalize_post: |-
    Toma un objeto post (publicación) de steemd (tal como lo devuelve `condenser_api.get_content`) y produce la versión normalizada (normalized) de la bridge-api.

    Parámetros: `post:object` (un objeto post de steemd completo, exactamente como lo devuelve `condenser_api.get_content`, pasado envuelto en un array de un elemento: `params: [{ <post object> }]`)

    **Nota:** el objeto post debe llevar el conjunto completo de campos de steemd — el ejemplo de abajo abrevia solo `body` por legibilidad. Pasar el objeto desnudo como `params` (sin envolver en array) devuelve `-32602`; un objeto incompleto (p. ej. entradas `active_votes` sin `percent`/`reputation`, o campos de pago ausentes como `cashout_time`) devuelve `-32000`.
  bridge.post_notifications: |-
    Carga las notificaciones (notification) de un post (publicación) concreto.

    Parámetros: `author:string`; `permlink:string`; `min_score:int` (opcional, `25` por defecto); `last_id:int` (opcional, buscar a partir de este id de notificación); `limit:int` (opcional, `100` por defecto, máximo `100`)

    Nota: a fecha de 2026-10-28, los nodos públicos devuelven un error interno para esta llamada en posts que tienen notificaciones. La respuesta de abajo muestra la forma prevista.

    Véase también: bridge.account_notifications
  bridge.unread_notifications: |-
    Carga el estado de notificaciones (notification) de una cuenta dada: la hora de última lectura y el número de notificaciones no leídas con una puntuación de al menos `min_score`.

    Parámetros: `account:string`; `min_score:int` (opcional, `25` por defecto)

    Véase también: bridge.account_notifications
  call: |-
    Enruta las peticiones del método `call` en estilo legacy.

    Parámetros: `api:string` (solo se acepta `condenser_api`); `method:string` (uno de los métodos enrutados de condenser_api: get_followers, get_following, get_followers_by_page, get_following_by_page, get_follow_count, get_content, get_content_replies, get_trending_tags, get_state, get_discussions_by_trending, get_discussions_by_hot, get_discussions_by_promoted, get_discussions_by_created, get_post_discussions_by_payout, get_comment_discussions_by_payout, get_discussions_by_blog, get_discussions_by_feed, get_discussions_by_comments, get_replies_by_last_update, get_discussions_by_author_before_date, get_blog, get_blog_entries, get_account_votes); `params:array` (los parámetros del método enrutado)

    Cualquier otro método devuelve un error.
  chain_api.push_block: |-
    Envía un bloque (block) al nodo (push).

    Parámetros: `block:object` (un bloque firmado); `currently_syncing:bool` (opcional, `false` por defecto)

    Devuelve `success:bool` y, en caso de fallo, un `error:string`.
  chain_api.push_transaction: |-
    Envía una transacción (transaction) al nodo (push).

    Parámetros: el propio objeto de transacción firmado, sin envolver: `ref_block_num:int`; `ref_block_prefix:int`; `expiration:timestamp`; `operations:array`; `extensions:array`; `signatures:array`

    Devuelve `success:bool` y, en caso de fallo, un `error:string`.
  condenser_api.broadcast_block: |-
    Se usa para hacer broadcast de un bloque (block).

    Véase también: network_broadcast_api.broadcast_block
  condenser_api.broadcast_transaction: |-
    Se usa para hacer broadcast de una transacción (transaction).

    Véase también: network_broadcast_api.broadcast_transaction
  condenser_api.broadcast_transaction_synchronous: |-
    Se usa para hacer broadcast de una transacción (transaction) y espera a que se procese de forma síncrona.
  condenser_api.find_proposals: |-
    Encuentra propuestas (proposal) por `proposal.id` (no por `proposal.proposal_id`).

    Véase también: database_api.find_proposals
  condenser_api.get_account_bandwidth: |-
    **Desactivado desde la versión 0.20.6, véase: [#3029](https://github.com/steemit/steem/issues/3029#issuecomment-428404844)**

    Devuelve el ancho de banda (bandwidth) disponible de una cuenta. Parámetros: `account:string`; `type:string`, p. ej.: `forum` o `market`

    | `account` (string) | `type` (string) | |
    |--------------------|-----------------|-|
    | `"steemit"` | `"forum"` | Consulta el ancho de banda de forum disponible para la cuenta llamada "steemit". |
    | `"alice"` | `"market"` | Consulta el ancho de banda de market disponible para la cuenta llamada "alice". |

    Véase: Forum/Market Bandwidth
  condenser_api.get_account_count: |-
    Devuelve el número de cuentas.
  condenser_api.get_account_history: |-
    Devuelve el historial de la cuenta (account history) — todas las operaciones de una cuenta dada. Parámetros: `account:string`; `start:int`. p. ej.: -1 para el historial inverso o cualquier número positivo; `limit:int` hasta 10000

    | `account` (string) | `start` (int) | `limit` (int) | |
    |--------------------|---------------|---------------|-|
    | `"steemit"` | `1000` | `1000` | Consulta la cuenta llamada `steemit` empezando por el elemento más reciente del historial, hasta 1.000 resultados. |
    | `"alice"` | `-1` | `10000` | Consulta la cuenta llamada `alice` empezando por el elemento más antiguo del historial, hasta 10.000 resultados. |

    Véase también: account_history_api.get_account_history, Paginated API Methods
  condenser_api.get_account_references: |-
    **No implementado**
  condenser_api.get_account_reputations: |-
    Devuelve una lista de reputaciones (reputation) de cuentas. Parámetros: `account_lower_bound:string`; `limit:int` hasta 1000

    | `account_lower_bound` (string) | `limit` (int) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `1` | Consulta las cuentas que empiezan por "steemit", un único resultado. |
    | `"a"` | `10` | Consulta las cuentas que empiezan por "a", hasta 10 resultados. |

    Véase también: follow_api.get_account_reputations
  condenser_api.get_account_votes: |-
    Devuelve todos los votos (vote) de una cuenta. Parámetros: `account:string`

    | `account` (string) | |
    |-------------------|-|
    | `"steemit"` | Consulta los votos de "steemit". |
    | `"alice"` | Consulta los votos de "alice". |
  condenser_api.get_accounts: |-
    Devuelve cuentas, consultadas por nombre. Parámetros: `account:string array`

    | `account` (string array) | |
    |-------------------|-|
    | `["steemit"]` | Consulta la cuenta llamada "steemit". |
    | `["steemit", "alice"]` | Consulta las cuentas llamadas "steemit" y "alice". |

    Véase también: database_api.find_accounts
  condenser_api.get_active_votes: |-
    Devuelve todos los votos (vote) de un post (publicación) dado. Parámetros: `author:string`; `permlink:string`

    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Consulta los votos del contenido con slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Consulta los votos del contenido con slug `@alice/a-post-by-alice` |

    Véase también: tags_api.get_active_votes
  condenser_api.get_active_witnesses: |-
    Devuelve la lista de witness (testigo) activos.

    Véase también: database_api.get_active_witnesses
  condenser_api.get_block: |-
    Devuelve un bloque (block). Parámetros: `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Consulta el primer bloque de todos. |
    | `8675309` | Consulta el bloque número 8.675.309. |
    | `62396745` | Consulta el bloque número 62.396.745. |

    Véase también: block_api.get_block
  condenser_api.get_block_header: |-
    Devuelve una cabecera de bloque (block header). Parámetros: `block_num:int`

    | `block_num` (int) | |
    |-------------------|-|
    | `1` | Consulta las cabeceras del primer bloque de todos. |
    | `8675309` | Consulta las cabeceras del bloque número 8.675.309. |
    | `62396745` | Consulta las cabeceras del bloque número 62.396.745. |

    Véase también: block_api.get_block_header
  condenser_api.get_blog: |-
    Devuelve la lista de entradas (entry) del blog de una cuenta. Parámetros: `account:string`; `start_entry_id:int`; `limit:int` hasta 500

    | `account` (string) | `start_entry_id` (int) | `limit` (int) | |
    |-------------------|------------------------|---------------|-|
    | "steemit" | `0` | `1` | Consulta el blog de la cuenta llamada "steemit", hasta un resultado. |
    | "alice" | `0` | `50` | Consulta el blog de la cuenta llamada "alice", hasta 50 resultados. |

    Véase también: follow_api.get_blog, Paginated API Methods
  condenser_api.get_blog_authors: |-
    Devuelve una lista de autores cuyo contenido fue reblogueado (reblog) en el blog de una cuenta dada. Parámetros: `account:string`

    | `account` (string) | |
    |-------------------|-|
    | `"steemit"` | Consulta la cuenta llamada "steemit". |
    | `"alice"` | Consulta las cuentas llamadas alice". |

    Véase también: follow_api.get_blog_authors
  condenser_api.get_blog_entries: |-
    Devuelve la lista de entradas (entry) del blog de una cuenta. Parámetros: `account:string`; `start_entry_id:int`; `limit:int` hasta 500

    | `account` (string) | `start_entry_id` (int) | `limit` (int) | |
    |-------------------|------------------------|---------------|-|
    | "steemit" | `0` | `1` | Consulta las entradas del blog de la cuenta llamada "steemit", hasta un resultado. |
    | "alice" | `0` | `50` | Consulta las entradas del blog de la cuenta llamada "alice", hasta 50 resultados. |

    Véase también: follow_api.get_blog_entries, Paginated API Methods
  condenser_api.get_chain_properties: |-
    Devuelve las propiedades de la cadena (chain properties).
  condenser_api.get_comment_discussions_by_payout: |-
    Devuelve una lista de discusiones (discussion) de comentarios por pago (payout).

    Véase también: tags_api.get_comment_discussions_by_payout
  condenser_api.get_config: |-
    Devuelve información sobre las constantes de compilación. Véase: Understanding Configuration Values

    Véase también: database_api.get_config
  condenser_api.get_content: |-
    Devuelve el contenido (post o comentario). Parámetros: `author:string`; `permlink:string`

    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Consulta el contenido con slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Consulta el contenido con slug `@alice/a-post-by-alice` |
  condenser_api.get_content_replies: |-
    Devuelve una lista de respuestas. Parámetros: `author:string`; `permlink:string`


    | `author` (string) | `permlink` (string) | |
    |----------------------------|---------------|-|
    | `"steemit"` | `"firstpost"` | Consulta las respuestas del contenido con slug `@steemit/firstpost` |
    | `"alice"` | `"a-post-by-alice"` | Consulta las respuestas del contenido con slug `@alice/a-post-by-alice` |

    Véase también: tags_api.get_content_replies
  condenser_api.get_conversion_requests: |-
    Devuelve una lista de solicitudes de conversión (conversion request). Parámetros: `id:integer`

    | `id` (int) | |
    |-------------------|-|
