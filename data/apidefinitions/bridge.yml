  - api_method: bridge.post_notifications
    purpose: |
      Load notifications for a specific post.

      Parameters: `author:string`; `permlink:string`; `min_score:int` (optional, defaults to `25`); `last_id:int` (optional, seek from this notification id); `limit:int` (optional, defaults to `100`, max `100`)

      Note: as of 2026-10-28, public nodes return an internal error for this call on posts that have notifications. The response below shows the intended shape.

      Also see: bridge.account_notifications
    parameter_json: '{"author":"steemitblog","permlink":"steemit-update-october-25th-2026-steemit-challenge-season-34-week-10","limit":2}'
    expected_response_json: |
      [{
        "id": 3629306,
        "type": "vote",
        "score": 25,
        "date": "2019-11-20T07:48:06",
        "msg": "@bob voted on your post ($0.013)",
        "url": "@alice/a-post-by-alice"
      }]
    curl_examples:
    - '{"jsonrpc":"2.0", "method":"bridge.post_notifications", "params":{"author":"steemitblog","permlink":"steemit-update-october-25th-2026-steemit-challenge-season-34-week-10","limit":2}, "id":1}'
  - api_method: bridge.unread_notifications
    purpose: |
      Load notification status for a named account: the last-read time and the count of unread notifications scoring at least `min_score`.

      Parameters: `account:string`; `min_score:int` (optional, defaults to `25`)

      Also see: bridge.account_notifications
