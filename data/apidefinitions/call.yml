---
- name: Call
  description: |
    Legacy JSON-RPC `call` convention adapter served by the hivemind API server.
  methods:
  - api_method: call
    purpose: |
      Routes legacy-style `call` method requests.

      Parameters: `api:string` (only `condenser_api` is accepted); `method:string` (one of the routed condenser_api methods: get_followers, get_following, get_followers_by_page, get_following_by_page, get_follow_count, get_content, get_content_replies, get_trending_tags, get_state, get_discussions_by_trending, get_discussions_by_hot, get_discussions_by_promoted, get_discussions_by_created, get_post_discussions_by_payout, get_comment_discussions_by_payout, get_discussions_by_blog, get_discussions_by_feed, get_discussions_by_comments, get_replies_by_last_update, get_discussions_by_author_before_date, get_blog, get_blog_entries, get_account_votes); `params:array` (the parameters of the routed method)

      Any other method returns an error.
    parameter_json: '["condenser_api","get_follow_count",["steemit"]]'
    expected_response_json: '{"account":"steemit","follower_count":3550,"following_count":0}'
    curl_examples:
    - '{"jsonrpc":"2.0", "method":"call", "params":["condenser_api","get_follow_count",["steemit"]], "id":1}'
