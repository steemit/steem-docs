  - api_method: follow_api.get_followers_by_page
    purpose: |
      Returns the followers for an account, by page.  (EOL)  Alias of `condenser_api.get_followers_by_page`: parameters are passed as a positional array -- `account:string`; `page:int` (1-based); `page_size:int` (optional, defaults to `100`, max `100`); `follow_type:string` (optional, defaults to `blog`).

      **Note:** some nodes reject the named-parameter form with `-32602`; pass a positional array.

      | `account` (string) | `page` (int) | `page_size` (int) | |
      |--------------------|--------------|-------------------|-|
      | `"steemit"` | `1` | `5` | Queries page 1 of the accounts following `steemit`, 5 per page. |
      | `"alice"` | `2` | `100` | Queries page 2 of the accounts following `alice`, 100 per page. |

      Also see: condenser_api.get_followers_by_page, Paginated API Methods
    parameter_json:
    - steemit
    - 1
    - 5
    expected_response_json: |
      [
        {"follower":"etette","following":"steemit","reputation":73.4,"what":["blog"]},
        {"follower":"victorlives","following":"steemit","reputation":60.17,"what":["blog"]}
      ]
    curl_examples:
    - '{"jsonrpc":"2.0", "method":"follow_api.get_followers_by_page", "params":["steemit",1,5], "id":1}'
  - api_method: follow_api.get_following
    since: HF9
    purpose: |
      Returns the list of accounts that are following an account.
      
