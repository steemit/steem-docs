# Steem public API nodes — replaced 2026-10-31 (UTC) with the community monitor
# list (17 nodes). Every node was probed for JSON-RPC liveness the same day:
# POST condenser_api.get_dynamic_global_properties with a 15-second timeout;
# all listed nodes answered with a mutually consistent head block
# (110920872-110920874).
#
# The list is community-maintained: before adding/removing a row, re-test the node
# (curl -m 15 -X POST https://<node>/ -H 'Content-Type: application/json' \
#  -d '{"jsonrpc":"2.0","method":"condenser_api.get_dynamic_global_properties",
#      "params":[],"id":1}'), update `updated` and the EXPECTED_* constants in
# scripts/gen-nodes.mjs, then re-run `pnpm gen:nodes`.
#
# Rendered by scripts/gen-nodes.mjs -> docs/quickstart/index.md (the generated page
# is committed; do not edit it by hand).
